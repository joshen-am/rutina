<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>keystone</title>
<style>
  html, body { margin: 0; height: 100%; background: #0B0B0C; color: #FAFAFA; font-family: -apple-system, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  main { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 0 32px; box-sizing: border-box; text-align: center; }
  .orb { width: 96px; height: 96px; border-radius: 50%; position: relative; overflow: hidden; background: radial-gradient(circle at 50% 60%, #0D2A22, #050807 70%); box-shadow: inset 0 0 0 1px rgba(255,255,255,.26), 0 0 24px rgba(31,211,138,.35); }
  .orb span { position: absolute; border-radius: 50%; transform: translate(-50%, -50%); filter: blur(11px); }
  h1 { margin: 6px 0 0; font-size: 24px; font-weight: 600; letter-spacing: -0.03em; }
  p { margin: 0; font-size: 15px; line-height: 22px; color: #A1A1AA; max-width: 300px; }
  button { margin-top: 8px; appearance: none; border: 0; height: 50px; padding: 0 28px; border-radius: 999px; background: #FAFAFA; color: #09090B; font: inherit; font-size: 16px; font-weight: 600; }
</style>
</head>
<body>
<main>
  <div class="orb" aria-hidden="true">
    <span style="left:36%;top:62%;width:70%;height:70%;background:#1FD38A"></span>
    <span style="left:68%;top:40%;width:60%;height:60%;background:#18C2D8;opacity:.9"></span>
    <span style="left:46%;top:30%;width:46%;height:46%;background:#B6F05A;opacity:.85"></span>
    <span style="left:70%;top:74%;width:40%;height:40%;background:#2C7BFF;opacity:.7"></span>
  </div>
  <h1>Sin conexión</h1>
  <p>keystone necesita internet la primera vez que se abre. Después funciona sin conexión.</p>
  <button type="button" onclick="location.href='https://joshen-am.github.io/rutina/'">Reintentar</button>
</main>
</body>
</html>
