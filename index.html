<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>keystone</title>
<meta name="description" content="Entrenamiento, comida, hábitos y perfil de salud en un solo lugar.">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="keystone">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32-orbe.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/favicon-192-orbe.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-orbe.png">
<link rel="preload" href="fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="apple-touch-startup-image" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="icons/splash-1170x2532-orbe.png">
<style>
@font-face{font-family:'Geist';src:url('fonts/Geist-Variable.woff2') format('woff2');font-weight:100 900;font-display:swap}
@font-face{font-family:'Geist Mono';src:url('fonts/GeistMono-Variable.woff2') format('woff2');font-weight:100 900;font-display:swap}
html,body{margin:0;height:var(--app-h,100%);overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%;touch-action:manipulation;background:#FFFFFF}
#app{position:fixed;top:0;left:0;right:0;height:var(--app-h,100%)}
input{-webkit-user-select:text;user-select:text}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

body{margin:0}
button{-webkit-tap-highlight-color:transparent;transition:opacity .16s var(--ease-out), transform .16s var(--ease-out)}
button:active{opacity:.88;transform:scale(.98)}
input::placeholder,textarea::placeholder{color:#6B6B74}
input:focus-visible,button:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid #71717A!important;outline-offset:2px}
.hit{position:relative}
.hit::after{content:"";position:absolute;inset:-4px 0}
.hit-sw::after{inset:-7px -4px}
@keyframes present{from{transform:translateY(100%)}to{transform:none}}
@keyframes sheet{from{transform:translateY(105%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes menu{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes push{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
.scroll>*{flex-shrink:0}
.scroll{scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.push{animation:push .38s cubic-bezier(.32,.72,0,1) both}
/* Movimiento (versión 26): todo entra una vez, al aparecer, y nada queda en bucle.
   Todo lo que entra usa ease-out: arranca rápido y llega suave, también el barrido del escáner. */
:root{--ease-out:cubic-bezier(0.23,1,0.32,1)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@keyframes bloom{from{opacity:0;transform:translateY(14%) scale(.94)}}
@keyframes ringIn{from{stroke-dashoffset:var(--full)}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes colIn{from{transform:scaleY(0)}}
@keyframes lineIn{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes scanIn{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0)}}
@keyframes scanLine{from{transform:translateY(-100%);opacity:1}85%{opacity:1}to{transform:translateY(0);opacity:0}}
@keyframes scanUp{from{clip-path:inset(100% 0 0 0)}to{clip-path:inset(0)}}
[data-motion="on"] .scr>*{animation:rise .42s var(--ease-out) both}
[data-motion="on"] .scr>:nth-child(2){animation-delay:40ms}
[data-motion="on"] .scr>:nth-child(3){animation-delay:80ms}
[data-motion="on"] .scr>:nth-child(4){animation-delay:120ms}
[data-motion="on"] .scr>:nth-child(5){animation-delay:160ms}
[data-motion="on"] .scr>:nth-child(6){animation-delay:200ms}
[data-motion="on"] .scr>:nth-child(n+7){animation-delay:240ms}
[data-motion="on"] .halo{animation:bloom 1.1s var(--ease-out) both}
[data-motion="on"] .ring-in{animation:ringIn 1s var(--ease-out) .12s both}
[data-motion="on"] .bar-in{transform-origin:left center;animation:grow .8s var(--ease-out) .16s both}
[data-motion="on"] .seg-in{transform-origin:left center;animation:grow .7s var(--ease-out) both}
[data-motion="on"] .col-in{transform-origin:center bottom;animation:colIn .7s var(--ease-out) both}
[data-motion="on"] .line-in{stroke-dasharray:1;animation:lineIn 1.2s var(--ease-out) .2s both}
.pg::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;background:linear-gradient(to bottom,rgba(250,250,250,0) 70%,rgba(250,250,250,.08) 99.2%,rgba(250,250,250,.9) 99.6%)}
[data-motion="on"] .pg[data-on="1"]>img{animation:scanIn .6s var(--ease-out) both}
[data-motion="on"] .pg[data-on="1"]::after{animation:scanLine .6s var(--ease-out) both}
[data-motion="on"] .bm-reveal{animation:scanUp 1.1s var(--ease-out) .35s both}
@media (prefers-reduced-motion: reduce){
[data-motion="on"] .scr>*,[data-motion="on"] .halo{animation-name:fade}
[data-motion="on"] .ring-in,[data-motion="on"] .bar-in,[data-motion="on"] .seg-in,[data-motion="on"] .col-in,[data-motion="on"] .line-in,[data-motion="on"] .pg[data-on="1"]>img,[data-motion="on"] .pg[data-on="1"]::after,[data-motion="on"] .bm-reveal{animation:none}
.push,[style*="animation: sheet"],[style*="animation: present"],[style*="animation: push"]{animation-name:fade!important}
button{transition:opacity .16s ease}button:active{transform:none}
}

</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div data-motion="{{ motion }}" style="width: 100%; max-width: 640px; margin: 0 auto; height: 100%; position: relative; overflow: hidden; background: {{ th.bg }}; color: {{ th.text }}; font-family: {{ font }}; line-height: 1.35; -webkit-font-smoothing: antialiased">
<sc-if value="{{ showInicio }}" hint-placeholder-val="{{ false }}">
<div id="sc-showInicio" class="scroll scr" style="position: absolute; inset: 0; overflow-y: auto; box-sizing: border-box; padding: calc(env(safe-area-inset-top) + 44px) 16px 210px; display: flex; flex-direction: column; gap: 16px">
<header style="display: flex; flex-direction: column; gap: 24px; padding: 0 4px 4px"><div style="display: flex; align-items: center; justify-content: space-between; gap: 12px"><span aria-label="keystone" style="display: flex; align-items: center; gap: 8px"><img src="img/orb-{{ orb.k }}.png" alt="" aria-hidden="true" style="width: 24px; height: 24px; flex: none; border-radius: 50%; box-shadow: 0 0.7px 1.9px rgba(0, 0, 0, 0.22)"><span style="font-size: 20px; font-weight: 500; letter-spacing: -0.055em">keystone</span></span><span style="display: flex; gap: 8px"><button type="button" onClick="{{ chat.open }}" aria-label="Hablar con tu entrenador" style="appearance: none; border: 0; margin: 0; padding: 0; font: inherit; cursor: pointer; padding: 0; width: 44px; height: 44px; flex: none; border-radius: 50%; background: {{ th.fill }}; color: {{ th.text }}; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path></svg></button><button type="button" onClick="{{ openMenu }}" aria-label="Perfil y apariencia" style="appearance: none; border: 0; margin: 0; padding: 0; font: inherit; cursor: pointer; padding: 0; width: 44px; height: 44px; flex: none; border-radius: 50%; background: {{ th.fill }}; color: {{ th.text }}; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 500">{{ initial }}</button></span></div><h1 style="margin: 0; font-size: 34px; line-height: 40px; font-weight: 400; letter-spacing: -0.045em">{{ dateLabel }}</h1></header>
<sc-if value="{{ showBackupNudge }}" hint-placeholder-val="{{ false }}">
<section aria-label="Respaldo" style="background: {{ th.card }}; box-shadow: {{ th.cardShadow }}; border-radius: 24px; padding: 16px 20px; display: flex; flex-direction: column; gap: 12px">
<span style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 16px; font-weight: 500">Tu respaldo semanal</span><span style="font-size: 16px; line-height: 24px; color: {{ th.sub }}">Tus datos viven solo en este teléfono. Un toque y queda una copia en Archivos o iCloud Drive.</span></span>
<div style="display: flex; gap: 8px"><button type="button" onClick="{{ exportBackup }}"  style="appearance: none; border: 0; margin: 0; padding: 0; font: inherit; cursor: pointer; height: 44px; padding: 0 24px; border-radius: 999px; background: {{ th.inv }}; color: {{ th.onInv }}; font-size: 16px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 8px; flex: 1">Guardar respaldo</button><button type="button" onClick="{{ snoozeBackup }}"  style="appearance: none; border: 0; margin: 0; padding: 0; font: inherit; cursor: pointer; height: 44px; padding: 0 24px; border-radius: 999px; background: {{ th.fill }}; color: {{ th.text }}; font-size: 16px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 8px; flex: 1">Ahora no</button></div>
</section>
</sc-if>
<div style="order: {{ ho.diario.order }}; display: {{ ho.diario.display }}; border-radius: 24px; padding: {{ ho.pad }}; box-shadow: {{ ho.frame }}">
<sc-if value="{{ editHome }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 4px 12px">
<span style="font-size: 16px; font-weight: 500">{{ ho.diario.label }}</span>
<div style="display: flex; align-items: center; gap: 8px">
<button type="button" onClick="{{ ho.diario.up }}" aria-label="Subir" style="opacity: {{ ho.diario.upOp }}; appearance: none; border: 0; margin: 0; padding: 0; font: inherit; cursor: pointer; padding: 0; width: 44px; height: 44px; flex: none; border-radius: 50%; background: {{ th.fill }}; color: {{ th.text }}; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"></path></svg></button>
<button type="button" onClick="{{ ho.diario.down }}" aria-label="Bajar" style="opacity: {{ ho.diario.downOp }}; appearance: none; border: 0; margin: 0; padding: 0; font: inherit; cursor: pointer; padding: 0; width: 44px; height: 44px; flex: none; border-radius: 50%; background: {{ th.fill }}; color: {{ th.text }}; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
<button type="button" class="hit" onClick="{{ ho.diario.toggle }}" aria-pressed="{{ ho.diario.hidden }}" style="appearance: none; border: 0; margin: 0; padding: 0; font: inherit; cursor: pointer; height: 40px; min-width: 84px; padding: 0 16px; border-radius: 999px; background: {{ th.fill }}; color: {{ th.text }}; font-size: 16px; font-weight: 500">{{ ho.diario.toggleLabel }}</button>
</div>
</div>
</sc-if>
<div style="opacity: {{ ho.diario.opacity }}; pointer-events: {{ ho.pe }}; max-height: {{ ho.maxH }}; overflow: {{ ho.ov }}; border-radius: 24px; display: flex; flex-direction: column; gap: 12px">
<section aria-label="Tu día" style="background: {{ th.card }}; box-shadow: {{ th.cardShadow }}; border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 16px">
<sc-if value="{{ sk.show }}" hint-placeholder-val="{{ false }}">
<button type="button" onClick="{{ sk.open }}" style="appearance: none; border: 0; margin: 0; padding: 0; font: inherit; cursor: pointer; color: inherit; text-align: left; width: 100%; display: flex; align-items: center; gap: 16px; padding: 0 0 16px; background: transparent; border-bottom: 0.5px solid {{ th.sep }}">
<span style="position: relative; width: 52px; height: 52px; flex: none"><svg width="52" height="52" viewBox="0 0 52 52" aria-hidden="true"><circle cx="26.0" cy="26.0" r="22" fill="none" stroke="{{ th.fill }}" stroke-width="5"></circle><circle cx="26.0" cy="26.0" r="22" fill="none" stroke="{{ sk.ring }}" stroke-width="5" stroke-linecap="round" stroke-dasharray="138.2" stroke-dashoffset="{{ sk.off }}" transform="rotate(-90 26.0 26.0)" class="ring-in" style="--full: 138.2; transition: stroke-dashoffset 0.6s cubic-bezier(.32,.72,0,1)"></circle></svg><span style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 400; letter-spacing: -0.04em; font-variant-numeric: tabular-nums;">{{ sk.s }}</span></span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 13px; line-height: 20px; color: {{ th.sub }}; color: {{ th.sub }}">{{ sk.eyebrow }}</span><span style="font-size: 16px; font-weight: 500">{{ sk.grade }}</span><span style="font-size: 13px; line-height: 20px; color: {{ th.sub }}">{{ sk.parts }}</span></span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{ th.tertiary }}" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
</button>
</sc-if>
<sc-if value="{{ dy.showCheckin }}" hint-placeholder-val="{{ true }}">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px"><h2 style="margin: 0; font-size: 20px; font-weight: 500; letter-spacing: -0.02em">¿Cómo amaneciste?</h2><span style="font-family: {{ mono }}; font-size: 13px; color: {{ th.sub }}">20 segundos</span></div>
<sc-for list="{{ dy.rows }}" as="row" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px"><span style="font-size: 16px">{{ row.label }}</span><span style="font-family: {{ mono }}; font-size: 12px; color: {{ th.tertiary }}">{{ row.lo }} → {{ row.hi }}</span></div>
<div role="group" aria-label="{{ row.label }}" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{ row.opts }}" as="o" hint-placeholder-count="5"><button type="button" class="hit" onClick="{{ o.pick }}" aria-pressed="{{ o.on }}" aria-label="{{ o.aria }}" style="appearance: none; border: 0; margin: 0; padding: 0; font: inherit; cursor: pointer; height: 40px; border-radius: 12px; background: {{ o.bg }}; color: {{ o.fg }}; font-family: {{ mono }}; font-size: 16px; font-variant-numeric: tabular-nums; transition: background 0.2s var(--ease-out)">{{ o.n }}</button></sc-for>
</div>
</div>
</sc-for>
<sc-if value="{{ dy.hasEditDone }}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{ dy.editDone }}"  style="appearance: none; border: 0; margin: 0; padding: 0; font: inherit; cursor: pointer; height: 44px; padding: 0 24px; border-radius: 999px; background: {{ th.inv }}; color: {{ th.onInv }}; font-size: 16px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 8px; ">Listo</button></sc-if>
</sc-if>
<sc-if value="{{ dy.showBrief }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 8px"><h2 style="margin: 0; font-size: 20px; font-weight: 500; letter-spacing: -0.02em">Tu día</h2><button type="button" class="hit" onClick="{{ dy.edit }}" style="appearance: none; border: 0; margin: 0; padding: 0; font: inherit; cursor: pointer; height: 32px; padding: 0 4px; background: transparent; color: {{ th.sub }}; font-family: {{ mono }}; font-size: 13px">Editar check-in</button></div>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px"><sc-for list="{{ dy.brief }}" as="b" hint-placeholder-count="2"><li style="display: flex; gap: 12px"><span aria-hidden="true" style="flex: none; width: 6px; height: 6px; margin-top: 9px; border-radius: 50%; background: {{ c.constancia }}"></span><span style="font-size: 16px; line-height: 24px">{{ b.text }}</span></li></sc-for></ul>
<sc-if value="{{ dy.hasAi }}" hint-placeholder-val="{{ false }}"><div style="display: flex; flex-direction: column; gap: 10px; padding: 16px; border-radius: 16px; background: {{ th.well }}"><span style="font-size: 13px; line-height: 20px; color: {{ th.sub }}; color: {{ th.sub }}">Análisis con IA</span><ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px"><sc-for list="{{ dy.ai }}" as="a" hint-placeholder-count="2"><li style="display: flex; gap: 12px"><span aria-hidden="true" style="flex: none; width: 6px; height: 6px; margin-top: 9px; border-radius: 50%; background: {{ th.text }}"></span><span style="font-size: 16px; line-height: 24px">{{ a.text }}</span></li></sc-for></ul></div></sc-if>
<sc-if value="{{ dy.canAi }}" hint-placeholder-val="{{ false }}">
<sc-if value="{{ dy.aiBusy }}" hint-placeholder-val="{{ false }}"><span role="status" style="font-family: {{ mono }}; font-size: 13px; color: {{ th.sub }}">Analizando tu día…</span></sc-if>
<sc-if value="{{ dy.aiIdle }}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{ dy.askAi }}"  style="appearance: none; border: 0; margin: 0; padding: 0; font: inherit; cursor: pointer; height: 44px; padding: 0 24px; border-radius: 999px; background: {{ th.fill }}; color: {{ th.text }}; font-size: 16px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 8px; ">Analizar mi día con IA</button></sc-if>
</sc-if>
<sc-if value="{{ dy.hasAiErr }}" hint-placeholder-val="{{ false }}"><p role="status" style="margin: 0; font-size: 13px; line-height: 20px; color: {{ c.heatText }}">{{ dy.aiErr }}</p></sc-if>
<sc-if value="{{ dy.showClose }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 12px; border-top: 0.5px solid {{ th.sep }}; padding-top: 16px">
<span style="font-size: 16px; font-weight: 500">Cierre del día</span>
<span style="font-size: 13px; color: {{ th.sub }}">¿Qué salió bien hoy?</span><div style="display: flex; flex-wrap: wrap; gap: 8px"><sc-for list="{{ dy.good }}" as="gd" hint-placeholder-count="3"><button type="button" class="hit" onClick="{{ gd.pick }}" style="appearance: none; border: 0; margin: 0; padding: 0; font: inherit; cursor: pointer; height: 36px; padding: 0 14px; border-radius: 999px; background: {{ gd.bg }}; color: {{ gd.fg }}; font-size: 13px">{{ gd.t }}</button></sc-for></div>
<span style="font-size: 13px; color: {{ th.sub }}">Una mejora para mañana</span><div style="display: flex; flex-wrap: wrap; gap: 8px"><sc-for list="{{ dy.better }}" as="bt" hint-placeholder-count="3"><button type="button" class="hit" onClick="{{ bt.pick }}" style="appearance: none; border: 0; margin: 0; padding: 0; font: inherit; cursor: pointer; height: 36px; padding: 0 14px; border-radius: 999px; background: {{ bt.bg }}; color: {{ bt.fg }}; font-size: 13px">{{ bt.t }}</button></sc-for></div>
</div>
</sc-if>
<sc-if value="{{ dy.closed }}" hint-placeholder-val="{{ false }}"><p style="margin: 0; font-family: {{ mono }}; font-size: 13px; line-height: 20px; color: {{ th.sub }}">{{ dy.closedText }}</p></sc-if>
</sc-if>
</section>
</div>
</div>
<div style="order: {{ ho.salud.order }}; display: {{ ho.salud.display }}; border-radius: 24px; padding: {{ ho.pad }}; box-shadow: {{ ho.frame }}">
<sc-if value="{{ editHome }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 4px 12px">
<span style="font-size: 16px; font-weight: 500">{{ ho.salud.label }}</span>
<div style="display: flex; align-items: center; gap: 8px">
<button type="button" onClick="{{ ho.salud.up }}" aria-label="Subir" style="opacity: {{ ho.salud.upOp }}; appearance: none; border: 0; margin: 0; padding: 0; font: inherit; cursor: pointer; padding: 0; width: 44px; height: 44px; flex: none; border-radius: 50%; background: {{ th.fill }}; color: {{ th.text }}; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"></path></svg></button>
<button type="button" onClick="{{ ho.salud.down }}" aria-label="Bajar" style="opacity: {{ ho.salud.downOp }}; appearance: none; border: 0; margin: 0; padding: 0; font: inherit; cursor: pointer; padding: 0; width: 44px; height: 44px; flex: none; border-radius: 50%; background: {{ th.fill }}; color: {{ th.text }}; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
<button type="button" class="hit" onClick="{{ ho.salud.toggle }}" aria-pressed="{{ ho.salud.hidden }}" style="appearance: none; border: 0; margin: 0; padding: 0; font: inherit; cursor: pointer; height: 40px; min-width: 84px; padding: 0 16px; border-radius: 999px; background: {{ th.fill }}; color: {{ th.text }}; font-size: 16px; font-weight: 500">{{ ho.salud.toggleLabel }}</button>
</div>
</div>
</sc-if>
<div style="opacity: {{ ho.salud.opacity }}; pointer-events: {{ ho.pe }}; max-height: {{ ho.maxH }}; overflow: {{ ho.ov }}; border-radius: 24px; display: flex; flex-direction: column; gap: 12px">
<sc-if value="{{ hs.has }}" hint-placeholder-val="{{ true }}">
<button type="button" onClick="{{ goSalud }}" style="appearance: none; border: 0; margin: 0; padding: 0; font: inherit; cursor: pointer; position: relative; overflow: hidden; width: 100%; text-align: left; background: #0B0B0C; box-shadow: inset 0 0 0 1px {{ th.line }}; color: #FAFAFA; border-radius: 24px; padding: 20px 20px 20px; display: flex; flex-direction: column; gap: 20px; min-height: 0">
<span aria-hidden="true" class="halo" style="position: absolute; inset: 0; pointer-events: none; background: {{ halo }}; transition: background 0.6s"></span>
<span style="position: relative"><span style="font-size: 13px; line-height: 20px; color: {{ th.sub }}; color: rgba(250, 250, 250, 0.62)">Perfil de salud</span></span>
<span style="position: relative; display: flex; align-items: flex-end; gap: 12px">
<span data-count="{{ hs.overall }}" data-count-id="perfil" style="font-size: 76px; line-height: 70px; font-weight: 400; letter-spacing: -0.06em; font-variant-numeric: tabular-nums;">{{ hs.overall }}</span>
<span style="display: flex; flex-direction: column; gap: 8px; padding-bottom: 8px">

<button type="button" aria-label="Cerrar" onClick="{{ fd.discardDraft }}" style="position: absolute; inset: 0; width: 100%; height: 100%; border: 0; margin: 0; padding: 0; background: {{ th.scrim }}; cursor: default; animation: fade 0.25s ease-out both"></button>
<div role="dialog" aria-modal="true" aria-label="Análisis de comida" class="scroll" style="position: absolute; left: 0; right: 0; bottom: 0; top: 54px; overflow-y: auto; box-sizing: border-box; background: {{ th.menu }}; border-radius: 28px 28px 0 0; padding: 12px 16px calc(env(safe-area-inset-bottom) + 12px); display: flex; flex-direction: column; gap: 12px; animation: sheet 0.42s cubic-bezier(.32,.72,0,1) both">
<span aria-hidden="true" style="align-self: center; width: 36px; height: 5px; border-radius: 3px; background: {{ th.fill }}; margin-bottom: 4px"></span>

<sc-if value="{{ fd.dHasThumb }}" hint-placeholder-val="{{ false }}"><img src="{{ fd.dThumb }}" alt="Foto de tu comida" style="width: 100%; height: 210px; object-fit: cover; border-radius: 24px; flex: none"></sc-if>
<sc-if value="{{ fd.dLoading }}" hint-placeholder-val="{{ true }}">
<div style="position: relative; overflow: hidden; background: #0B0B0C; box-shadow: inset 0 0 0 1px {{ th.line }}; color: #FAFAFA; border-radius: 24px; padding: 24px 20px; min-height: 120px; display: flex; flex-direction: column; justify-content: flex-end; gap: 8px">
<span aria-hidden="true" class="halo" style="position: absolute; inset: 0; pointer-events: none; background: {{ halo }}; transition: background 0.6s"></span>
<span style="position: relative"><span style="font-size: 13px; line-height: 20px; color: {{ th.sub }}; color: rgba(250, 250, 250, 0.62)">Analizando</span></span>
<span style="position: relative; font-size: 20px; line-height: 24px; letter-spacing: -0.03em">{{ fd.dLoadText }}</span>
</div>
</sc-if>
<sc-if value="{{ fd.dReady }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 0 4px">
<div style="display: flex; flex-direction: column; gap: 8px; min-width: 0"><span style="font-size: 13px; line-height: 20px; color: {{ th.sub }}; color: {{ th.sub }}">Resultado</span><h2 style="margin: 0; font-size: 28px; line-height: 32px; font-weight: 500; letter-spacing: -0.035em">{{ fd.dTitle }}</h2></div>
<sc-if value="{{ fd.dHasQ }}" hint-placeholder-val="{{ true }}"><span style="flex: none; font-family: {{ mono }}; font-size: 13px; padding: 8px 12px; border-radius: 999px; background: {{ th.well }}">Calidad {{ fd.dQ }}/10</span></sc-if>
</div>
<div style="display: grid; grid-template-columns: 1.4fr repeat(4, minmax(0, 1fr)); gap: 8px">
<div style="background: {{ th.inv }}; color: {{ th.onInv }}; border-radius: 16px; padding: 12px 12px; display: flex; flex-direction: column; gap: 2px"><span style="font-family: {{ mono }}; font-size: 11px; opacity: 0.7">kcal</span><span style="font-size: 20px; letter-spacing: -0.04em; font-variant-numeric: tabular-nums;">{{ fd.dTot.kcal }}</span></div>
<div style="background: {{ th.well }}; border-radius: 16px; padding: 12px 8px; display: flex; flex-direction: column; gap: 2px"><span style="font-family: {{ mono }}; font-size: 11px; color: {{ th.sub }}">Proteína</span><span style="font-size: 16px; font-variant-numeric: tabular-nums;">{{ fd.dTot.p }}</span></div>
<div style="background: {{ th.well }}; border-radius: 16px; padding: 12px 8px; display: flex; flex-direction: column; gap: 2px"><span style="font-family: {{ mono }}; font-size: 11px; color: {{ th.sub }}">Carbos</span><span style="font-size: 16px; font-variant-numeric: tabular-nums;">{{ fd.dTot.c }}</span></div>
<div style="background: {{ th.well }}; border-radius: 16px; padding: 12px 8px; display: flex; flex-direction: column; gap: 2px"><span style="font-family: {{ mono }}; font-size: 11px; color: {{ th.sub }}">Grasa</span><span style="font-size: 16px; font-variant-numeric: tabular-nums;">{{ fd.dTot.f }}</span></div>
<div style="background: {{ th.well }}; border-radius: 16px; padding: 12px 8px; display: flex; flex-direction: column; gap: 2px"><span style="font-family: {{ mono }}; font-size: 11px; color: {{ th.sub }}">Fibra</span><span style="font-size: 16px; font-variant-numeric: tabular-nums;">{{ fd.dTot.fib }}</span></div>
</div>
<section aria-label="Alimentos" style="background: {{ th.card }}; box-shadow: {{ th.cardShadow }}; border-radius: 24px; padding: 0 0 0 16px">
<sc-for list="{{ fd.dItems }}" as="it" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 12px; padding: 12px 12px 12px 0; box-shadow: {{ it.line }}">
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
<span style="display: flex; justify-content: space-between; gap: 8px"><span style="font-size: 16px">{{ it.n }}</span><span style="font-family: {{ mono }}; font-size: 13px; font-variant-numeric: tabular-nums;">{{ it.kcal }}</span></span>
<span style="font-family: {{ mono }}; font-size: 13px; color: {{ th.sub }}">{{ it.por }} · {{ it.macros }}</span>
</div>
<button type="button" onClick="{{ it.minus }}" aria-label="Menos cantidad" style="appearance: none; border: 0; margin: 0; padding: 0; font: inherit; cursor: pointer; padding: 0; width: 44px; height: 44px; flex: none; border-radius: 50%; background: {{ th.fill }}; color: {{ th.text }}; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button><button type="button" onClick="{{ it.plus }}" aria-label="Más cantidad" style="appearance: none; border: 0; margin: 0; padding: 0; font: inherit; cursor: pointer; padding: 0; width: 44px; height: 44px; flex: none; border-radius: 50%; background: {{ th.fill }}; color: {{ th.text }}; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button><button type="button" onClick="{{ it.remove }}" aria-label="Quitar" style="appearance: none; border: 0; margin: 0; padding: 0; font: inherit; cursor: pointer; padding: 0; width: 44px; height: 44px; flex: none; border-radius: 50%; background: transparent; color: {{ th.sub }}; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>
</sc-for>
</section>
<sc-if value="{{ fd.dHasNote }}" hint-placeholder-val="{{ true }}"><p style="margin: 0; padding: 0 4px; font-size: 16px; line-height: 24px; color: {{ th.sub }}">{{ fd.dNote }}</p></sc-if>
<sc-if value="{{ fd.dLow }}" hint-placeholder-val="{{ false }}"><p style="margin: 0; padding: 0 4px; font-size: 13px; line-height: 20px; color: {{ c.heatText }}">La IA no está muy segura. Ajusta las cantidades con − y + si algo no calza.</p></sc-if>
<button type="button" onClick="{{ fd.saveDraft }}"  style="appearance: none; border: 0; margin: 0; padding: 0; font: inherit; cursor: pointer; height: 52px; padding: 0 24px; border-radius: 999px; background: {{ th.inv }}; color: {{ th.onInv }}; font-size: 16px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 8px; ">Guardar</button>
<button type="button" onClick="{{ fd.discardDraft }}"  style="appearance: none; border: 0; margin: 0; padding: 0; font: inherit; cursor: pointer; height: 44px; padding: 0 24px; border-radius: 999px; background: transparent; color: {{ th.text }}; font-size: 16px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 8px; color: {{ th.sub }}">Descartar</button>
</sc-if>
<sc-if value="{{ fd.dError }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 8px; padding: 4px 4px 0"><span style="font-size: 13px; line-height: 20px; color: {{ th.sub }}; color: {{ th.sub }}">No se pudo analizar</span><p style="margin: 0; font-size: 16px; line-height: 24px">{{ fd.dErr }}</p></div>
<button type="button" onClick="{{ fd.retryDraft }}"  style="appearance: none; border: 0; margin: 0; padding: 0; font: inherit; cursor: pointer; height: 52px; padding: 0 24px; border-radius: 999px; background: {{ th.inv }}; color: {{ th.onInv }}; font-size: 16px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 8px; ">Intentar de nuevo</button>
<button type="button" onClick="{{ fd.discardDraft }}"  style="appearance: none; border: 0; margin: 0; padding: 0; font: inherit; cursor: pointer; height: 44px; padding: 0 24px; border-radius: 999px; background: transparent; color: {{ th.text }}; font-size: 16px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 8px; color: {{ th.sub }}">Cerrar</button>
</sc-if>
</div>
</div>
</sc-if>
<sc-if value="{{ fd.entryOpen }}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; inset: 0; z-index: 30">
<button type="button" aria-label="Cerrar" onClick="{{ fd.closeEntry }}" style="position: absolute; inset: 0; width: 100%; height: 100%; border: 0; margin: 0; padding: 0; background: {{ th.scrim }}; cursor: default; animation: fade 0.25s ease-out both"></button>
<div role="dialog" aria-modal="true" aria-label="Detalle de comida" class="scroll" style="position: absolute; left: 0; right: 0; bottom: 0; max-height: 88%; overflow-y: auto; box-sizing: border-box; background: {{ th.menu }}; border-radius: 28px 28px 0 0; padding: 12px 16px calc(env(safe-area-inset-bottom) + 12px); display: flex; flex-direction: column; gap: 12px; animation: sheet 0.42s cubic-bezier(.32,.72,0,1) both">
<span aria-hidden="true" style="align-self: center; width: 36px; height: 5px; border-radius: 3px; background: {{ th.fill }}; margin-bottom: 4px"></span>

<sc-if value="{{ fd.fe.hasPhoto }}" hint-placeholder-val="{{ false }}"><img src="{{ fd.fe.photo }}" alt="" style="width: 100%; height: 200px; object-fit: cover; border-radius: 24px; flex: none"></sc-if>
<div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 0 4px">
<div style="display: flex; flex-direction: column; gap: 8px; min-width: 0"><span style="font-size: 13px; line-height: 20px; color: {{ th.sub }}; color: {{ th.sub }}">{{ fd.fe.meal }} · {{ fd.fe.time }}</span><h2 style="margin: 0; font-size: 28px; line-height: 32px; font-weight: 500; letter-spacing: -0.035em">{{ fd.fe.title }}</h2></div>
<sc-if value="{{ fd.fe.hasQ }}" hint-placeholder-val="{{ false }}"><span style="flex: none; font-family: {{ mono }}; font-size: 13px; padding: 8px 12px; border-radius: 999px; background: {{ th.well }}">Calidad {{ fd.fe.q }}/10</span></sc-if>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<div style="background: {{ th.inv }}; color: {{ th.onInv }}; border-radius: 16px; padding: 12px 12px; display: flex; flex-direction: column; gap: 2px"><span style="font-family: {{ mono }}; font-size: 11px; opacity: 0.7">kcal</span><span style="font-size: 20px; letter-spacing: -0.04em; font-variant-numeric: tabular-nums;">{{ fd.fe.tot.kcal }}</span></div>
<div style="background: {{ th.well }}; border-radius: 16px; padding: 12px 12px; display: flex; flex-direction: column; gap: 2px"><span style="font-family: {{ mono }}; font-size: 11px; color: {{ th.sub }}">Proteína</span><span style="font-size: 20px; font-variant-numeric: tabular-nums;">{{ fd.fe.tot.p }} g</span></div>
<div style="background: {{ th.well }}; border-radius: 16px; padding: 12px 12px; display: flex; flex-direction: column; gap: 2px"><span style="font-family: {{ mono }}; font-size: 11px; color: {{ th.sub }}">Fibra</span><span style="font-size: 20px; font-variant-numeric: tabular-nums;">{{ fd.fe.tot.fib }} g</span></div>
</div>
<p style="margin: 0; padding: 0 4px; font-family: {{ mono }}; font-size: 13px; color: {{ th.sub }}">Carbohidratos {{ fd.fe.tot.c }} g · Grasa {{ fd.fe.tot.f }} g · Azúcar {{ fd.fe.tot.sug }} g · Sodio {{ fd.fe.tot.na }} mg</p>
<section aria-label="Alimentos" style="background: {{ th.card }}; box-shadow: {{ th.cardShadow }}; border-radius: 24px; padding: 0 0 0 16px">
<sc-for list="{{ fd.fe.items }}" as="it" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 4px; padding: 12px 16px 12px 0; box-shadow: {{ it.line }}">
<span style="display: flex; justify-content: space-between; gap: 8px"><span style="font-size: 16px">{{ it.n }}</span><span style="font-family: {{ mono }}; font-size: 13px; font-variant-numeric: tabular-nums;">{{ it.kcal }} kcal</span></span>
<span style="font-family: {{ mono }}; font-size: 13px; color: {{ th.sub }}">{{ it.por }} · {{ it.macros }}</span>
</div>
</sc-for>
</section>
<sc-if value="{{ fd.fe.hasNote }}" hint-placeholder-val="{{ true }}"><p style="margin: 0; padding: 0 4px; font-size: 16px; line-height: 24px; color: {{ th.sub }}">{{ fd.fe.note }}</p></sc-if>
<button type="button" onClick="{{ fd.fe.del }}"  style="appearance: none; border: 0; margin: 0; padding: 0; font: inherit; cursor: pointer; height: 44px; padding: 0 24px; border-radius: 999px; background: transparent; color: {{ th.text }}; font-size: 16px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 8px; color: {{ th.danger }}">{{ fd.fe.delLabel }}</button>
</div>
</div>
</sc-if>

<sc-if value="{{ showSalud }}" hint-placeholder-val="{{ false }}">
<div id="sc-showSalud" class="scroll scr" style="position: absolute; inset: 0; overflow-y: auto; box-sizing: border-box; padding: calc(env(safe-area-inset-top) + 44px) 16px 110px; display: flex; flex-direction: column; gap: 16px">
<header style="display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 0 4px 4px">
<div style="display: flex; flex-direction: column; gap: 8px; min-width: 0">
<span style="font-size: 13px; line-height: 20px; color: {{ th.sub }}; color: {{ th.sub }}">Perfil de salud</span>
<h1 style="margin: 0; font-size: 34px; line-height: 40px; font-weight: 400; letter-spacing: -0.045em">Salud</h1>
</div>
<button type="button" onClick="{{ openMenu }}" aria-label="Perfil y apariencia" style="appearance: none; border: 0; margin: 0; padding: 0; font: inherit; cursor: pointer; padding: 0; width: 44px; height: 44px; flex: none; border-radius: 50%; background: {{ th.fill }}; color: {{ th.text }}; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 500">{{ initial }}</button>
</header>
<sc-if value="{{ hv.has }}" hint-placeholder-val="{{ true }}">
<button type="button" onClick="{{ noop }}" style="appearance: none; border: 0; margin: 0; padding: 0; font: inherit; cursor: pointer; position: relative; overflow: hidden; width: 100%; text-align: left; background: #0B0B0C; box-shadow: inset 0 0 0 1px {{ th.line }}; color: #FAFAFA; border-radius: 24px; padding: 20px 20px 20px; display: flex; flex-direction: column; gap: 20px; min-height: 236px">
<span aria-hidden="true" class="halo" style="position: absolute; inset: 0; pointer-events: none; background: {{ halo }}; transition: background 0.6s"></span>
<span style="position: relative"><span style="font-size: 13px; line-height: 20px; color: {{ th.sub }}; color: rgba(250, 250, 250, 0.62)">Perfil de salud</span></span>
<span style="position: relative; display: flex; align-items: flex-end; gap: 12px">
<span data-count="{{ hv.overall }}" data-count-id="perfil" style="font-size: 76px; line-height: 70px; font-weight: 400; letter-spacing: -0.06em; font-variant-numeric: tabular-nums;">{{ hv.overall }}</span>
<span style="display: flex; flex-direction: column; gap: 8px; padding-bottom: 8px">
<span style="display: flex; align-items: center; gap: 8px"><span style="width: 26px; height: 26px; flex: none; border-radius: 50%; box-shadow: inset 0 0 0 1.5px {{ hv.gColor }}; color: {{ hv.gColor }}; display: flex; align-items: center; justify-content: center; font-family: {{ mono }}; font-size: 12px; font-weight: 500">{{ hv.grade }}</span><span style="font-size: 16px; font-weight: 500">{{ hv.gLabel }}</span></span>
<span style="font-family: {{ mono }}; font-size: 13px; color: rgba(250, 250, 250, 0.6)">de 100 · evaluación {{ hv.evalAgo }}</span>
</span>
</span>
<sc-if value="{{ hv.hasSegs }}" hint-placeholder-val="{{ true }}">
<span style="position: relative; display: flex; flex-direction: column; gap: 10px">
<span aria-hidden="true" style="display: flex; gap: 3px; height: 4px">
<sc-for list="{{ hv.segs }}" as="sg" hint-placeholder-count="3"><span class="seg-in" style="flex: {{ sg.flex }} 1 0; border-radius: 2px; background: {{ sg.color }}; animation-delay: {{ sg.delay }}ms"></span></sc-for>
</span>
<span style="display: flex; flex-wrap: wrap; gap: 4px 16px">
<sc-for list="{{ hv.segs }}" as="sg" hint-placeholder-count="3"><span style="display: flex; align-items: center; gap: 8px"><span aria-hidden="true" style="width: 6px; height: 6px; border-radius: 50%; background: {{ sg.color }}; flex: none"></span><span style="font-size: 16px; font-variant-numeric: tabular-nums;">{{ sg.n }}</span><span style="font-family: {{ mono }}; font-size: 13px; color: rgba(250, 250, 250, 0.62)">{{ sg.label }}</span></span></sc-for>
</span>
</span>
</sc-if>
<sc-if value="{{ hv.hasFocus }}" hint-placeholder-val="{{ true }}">
<span style="position: relative; display: flex; flex-direction: column; gap: 8px; padding: 12px 16px; border-radius: 16px; background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px)">
<span style="font-family: {{ mono }}; font-size: 13px; color: rgba(250, 250, 250, 0.6)">Enfócate en</span>
<sc-for list="{{ hv.focus }}" as="fo" hint-placeholder-count="2">
<span style="display: flex; align-items: center; gap: 12px"><span style="width: 8px; height: 8px; border-radius: 50%; background: {{ fo.gColor }}; flex: none"></span><span style="flex: 1; font-size: 16px">{{ fo.name }}</span><span style="font-size: 13px; color: rgba(250, 250, 250, 0.62)">{{ fo.status }}</span></span>
</sc-for>
</span>
</sc-if>
</button>
</sc-if>
<sc-if value="{{ hv.none }}" hint-placeholder-val="{{ false }}">
<button type="button" onClick="{{ hv.startEval }}" style="appearance: none; border: 0; margin: 0; padding: 0; font: inherit; cursor: pointer; position: relative; overflow: hidden; width: 100%; text-align: left; background: #0B0B0C; box-shadow: inset 0 0 0 1px {{ th.line }}; color: #FAFAFA; border-radius: 24px; padding: 24px 20px 20px; display: flex; flex-direction: column; gap: 12px; min-height: 270px">
<span aria-hidden="true" class="halo" style="position: absolute; inset: 0; pointer-events: none; background: {{ halo }}; transition: background 0.6s"></span>
<span style="position: relative"><span style="font-size: 13px; line-height: 20px; color: {{ th.sub }}; color: rgba(250, 250, 250, 0.62)">Perfil de salud</span></span>
<span style="position: relative; font-size: 28px; line-height: 32px; font-weight: 400; letter-spacing: -0.04em; max-width: 290px">Conoce tu punto de partida</span>
<span style="position: relative; font-size: 16px; line-height: 24px; color: rgba(250, 250, 250, 0.72); max-width: 300px">Una evaluación de 3 minutos arma tu perfil y califica 8 áreas: sueño, nutrición, hidratación, fuerza, cardio, cuerpo, corazón y mente.</span>
<span style="position: relative; margin-top: auto; align-self: flex-start; height: 48px; padding: 0 24px; border-radius: 999px; background: #FAFAFA; color: #09090B; font-size: 16px; font-weight: 500; display: flex; align-items: center; gap: 8px">Empezar evaluación <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span>
</button>
</sc-if>
<sc-if value="{{ hv.has }}" hint-placeholder-val="{{ true }}">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 12px 4px 0"><h2 style="margin: 0; font-size: 20px; line-height: 24px; font-weight: 500; letter-spacing: -0.025em">Tus áreas</h2></div>
<section aria-label="Áreas" style="background: {{ th.card }}; box-shadow: {{ th.cardShadow }}; border-radius: 24px; padding: 0 0 0 16px">
<sc-for list="{{ hv.areas }}" as="ar" hint-placeholder-count="8">
<button type="button" onClick="{{ ar.open }}" style="appearance: none; border: 0; margin: 0; padding: 0; font: inherit; cursor: pointer; color: inherit; text-align: left; width: 100%; padding: 16px 16px 16px 0; background: transparent; display: flex; align-items: center; gap: 12px; box-shadow: {{ ar.line }}">
<span style="width: 34px; height: 34px; flex: none; border-radius: 50%; box-shadow: inset 0 0 0 1.5px {{ ar.gColor }}; color: {{ ar.gText }}; display: flex; align-items: center; justify-content: center; font-family: {{ mono }}; font-size: 13px; font-weight: 500">{{ ar.grade }}</span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 16px; font-weight: 500">{{ ar.name }}</span><span style="font-size: 13px; color: {{ th.sub }}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ ar.status }}</span></span>
<span style="font-family: {{ mono }}; font-size: 13px; color: {{ th.sub }}; font-variant-numeric: tabular-nums;">{{ ar.score }}</span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{ th.tertiary }}" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
</button>
</sc-for>
</section>
<button type="button" onClick="{{ pg.open }}" style="appearance: none; border: 0; margin: 0; padding: 0; font: inherit; cursor: pointer; color: inherit; text-align: left; width: 100%; background: {{ th.card }}; box-shadow: {{ th.cardShadow }}; border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 16px">
<span style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px"><span style="font-size: 20px; font-weight: 500; letter-spacing: -0.02em">Progreso</span><span style="font-family: {{ mono }}; font-size: 13px; color: {{ th.sub }}">Semana {{ pg.week }}</span></span>
<span aria-hidden="true" style="display: flex; align-items: flex-end; gap: 4px; height: 48px">
<sc-for list="{{ pg.bars }}" as="b" hint-placeholder-count="12"><span class="col-in" style="flex: 1; height: {{ b.h }}%; border-radius: 3px; background: {{ b.bg }}; animation-delay: {{ b.delay }}ms"></span></sc-for>
</span>

<div role="group" aria-label="Tema" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 4px; border-radius: 999px; background: {{ th.segBg }}">
<sc-for list="{{ temaOpts }}" as="o" hint-placeholder-count="3">
<button type="button" class="hit" onClick="{{ o.pick }}" aria-pressed="{{ o.selected }}" style="appearance: none; border: 0; margin: 0; padding: 0; font: inherit; cursor: pointer; height: 34px; border-radius: 999px; background: {{ o.bg }}; color: {{ th.text }}; box-shadow: {{ o.shadow }}; font-size: 13px; font-weight: {{ o.weight }}">{{ o.label }}</button>
</sc-for>
</div>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; padding-right: 16px; border-top: 0.5px solid {{ th.sep }}"><span id="lbl-snd" style="font-size: 16px">Sonidos</span><button type="button" class="hit hit-sw" role="switch" aria-checked="{{ prefs.sonido }}" aria-labelledby="lbl-snd" onClick="{{ toggleSnd }}" style="appearance: none; border: 0; margin: 0; padding: 0; font: inherit; cursor: pointer; padding: 2px; width: 51px; height: 31px; flex: none; border-radius: 16px; background: {{ sndTrack }}; display: flex; align-items: center; transition: background 0.25s"><span style="width: 27px; height: 27px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 2px 6px rgba(0,0,0,0.18); transform: translateX({{ sndKnob }}px); transition: transform 0.25s cubic-bezier(.32,.72,0,1)"></span></button></div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; padding-right: 16px; border-top: 0.5px solid {{ th.sep }}"><span id="lbl-fx" style="font-size: 16px">Animaciones</span><button type="button" class="hit hit-sw" role="switch" aria-checked="{{ prefs.efectos }}" aria-labelledby="lbl-fx" onClick="{{ toggleFx }}" style="appearance: none; border: 0; margin: 0; padding: 0; font: inherit; cursor: pointer; padding: 2px; width: 51px; height: 31px; flex: none; border-radius: 16px; background: {{ fxTrack }}; display: flex; align-items: center; transition: background 0.25s"><span style="width: 27px; height: 27px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 2px 6px rgba(0,0,0,0.18); transform: translateX({{ fxKnob }}px); transition: transform 0.25s cubic-bezier(.32,.72,0,1)"></span></button></div>
<button type="button" onClick="{{ editFromSettings }}" style="appearance: none; border: 0; margin: 0; padding: 0; font: inherit; cursor: pointer; color: {{ th.text }}; width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; padding: 0 16px 0 0; background: transparent; font-size: 16px; text-align: left; border-top: 0.5px solid {{ th.sep }};"><span>Ordenar inicio</span><span style="display: flex; align-items: center; gap: 8px; color: {{ th.sub }}; font-size: 16px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{ th.tertiary }}" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></span></button></div></section>
<section style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 13px; line-height: 20px; color: {{ th.sub }}; padding: 0 4px">Tus datos</span><div style="background: {{ th.card }}; box-shadow: {{ th.cardShadow }}; border-radius: 24px; padding: 0 0 0 16px; overflow: hidden"><div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; padding-right: 16px"><span style="font-size: 16px">Guardado en este teléfono</span><span style="display: flex; align-items: center; gap: 8px; font-size: 16px; color: {{ c.constanciaText }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.0" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>{{ persistLabel }}</span></div>
<button type="button" onClick="{{ exportBackup }}" style="appearance: none; border: 0; margin: 0; padding: 0; font: inherit; cursor: pointer; color: inherit; width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; padding: 0 16px 0 0; background: transparent; font-size: 16px; border-top: 0.5px solid {{ th.sep }}"><span>Exportar respaldo</span><span style="font-size: 16px; color: {{ th.sub }}">Último: {{ backupLabel }}</span></button>
<label style="position: relative; display: flex; align-items: center; min-height: 52px; font-size: 16px; cursor: pointer; border-top: 0.5px solid {{ th.sep }}">Restaurar respaldo
<input type="file" accept=".json,application/json" onChange="{{ importBackup }}" style="position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer"></label>
<button type="button" onClick="{{ resetAll }}" style="appearance: none; border: 0; margin: 0; padding: 0; font: inherit; cursor: pointer; width: 100%; min-height: 52px; padding: 0; background: transparent; color: {{ th.danger }}; font-size: 16px; text-align: left; font-weight: {{ resetWeight }}; border-top: 0.5px solid {{ th.sep }}">{{ resetLabel }}</button></div><p style="margin: 0; padding: 0 4px; font-size: 13px; line-height: 20px; color: {{ th.sub }}">Todo se guarda solo en este teléfono, en dos copias. El respaldo no incluye las fotos ni tu clave de IA.</p></section>
<div aria-label="keystone" style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 8px 0 4px"><img src="img/orb-{{ orb.k }}.png" alt="" aria-hidden="true" style="width: 44px; height: 44px; flex: none; border-radius: 50%; box-shadow: 0 1.3px 3.5px rgba(0, 0, 0, 0.22)"><span style="font-size: 28px; font-weight: 500; letter-spacing: -0.055em; margin-top: 8px">keystone</span><span style="font-family: {{ mono }}; font-size: 13px; color: {{ th.tertiary }}">Hecha para {{ prefs.nombre }}</span><span style="font-family: {{ mono }}; font-size: 13px; color: {{ th.tertiary }}">Versión 33</span></div>
</div>
</sc-if>

<sc-if value="{{ showTabs }}" hint-placeholder-val="{{ true }}">
<nav aria-label="Secciones" style="position: absolute; left: 0; right: 0; bottom: 0; height: calc(49px + env(safe-area-inset-bottom)); box-sizing: border-box; padding: 8px 8px 0; background: {{ th.bar }}; backdrop-filter: blur(24px) saturate(1.4); -webkit-backdrop-filter: blur(24px) saturate(1.4); box-shadow: inset 0 0.5px 0 {{ th.sep }}; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); z-index: 10">
<button type="button" onClick="{{ tabGo.inicio }}" aria-current="{{ tabCur.inicio }}" style="appearance: none; border: 0; margin: 0; padding: 0; font: inherit; cursor: pointer; padding: 0; height: 49px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: transparent; color: {{ tabC.inicio }}; font-size: 12px; font-weight: 500; letter-spacing: 0"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="{{ tabW.inicio }}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11.5L12 5l8 6.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"></path></svg><span>Inicio</span></button>
<button type="button" onClick="{{ tabGo.habitos }}" aria-current="{{ tabCur.habitos }}" style="appearance: none; border: 0; margin: 0; padding: 0; font: inherit; cursor: pointer; padding: 0; height: 49px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: transparent; color: {{ tabC.habitos }}; font-size: 12px; font-weight: 500; letter-spacing: 0"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="{{ tabW.habitos }}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12.5l3.5 3.5L14 9.5M4 5h16M15 12h5M4 19h16"></path></svg><span>Hábitos</span></button>
<button type="button" onClick="{{ tabGo.comida }}" aria-current="{{ tabCur.comida }}" style="appearance: none; border: 0; margin: 0; padding: 0; font: inherit; cursor: pointer; padding: 0; height: 49px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: transparent; color: {{ tabC.comida }}; font-size: 12px; font-weight: 500; letter-spacing: 0"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="{{ tabW.comida }}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3v8a2 2 0 0 0 2 2v8M7 3v5M11 3v5M17 21V3c-2.2 0-3.5 2.5-3.5 6s1.3 4 3.5 4"></path></svg><span>Comida</span></button>
<button type="button" onClick="{{ tabGo.salud }}" aria-current="{{ tabCur.salud }}" style="appearance: none; border: 0; margin: 0; padding: 0; font: inherit; cursor: pointer; padding: 0; height: 49px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: transparent; color: {{ tabC.salud }}; font-size: 12px; font-weight: 500; letter-spacing: 0"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="{{ tabW.salud }}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h4l2.5-6 4 12 2.5-6H21"></path></svg><span>Salud</span></button>
<button type="button" onClick="{{ tabGo.ajustes }}" aria-current="{{ tabCur.ajustes }}" style="appearance: none; border: 0; margin: 0; padding: 0; font: inherit; cursor: pointer; padding: 0; height: 49px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: transparent; color: {{ tabC.ajustes }}; font-size: 12px; font-weight: 500; letter-spacing: 0"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="{{ tabW.ajustes }}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9M15 5a2 2 0 1 0 0 4 2 2 0 0 0 0-4zM9 15a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"></path></svg><span>Ajustes</span></button>
</nav>
</sc-if>

<sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; inset: 0; z-index: 40">
<button type="button" aria-label="Cerrar menú" onClick="{{ closeMenu }}" style="position: absolute; inset: 0; width: 100%; height: 100%; border: 0; margin: 0; padding: 0; background: {{ th.scrim }}; cursor: default; animation: fade 0.25s ease-out both"></button>
<div role="dialog" aria-modal="true" aria-label="Perfil y apariencia" style="position: absolute; top: calc(env(safe-area-inset-top) + 90px); right: 12px; width: 300px; box-sizing: border-box; background: {{ th.menu }}; border-radius: 24px; box-shadow: {{ th.shadow }}; padding: 16px; display: flex; flex-direction: column; gap: 16px; transform-origin: 270px -20px; animation: menu 0.32s cubic-bezier(.32,.72,0,1) both">
<div style="display: flex; align-items: center; gap: 12px">
<span style="width: 44px; height: 44px; border-radius: 50%; flex: none; background: {{ th.fill }}; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 500">{{ initial }}</span>
<span style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-size: 16px; font-weight: 500">{{ prefs.nombre }}</span><span style="font-size: 13px; color: {{ th.sub }}">{{ menuSub }}</span></span>
</div>
<div role="group" aria-label="Tema" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 4px; border-radius: 999px; background: {{ th.segBg }}">
<sc-for list="{{ temaOpts }}" as="o" hint-placeholder-count="3">
<button type="button" class="hit" onClick="{{ o.pick }}" aria-pressed="{{ o.selected }}" style="appearance: none; border: 0; margin: 0; padding: 0; font: inherit; cursor: pointer; height: 34px; border-radius: 999px; background: {{ o.bg }}; color: {{ th.text }}; box-shadow: {{ o.shadow }}; font-size: 13px; font-weight: {{ o.weight }}">{{ o.label }}</button>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; margin: 0 -8px -8px; border-top: 0.5px solid {{ th.sep }}; padding-top: 8px">
<button type="button" onClick="{{ goSalud }}" style="appearance: none; border: 0; margin: 0; padding: 0; font: inherit; cursor: pointer; color: inherit; display: flex; align-items: center; justify-content: space-between; min-height: 46px; padding: 0 8px; border-radius: 12px; background: transparent; font-size: 16px; text-align: left">Perfil de salud<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{ th.tertiary }}" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></button>
<button type="button" onClick="{{ goAjustes }}" style="appearance: none; border: 0; margin: 0; padding: 0; font: inherit; cursor: pointer; color: inherit; display: flex; align-items: center; justify-content: space-between; min-height: 46px; padding: 0 8px; border-radius: 12px; background: transparent; font-size: 16px; text-align: left">Ajustes<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{ th.tertiary }}" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></button>
</div>
</div>
</div>
</sc-if>

<sc-if value="{{ isArea }}" hint-placeholder-val="{{ false }}">
<div role="dialog" aria-modal="true" aria-label="{{ hv.detail.name }}" style="position: absolute; inset: 0; background: {{ th.bg }}; display: flex; flex-direction: column; animation: push 0.42s cubic-bezier(.32,.72,0,1) both; z-index: 20">
<div style="padding: calc(env(safe-area-inset-top) + 32px) 12px 8px; display: flex; align-items: center">
<button type="button" class="hit" onClick="{{ closeArea }}" style="appearance: none; border: 0; margin: 0; padding: 0; font: inherit; cursor: pointer; height: 40px; padding: 0 16px 0 8px; border-radius: 999px; background: {{ th.card }}; color: {{ th.text }}; font-size: 16px; display: flex; align-items: center; gap: 4px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>Salud</button>
</div>
<div class="scroll" style="flex: 1; overflow-y: auto; padding: 16px 16px 48px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 8px; padding: 0 4px"><span style="font-size: 13px; line-height: 20px; color: {{ th.sub }}; color: {{ th.sub }}">Área</span><h1 style="margin: 0; font-size: 34px; line-height: 40px; font-weight: 400; letter-spacing: -0.045em">{{ hv.detail.name }}</h1></div>
<section style="position: relative; overflow: hidden; background: #0B0B0C; box-shadow: inset 0 0 0 1px {{ th.line }}; color: #FAFAFA; border-radius: 24px; padding: 20px; display: flex; align-items: center; gap: 20px">
<span aria-hidden="true" class="halo" style="position: absolute; inset: 0; pointer-events: none; background: {{ hv.detail.halo }}; transition: background 0.6s"></span>
<div style="position: relative; width: 104px; height: 104px; flex: none"><svg width="104" height="104" viewBox="0 0 104 104" aria-hidden="true"><circle cx="52.0" cy="52.0" r="44" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="6"></circle><circle cx="52.0" cy="52.0" r="44" fill="none" stroke="{{ hv.detail.gColor }}" stroke-width="6" stroke-linecap="round" stroke-dasharray="276.5" stroke-dashoffset="{{ hv.detail.ringOff }}" transform="rotate(-90 52.0 52.0)" class="ring-in" style="--full: 276.5; transition: stroke-dashoffset 0.6s cubic-bezier(.32,.72,0,1)"></circle></svg>
<div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: {{ mono }}; font-size: 28px; color: {{ hv.detail.gColor }}">{{ hv.detail.grade }}</div></div>
<div style="position: relative; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 44px; line-height: 44px; font-weight: 400; letter-spacing: -0.05em; font-variant-numeric: tabular-nums;"><span data-count="{{ hv.detail.score }}" data-count-id="area-{{ hv.detail.name }}">{{ hv.detail.score }}</span><span style="font-size: 16px; color: rgba(250, 250, 250, 0.6); letter-spacing: 0"> / 100</span></span>
<span style="font-size: 16px; font-weight: 500">{{ hv.detail.gLabel }}</span>
<span style="font-family: {{ mono }}; font-size: 13px; color: rgba(250, 250, 250, 0.6)">{{ hv.detail.source }}</span>
</div>
</section>
<p style="margin: 0; padding: 0 4px; font-size: 16px; line-height: 24px; color: {{ th.sub }}">{{ hv.detail.what }}</p>
<section aria-label="Tus datos" style="background: {{ th.card }}; box-shadow: {{ th.cardShadow }}; border-radius: 24px; padding: 0 0 0 20px">
<sc-for list="{{ hv.detail.metrics }}" as="me" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 12px; padding: 16px 20px 16px 0; box-shadow: {{ me.line }}">
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 16px">{{ me.label }}</span><sc-if value="{{ me.hasIdeal }}" hint-placeholder-val="{{ true }}"><span style="font-family: {{ mono }}; font-size: 13px; color: {{ th.tertiary }}">Óptimo: {{ me.ideal }}</span></sc-if></span>
<span style="font-family: {{ mono }}; font-size: 16px; text-align: right; font-variant-numeric: tabular-nums;">{{ me.value }}</span>
<span style="width: 8px; height: 8px; border-radius: 50%; flex: none; background: {{ me.dot }}"></span>
</div>
</sc-for>
</section>
<sc-if value="{{ hv.detail.hasNote }}" hint-placeholder-val="{{ false }}"><p style="margin: 0; padding: 0 4px; font-size: 13px; line-height: 20px; color: {{ th.sub }}">{{ hv.detail.note }}</p></sc-if>
<sc-if value="{{ hv.detail.isMood }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 12px 4px 0"><h2 style="margin: 0; font-size: 20px; line-height: 24px; font-weight: 500; letter-spacing: -0.025em">Chequeo de hoy</h2></div>
<section style="background: {{ th.card }}; box-shadow: {{ th.cardShadow }}; border-radius: 24px; padding: 16px 20px; display: flex; flex-direction: column; gap: 16px">
<sc-for list="{{ hv.detail.moods }}" as="mo" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="display: flex; justify-content: space-between; font-size: 16px"><span>{{ mo.label }}</span><span style="font-family: {{ mono }}; font-size: 13px; color: {{ th.tertiary }}">{{ mo.lo }} → {{ mo.hi }}</span></span>
<div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{ mo.opts }}" as="mv" hint-placeholder-count="5"><button type="button" class="hit" onClick="{{ mv.pick }}" aria-pressed="{{ mv.sel }}" style="appearance: none; border: 0; margin: 0; padding: 0; font: inherit; cursor: pointer; height: 40px; border-radius: 12px; background: {{ mv.bg }}; color: {{ mv.fg }}; font-family: {{ mono }}; font-size: 16px">{{ mv.v }}</button></sc-for>
</div>
</div>
</sc-for>
</section>
</sc-if>
<sc-if value="{{ hv.detail.hasSeries }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 12px 4px 0"><h2 style="margin: 0; font-size: 20px; line-height: 24px; font-weight: 500; letter-spacing: -0.025em">{{ hv.detail.seriesLabel }}</h2><span style="font-family: {{ mono }}; font-size: 13px; color: {{ th.sub }}; font-variant-numeric: tabular-nums;">{{ hv.detail.targetLabel }}</span></div>
<section style="background: {{ th.card }}; box-shadow: {{ th.cardShadow }}; border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 8px">
<div style="position: relative; height: 104px; display: grid; grid-template-columns: repeat({{ hv.detail.cols }}, minmax(0, 1fr)); gap: 8px; align-items: end">
<sc-if value="{{ hv.detail.hasTarget }}" hint-placeholder-val="{{ true }}"><div style="position: absolute; left: 0; right: 0; bottom: {{ hv.detail.targetPx }}px; border-top: 1px dashed {{ th.tertiary }}"></div></sc-if>
<sc-for list="{{ hv.detail.bars }}" as="bb" hint-placeholder-count="8"><div title="{{ bb.val }}" style="height: {{ bb.h }}px; border-radius: 6px; background: {{ bb.bg }}"></div></sc-for>
</div>
<div style="display: grid; grid-template-columns: repeat({{ hv.detail.cols }}, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{ hv.detail.bars }}" as="bb" hint-placeholder-count="8"><span style="font-family: {{ mono }}; font-size: 11px; text-align: center; color: {{ th.sub }}; white-space: nowrap">{{ bb.label }}</span></sc-for>
</div>
</section>
</sc-if>
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 12px 4px 0"><h2 style="margin: 0; font-size: 20px; line-height: 24px; font-weight: 500; letter-spacing: -0.025em">Qué hacer</h2></div>
<section style="background: {{ th.card }}; box-shadow: {{ th.cardShadow }}; border-radius: 24px; padding: 4px 20px">
<sc-for list="{{ hv.detail.actions }}" as="ac" hint-placeholder-count="3">
<div style="display: flex; gap: 12px; padding: 16px 0; box-shadow: {{ ac.line }}"><span style="font-family: {{ mono }}; font-size: 13px; color: {{ c.accentText }}; padding-top: 4px; flex: none">{{ ac.n }}</span><span style="font-size: 16px; line-height: 24px">{{ ac.text }}</span></div>
</sc-for>
</section>
<sc-if value="{{ hv.detail.hasLink }}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{ hv.detail.link }}"  style="appearance: none; border: 0; margin: 0; padding: 0; font: inherit; cursor: pointer; height: 52px; padding: 0 24px; border-radius: 999px; background: {{ th.inv }}; color: {{ th.onInv }}; font-size: 16px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 8px; ">{{ hv.detail.linkLabel }}</button></sc-if>
</div>
</div>
</sc-if>

<sc-if value="{{ isProg }}" hint-placeholder-val="{{ false }}">
<div role="dialog" aria-modal="true" aria-label="Progreso" style="position: absolute; inset: 0; background: {{ th.bg }}; display: flex; flex-direction: column; animation: push 0.42s cubic-bezier(.32,.72,0,1) both; z-index: 20">
<div style="padding: calc(env(safe-area-inset-top) + 32px) 12px 8px; display: flex; align-items: center">
