<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Rutina</title>
<meta name="description" content="Tu rutina de calistenia con sesiones guiadas, progreso y logros.">
<meta name="theme-color" content="#F2F2F7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rutina">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
html,body{margin:0;height:var(--app-h,100%);overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%;touch-action:manipulation;background:#F2F2F7}
#app{position:fixed;top:0;left:0;right:0;height:var(--app-h,100%)}
input{-webkit-user-select:text;user-select:text}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

body{margin:0}
button{-webkit-tap-highlight-color:transparent;transition:opacity .12s}
button:active{opacity:.6}
input:focus-visible,button:focus-visible{outline:2px solid #0A84FF;outline-offset:2px}
@keyframes present{from{transform:translateY(100%)}to{transform:none}}
@keyframes sheet{from{transform:translateY(105%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes menu{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes push{from{opacity:0;transform:translateX(32px)}to{opacity:1;transform:none}}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.1)}100%{transform:scale(1)}}
.scroll>*{flex-shrink:0}
.push{animation:push .38s cubic-bezier(.32,.72,0,1) both}
.bump{animation:bump .32s cubic-bezier(.32,.72,0,1) both}
@media (prefers-reduced-motion: reduce){.push,.bump{animation:none}}

</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div style="width: 100%; max-width: 640px; margin: 0 auto; height: 100%; position: relative; overflow: hidden; background: {{ th.bg }}; color: {{ th.text }}; font-family: {{ font }}; -webkit-font-smoothing: antialiased">

<sc-if value="{{ showInicio }}" hint-placeholder-val="{{ true }}">
<div class="scroll" style="position: absolute; inset: 0; overflow-y: auto; box-sizing: border-box; padding: calc(env(safe-area-inset-top) + 44px) 16px 228px; display: flex; flex-direction: column; gap: 20px">
<header style="display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 0 4px">
<div style="display: flex; flex-direction: column; gap: 0; min-width: 0">
<p style="margin: 0; font-size: 15px; line-height: 20px; font-weight: 600; color: {{ th.sub }}">{{ dateLabel }}</p>
<h1 style="margin: 0; font-size: 34px; line-height: 41px; font-weight: 700; letter-spacing: 0.01em">{{ dayTitle }}</h1>
</div>
<button type="button" onClick="{{ openMenu }}" aria-label="Perfil y personalización" style="appearance: none; border: 0; margin: 0 -4px 0 0; padding: 0; font: inherit; cursor: pointer; width: 44px; height: 44px; flex: none; border-radius: 50%; background: transparent; display: flex; align-items: center; justify-content: center">
<span style="width: 38px; height: 38px; border-radius: 50%; background: {{ primary }}; color: {{ onPrimary }}; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700">{{ initial }}</span>
</button>
</header>
<sc-if value="{{ showBackupNudge }}" hint-placeholder-val="{{ false }}">
<section aria-label="Respaldo" style="background: {{ th.card }}; border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: flex-start; gap: 12px">
<span style="width: 36px; height: 36px; border-radius: 10px; flex: none; background: {{ tint.resistencia }}; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{ c.resistencia }}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"></path></svg></span>
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 17px; font-weight: 600">Respalda tu progreso</span><span style="font-size: 15px; line-height: 20px; color: {{ th.sub }}">Guarda una copia en Archivos o iCloud Drive por si cambias de teléfono.</span></span>
</div>
<div style="display: flex; gap: 8px">
<button type="button" onClick="{{ exportBackup }}" style="appearance: none; border: 0; margin: 0; font: inherit; cursor: pointer; flex: 1; height: 44px; border-radius: 12px; background: {{ primary }}; color: {{ onPrimary }}; font-size: 15px; font-weight: 600">Respaldar</button>
<button type="button" onClick="{{ snoozeBackup }}" style="appearance: none; border: 0; margin: 0; font: inherit; cursor: pointer; flex: 1; height: 44px; border-radius: 12px; background: {{ th.btn2 }}; color: {{ th.text }}; font-size: 15px; font-weight: 600">Ahora no</button>
</div>
</section>
</sc-if>

<div style="order: {{ ho.hist.order }}; display: {{ ho.hist.display }}; border-radius: 26px; padding: {{ ho.pad }}; box-shadow: {{ ho.frame }}">
<sc-if value="{{ editHome }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 4px 10px">
<span style="font-size: 15px; font-weight: 600">{{ ho.hist.label }}</span>
<div style="display: flex; align-items: center; gap: 6px">
<button type="button" onClick="{{ ho.hist.up }}" aria-label="Subir {{ ho.hist.label }}" style="appearance: none; border: 0; margin: 0; padding: 0; font: inherit; cursor: pointer; width: 44px; height: 44px; border-radius: 22px; background: {{ th.btn2 }}; color: {{ th.text }}; opacity: {{ ho.hist.upOp }}; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"></path></svg></button>
<button type="button" onClick="{{ ho.hist.down }}" aria-label="Bajar {{ ho.hist.label }}" style="appearance: none; border: 0; margin: 0; padding: 0; font: inherit; cursor: pointer; width: 44px; height: 44px; border-radius: 22px; background: {{ th.btn2 }}; color: {{ th.text }}; opacity: {{ ho.hist.downOp }}; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
<button type="button" onClick="{{ ho.hist.toggle }}" aria-pressed="{{ ho.hist.hidden }}" style="appearance: none; border: 0; margin: 0; font: inherit; cursor: pointer; height: 44px; min-width: 88px; padding: 0 14px; border-radius: 22px; background: {{ th.btn2 }}; color: {{ primaryText }}; font-size: 15px; font-weight: 600">{{ ho.hist.toggleLabel }}</button>
</div>
</div>
</sc-if>
<div style="opacity: {{ ho.hist.opacity }}; pointer-events: {{ ho.pe }}; max-height: {{ ho.maxH }}; overflow: {{ ho.ov }}; border-radius: 20px; display: flex; flex-direction: column; gap: 20px">
<section aria-labelledby="hist" style="background: {{ th.card }}; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px">
<h2 id="hist" style="margin: 0; font-size: 17px; font-weight: 600">Historial</h2>
<span style="font-size: 13px; color: {{ th.sub }}; font-variant-numeric: tabular-nums">{{ hist.summary }}</span>
</div>
<div role="group" aria-label="Qué mostrar" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0; padding: 2px; border-radius: 10px; background: {{ th.segBg }}">
<sc-for list="{{ hist.modes }}" as="hm" hint-placeholder-count="2">
<button type="button" onClick="{{ hm.pick }}" aria-pressed="{{ hm.selected }}" style="appearance: none; border: 0; margin: 0; font: inherit; cursor: pointer; height: 36px; border-radius: 8px; background: {{ hm.bg }}; color: {{ th.text }}; box-shadow: {{ hm.shadow }}; font-size: 13px; font-weight: {{ hm.weight }}">{{ hm.label }}</button>
</sc-for>
</div>
<div style="display: flex; gap: 6px">
<div aria-hidden="true" style="display: grid; grid-template-rows: 14px repeat(7, 15px); row-gap: 3px; font-size: 10px; line-height: 15px; color: {{ th.sub }}">
<span></span><span>L</span><span></span><span>M</span><span></span><span>V</span><span></span><span></span>
</div>
<div role="img" aria-label="{{ hist.aria }}" style="flex: 1; min-width: 0; display: grid; grid-template-columns: repeat({{ hist.weeks }}, minmax(0, 1fr)); grid-template-rows: 14px repeat(7, 15px); grid-auto-flow: column; gap: 3px">
<sc-for list="{{ hist.items }}" as="hc" hint-placeholder-count="136">
<sc-if value="{{ hc.isLabel }}" hint-placeholder-val="{{ false }}"><span style="font-size: 10px; line-height: 14px; color: {{ th.sub }}; white-space: nowrap; overflow: visible">{{ hc.text }}</span></sc-if>
<sc-if value="{{ hc.isCell }}" hint-placeholder-val="{{ true }}"><span style="border-radius: 3px; background: {{ hc.bg }}; box-shadow: {{ hc.ring }}"></span></sc-if>
</sc-for>
</div>
</div>
<sc-if value="{{ hist.trainMode }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 11px; color: {{ th.sub }}">
<span style="display: flex; align-items: center; gap: 10px">
<span style="display: flex; align-items: center; gap: 4px"><span style="width: 10px; height: 10px; border-radius: 2px; background: {{ hist.missBg }}"></span>No la hice</span>
<span style="display: flex; align-items: center; gap: 4px"><span style="width: 10px; height: 10px; border-radius: 2px; background: {{ th.fill }}"></span>Descanso</span>
</span>
<span style="display: flex; align-items: center; gap: 3px">Suave
<sc-for list="{{ hist.scale }}" as="hs" hint-placeholder-count="4"><span style="width: 10px; height: 10px; border-radius: 2px; background: {{ hs.bg }}"></span></sc-for>
Al límite</span>
</div>
</sc-if>
<sc-if value="{{ hist.habMode }}" hint-placeholder-val="{{ true }}">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 11px; color: {{ th.sub }}">
<span>Hábitos cumplidos cada día</span>
<span style="display: flex; align-items: center; gap: 3px">Menos
<span style="width: 10px; height: 10px; border-radius: 2px; background: {{ th.fill }}"></span>
<sc-for list="{{ hist.scale }}" as="hs" hint-placeholder-count="4"><span style="width: 10px; height: 10px; border-radius: 2px; background: {{ hs.bg }}"></span></sc-for>
Más</span>
</div>
</sc-if>
</section>
</div>
</div>

<div style="order: {{ ho.habitos.order }}; display: {{ ho.habitos.display }}; border-radius: 26px; padding: {{ ho.pad }}; box-shadow: {{ ho.frame }}">
<sc-if value="{{ editHome }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 4px 10px">
<span style="font-size: 15px; font-weight: 600">{{ ho.habitos.label }}</span>
<div style="display: flex; align-items: center; gap: 6px">
<button type="button" onClick="{{ ho.habitos.up }}" aria-label="Subir {{ ho.habitos.label }}" style="appearance: none; border: 0; margin: 0; padding: 0; font: inherit; cursor: pointer; width: 44px; height: 44px; border-radius: 22px; background: {{ th.btn2 }}; color: {{ th.text }}; opacity: {{ ho.habitos.upOp }}; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"></path></svg></button>
<button type="button" onClick="{{ ho.habitos.down }}" aria-label="Bajar {{ ho.habitos.label }}" style="appearance: none; border: 0; margin: 0; padding: 0; font: inherit; cursor: pointer; width: 44px; height: 44px; border-radius: 22px; background: {{ th.btn2 }}; color: {{ th.text }}; opacity: {{ ho.habitos.downOp }}; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
<button type="button" onClick="{{ ho.habitos.toggle }}" aria-pressed="{{ ho.habitos.hidden }}" style="appearance: none; border: 0; margin: 0; font: inherit; cursor: pointer; height: 44px; min-width: 88px; padding: 0 14px; border-radius: 22px; background: {{ th.btn2 }}; color: {{ primaryText }}; font-size: 15px; font-weight: 600">{{ ho.habitos.toggleLabel }}</button>
</div>
</div>
</sc-if>
<div style="opacity: {{ ho.habitos.opacity }}; pointer-events: {{ ho.pe }}; max-height: {{ ho.maxH }}; overflow: {{ ho.ov }}; border-radius: 20px; display: flex; flex-direction: column; gap: 20px">
<button type="button" onClick="{{ goHabitos }}" style="appearance: none; border: 0; margin: 0; font: inherit; color: inherit; cursor: pointer; text-align: left; width: 100%; background: {{ th.card }}; border-radius: 20px; padding: 16px; display: flex; align-items: center; gap: 16px">
<span style="position: relative; width: 56px; height: 56px; flex: none">
<svg width="56" height="56" viewBox="0 0 88 88" aria-hidden="true"><circle cx="44" cy="44" r="38" fill="none" stroke="{{ th.fill }}" stroke-width="12"></circle><circle cx="44" cy="44" r="38" fill="none" stroke="{{ c.constancia }}" stroke-width="12" stroke-linecap="round" stroke-dasharray="238.8" stroke-dashoffset="{{ hd.ringOff }}" transform="rotate(-90 44 44)"></circle></svg>
<span style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums">{{ hd.done }}/{{ hd.total }}</span>
</span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 17px; font-weight: 600">Hábitos de hoy</span>
<span style="font-size: 13px; line-height: 18px; color: {{ th.sub }}">{{ hd.sub }}</span>
</span>
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="{{ th.tertiary }}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
</button>
</div>
</div>

<div style="order: {{ ho.agua.order }}; display: {{ ho.agua.display }}; border-radius: 26px; padding: {{ ho.pad }}; box-shadow: {{ ho.frame }}">
<sc-if value="{{ editHome }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 4px 10px">
<span style="font-size: 15px; font-weight: 600">{{ ho.agua.label }}</span>
<div style="display: flex; align-items: center; gap: 6px">
<button type="button" onClick="{{ ho.agua.up }}" aria-label="Subir {{ ho.agua.label }}" style="appearance: none; border: 0; margin: 0; padding: 0; font: inherit; cursor: pointer; width: 44px; height: 44px; border-radius: 22px; background: {{ th.btn2 }}; color: {{ th.text }}; opacity: {{ ho.agua.upOp }}; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"></path></svg></button>
<button type="button" onClick="{{ ho.agua.down }}" aria-label="Bajar {{ ho.agua.label }}" style="appearance: none; border: 0; margin: 0; padding: 0; font: inherit; cursor: pointer; width: 44px; height: 44px; border-radius: 22px; background: {{ th.btn2 }}; color: {{ th.text }}; opacity: {{ ho.agua.downOp }}; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
<button type="button" onClick="{{ ho.agua.toggle }}" aria-pressed="{{ ho.agua.hidden }}" style="appearance: none; border: 0; margin: 0; font: inherit; cursor: pointer; height: 44px; min-width: 88px; padding: 0 14px; border-radius: 22px; background: {{ th.btn2 }}; color: {{ primaryText }}; font-size: 15px; font-weight: 600">{{ ho.agua.toggleLabel }}</button>
</div>
</div>
</sc-if>
<div style="opacity: {{ ho.agua.opacity }}; pointer-events: {{ ho.pe }}; max-height: {{ ho.maxH }}; overflow: {{ ho.ov }}; border-radius: 20px; display: flex; flex-direction: column; gap: 20px">
<sc-if value="{{ hd.water.on }}" hint-placeholder-val="{{ true }}">
<section aria-labelledby="agua-home" style="background: {{ th.card }}; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; gap: 12px">
<span style="width: 36px; height: 36px; border-radius: 10px; flex: none; background: {{ tint.resistencia }}; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="{{ c.resistencia }}" aria-hidden="true"><path d="M12 3c3.5 4.4 6 7.6 6 10.5a6 6 0 0 1-12 0C6 10.6 8.5 7.4 12 3z"></path></svg></span>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
<h2 id="agua-home" style="margin: 0; font-size: 17px; font-weight: 600">Agua</h2>
<span style="font-size: 13px; color: {{ th.sub }}">{{ hd.water.left }}</span>
</div>
<span style="font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums">{{ hd.water.liters }}<span style="font-size: 15px; font-weight: 600; color: {{ th.sub }}"> de {{ hd.water.goalL }} L</span></span>
</div>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{ hd.water.glasses }}" as="g" hint-placeholder-count="10">
<button type="button" onClick="{{ g.pick }}" aria-label="{{ g.aria }}" style="appearance: none; border: 0; margin: 0; padding: 0; font: inherit; cursor: pointer; height: 44px; border-radius: 12px; background: {{ g.bg }}; display: flex; align-items: center; justify-content: center; transition: background 0.2s">
<svg width="18" height="18" viewBox="0 0 24 24" fill="{{ g.fill }}" stroke="{{ g.stroke }}" stroke-width="1.8" aria-hidden="true"><path d="M12 3c3.5 4.4 6 7.6 6 10.5a6 6 0 0 1-12 0C6 10.6 8.5 7.4 12 3z"></path></svg>
</button>
</sc-for>
</div>
<div style="display: grid; grid-template-columns: 56px minmax(0, 1fr) minmax(0, 1fr); gap: 8px">
<button type="button" onClick="{{ hd.water.sub }}" aria-label="Quitar un vaso" style="appearance: none; border: 0; margin: 0; font: inherit; cursor: pointer; height: 44px; border-radius: 12px; background: {{ th.btn2 }}; color: {{ th.text }}; font-size: 20px; font-weight: 600">−</button>
<button type="button" onClick="{{ hd.water.add }}" style="appearance: none; border: 0; margin: 0; font: inherit; cursor: pointer; height: 44px; border-radius: 12px; background: {{ wbBg }}; color: {{ wbFg }}; font-size: 15px; font-weight: 600">+ Vaso 250 ml</button>
<button type="button" onClick="{{ hd.water.add2 }}" style="appearance: none; border: 0; margin: 0; font: inherit; cursor: pointer; height: 44px; border-radius: 12px; background: {{ tint.resistencia }}; color: {{ c.resistenciaText }}; font-size: 15px; font-weight: 600">+ Botella 500 ml</button>
</div>
<p style="margin: 0; font-size: 13px; line-height: 18px; color: {{ th.sub }}">{{ hd.water.cue }}</p>
</section>
</sc-if>
</div>
</div>

<div style="order: {{ ho.recup.order }}; display: {{ ho.recup.display }}; border-radius: 26px; padding: {{ ho.pad }}; box-shadow: {{ ho.frame }}">
<sc-if value="{{ editHome }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 4px 10px">
<span style="font-size: 15px; font-weight: 600">{{ ho.recup.label }}</span>
<div style="display: flex; align-items: center; gap: 6px">
<button type="button" onClick="{{ ho.recup.up }}" aria-label="Subir {{ ho.recup.label }}" style="appearance: none; border: 0; margin: 0; padding: 0; font: inherit; cursor: pointer; width: 44px; height: 44px; border-radius: 22px; background: {{ th.btn2 }}; color: {{ th.text }}; opacity: {{ ho.recup.upOp }}; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"></path></svg></button>
<button type="button" onClick="{{ ho.recup.down }}" aria-label="Bajar {{ ho.recup.label }}" style="appearance: none; border: 0; margin: 0; padding: 0; font: inherit; cursor: pointer; width: 44px; height: 44px; border-radius: 22px; background: {{ th.btn2 }}; color: {{ th.text }}; opacity: {{ ho.recup.downOp }}; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
<button type="button" onClick="{{ ho.recup.toggle }}" aria-pressed="{{ ho.recup.hidden }}" style="appearance: none; border: 0; margin: 0; font: inherit; cursor: pointer; height: 44px; min-width: 88px; padding: 0 14px; border-radius: 22px; background: {{ th.btn2 }}; color: {{ primaryText }}; font-size: 15px; font-weight: 600">{{ ho.recup.toggleLabel }}</button>
</div>
</div>
</sc-if>
<div style="opacity: {{ ho.recup.opacity }}; pointer-events: {{ ho.pe }}; max-height: {{ ho.maxH }}; overflow: {{ ho.ov }}; border-radius: 20px; display: flex; flex-direction: column; gap: 20px">
<section aria-labelledby="recup" style="background: {{ th.card }}; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px">
<h2 id="recup" style="margin: 0; font-size: 17px; font-weight: 600">Recuperación</h2>
<span style="font-size: 13px; color: {{ th.sub }}">{{ rec.summary }}</span>
</div>
<div style="display: flex; align-items: center; gap: 12px">
<div style="display: flex; gap: 2px; flex: none">
<svg width="80" height="160" viewBox="0 0 200 400" role="img" aria-label="Recuperación, vista frontal">
<ellipse cx="100" cy="34" rx="19" ry="24" fill="{{ th.bodyBase }}"></ellipse>
<path d="M89 52 C90 60 90 66 88 72 L112 72 C110 66 110 60 111 52 Z" fill="{{ th.bodyBase }}"></path>

window.__dc = { cbs: [], schedule: function () {} };
window.DCLogic = class {
  constructor() { this.props = {}; this.state = {}; }
  setState(patch, cb) {
    var p = typeof patch === 'function' ? patch(this.state, this.props) : patch;
    this.state = Object.assign({}, this.state, p);
    if (cb) window.__dc.cbs.push(cb);
    window.__dc.schedule();
  }
  forceUpdate(cb) { if (cb) window.__dc.cbs.push(cb); window.__dc.schedule(); }

<script>
class Component extends DCLogic {
  state = {
    screen: null,
    tab: null,
    menu: null,
    sel: null,
    log: {},
    xp: 0,
    stats: { fuerza: 10, resistencia: 10, constancia: 10, tecnica: 10 },
    streak: 0,
    best: 0,
    shields: 0,
    perfectWeeks: 0,
    last: null,
    peso: null,
    quiz: { step: 0, minutes: null, intensity: null, series: null },
    t: 1,
    prefs: { tema: 'auto', acento: null, fuente: 'sistema', clase: 'guerrero', nombre: 'Joshen', meta: 5, efectos: true, sonido: true, homeOrder: ['hist', 'habitos', 'agua', 'recup', 'progreso', 'semana', 'rutina', 'logro'], homeHidden: {}, lastBackup: 0, backupSnooze: 0, histMode: 'habitos' },
    plan: { 0: 'superiorA', 1: 'piernasA', 2: 'cardio', 3: 'superiorB', 4: 'piernasB', 5: 'caminata' },
    resetArmed: false,
    noDemo: false,
    sess: null,
    tick: 0,
    since: null,
    editHome: false,
    persisted: false,
    backupMsg: '',
    hlog: {},
    hday: 0,
    habEdit: false,
    pushMsg: '',
    showCode: false
  };

  /* ---------- ciclo de vida y guardado ---------- */

  componentDidMount() {
    let loaded = false;
    let localAt = 0;
    try {
      const raw = window.localStorage.getItem('tracker-rutinas-v3');
      if (raw) {
        const s = JSON.parse(raw);
        this.setState(this.applyData(s));
        localAt = s.savedAt || 1;
        loaded = true;
      }
    } catch (e) {}
    if (!loaded && this.props.datosEjemplo === true) this.setState(this.seedDemo());
    if (!this.state.since) {
      const keys = Object.keys(this.state.log).sort();
      this.setState({ since: keys[0] || this.keyOf(new Date()) }, () => this.persist());
    }
    // Segunda copia en IndexedDB: si localStorage se perdió o quedó atrás, se recupera desde ahí.
    this.idbGet().then((d) => {
      if (d && d.savedAt && d.savedAt > localAt) this.setState(this.applyData(d), () => this.persist());
      else if (loaded) this.idbPut(this.snapshot());
    }).catch(() => {});
    try {
      if (navigator.storage && navigator.storage.persist) {
        navigator.storage.persisted().then((p) => (p ? p : navigator.storage.persist())).then((p) => this.setState({ persisted: !!p })).catch(() => {});
      }
    } catch (e) {}
    this.syncTicker();
  }

  applyData(s) {
    const next = {};
    ['log', 'xp', 'stats', 'streak', 'best', 'shields', 'perfectWeeks', 'peso', 'plan', 'noDemo', 'sess', 'since', 'hlog'].forEach((k) => {
      if (s[k] !== undefined && s[k] !== null) next[k] = s[k];
    });
    if (s.prefs) {
      next.prefs = Object.assign({}, this.state.prefs, s.prefs);
      if (next.prefs.acento && next.prefs.acento.charAt(0) === '#') next.prefs.acento = null;
      const known = ['hist', 'habitos', 'agua', 'recup', 'progreso', 'semana', 'rutina', 'logro'];
      const ord = (next.prefs.homeOrder || []).filter((k) => known.indexOf(k) >= 0);
      if (ord.indexOf('recup') < 0) { const h = ord.indexOf('hist'); ord.splice(h >= 0 ? h + 1 : 0, 0, 'recup'); }
      ['agua', 'habitos'].forEach((nk) => { if (ord.indexOf(nk) < 0) { const h = ord.indexOf('hist'); ord.splice(h >= 0 ? h + 1 : 0, 0, nk); } });
      known.forEach((k) => { if (ord.indexOf(k) < 0) ord.push(k); });
      next.prefs.homeOrder = ord;
    }
    return next;
  }

  snapshot() {
    const s = this.state;
    return {
      schema: 3, savedAt: Date.now(),
      log: s.log, xp: s.xp, stats: s.stats, streak: s.streak, best: s.best, shields: s.shields,
      perfectWeeks: s.perfectWeeks, peso: s.peso, prefs: s.prefs, plan: s.plan, noDemo: s.noDemo, sess: s.sess, since: s.since,
      hlog: s.hlog, derived: this.derived()
    };
  }

  // Resumen que lee el service worker para personalizar las notificaciones
  derived() {
    try {
      const t = new Date();
      const key = this.keyOf(t);
      const d = (this.state.hlog || {})[key] || {};
      const r = this.routineAt(this.todayIdx());
      const names = {};
      for (let i = 0; i < 7; i++) { const rr = this.routineAt(i); if (rr) names[i + 1] = rr.name; }
      const lect = this.habitCatalog().find((h) => h.id === 'lectura');
      return {
        day: key, agua: d.agua || 0, aguaGoal: this.habitGoal({ id: 'agua' }, t), aguaBase: Math.max(8, Math.round((this.peso() * 30) / 250)),
        lectura: d.lectura || 0, lecturaGoal: this.habitGoal(lect, t),
        entreno: r && r.id !== 'caminata' ? r.name : null,
        entrenoHecho: !!(this.state.log[key] && this.state.log[key].status === 'done'), planNames: names
      };
    } catch (e) { return null; }
  }

  idbOpen() {
    if (this._idb) return this._idb;
    this._idb = new Promise((resolve, reject) => {
      try {
        const req = window.indexedDB.open('rutina', 1);
        req.onupgradeneeded = () => req.result.createObjectStore('kv');
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      } catch (e) { reject(e); }
    });
    return this._idb;
  }

  idbGet() {
    return this.idbOpen().then((db) => new Promise((resolve, reject) => {
      const r = db.transaction('kv', 'readonly').objectStore('kv').get('estado');
      r.onsuccess = () => resolve(r.result || null);
      r.onerror = () => reject(r.error);
    }));
  }

  idbPut(data) {
    return this.idbOpen().then((db) => new Promise((resolve) => {
      const tx = db.transaction('kv', 'readwrite');
      tx.objectStore('kv').put(data, 'estado');
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => resolve(false);
    })).catch(() => false);
  }

  exportBackup() {
    this.sfx('tap');
    const name = 'rutina-respaldo-' + this.keyOf(new Date()) + '.json';
    const json = JSON.stringify({ app: 'rutina', version: 1, exportedAt: new Date().toISOString(), data: this.snapshot() });
    const done = () => { this.setPref('lastBackup', Date.now()); this.setState({ backupMsg: 'Respaldo guardado. Guárdalo en Archivos o iCloud Drive.' }); };
    try {
      const file = new File([json], name, { type: 'application/json' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file], title: 'Respaldo de Rutina' }).then(done).catch(() => {});
        return;
      }
    } catch (e) {}
    try {
      const url = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
      const a = document.createElement('a');
      a.href = url; a.download = name; a.style.display = 'none';
      document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 2000);
      done();
    } catch (e) { this.setState({ backupMsg: 'No se pudo crear el respaldo en este navegador.' }); }
  }

  importBackup(e) {
    const input = e && e.target;
    const file = input && input.files && input.files[0];
    if (!file) return;
    file.text().then((txt) => {
      const j = JSON.parse(txt);
      if (!j || j.app !== 'rutina' || !j.data || !j.data.log) throw new Error('formato');
      this.setState(Object.assign(this.applyData(j.data), { last: null, screen: 'inicio' }), () => {
        this.persist();
        const n = Object.keys(this.state.log).filter((k) => this.state.log[k].status === 'done').length;
        this.setState({ backupMsg: 'Respaldo restaurado: ' + n + (n === 1 ? ' sesión.' : ' sesiones.') });
        this.sfx('yes');
      });
    }).catch(() => { this.setState({ backupMsg: 'Ese archivo no es un respaldo de Rutina.' }); this.sfx('no'); });
    try { input.value = ''; } catch (err) {}
  }

  componentDidUpdate() { this.syncTicker(); }

  componentWillUnmount() {
    if (this.raf) cancelAnimationFrame(this.raf);
    if (this.timer) clearTimeout(this.timer);
    if (this.rt) clearTimeout(this.rt);
    if (this.iv) clearInterval(this.iv);
  }

  persist() {
    const data = this.snapshot();
    try { window.localStorage.setItem('tracker-rutinas-v3', JSON.stringify(data)); } catch (e) {}

  }

  fxOn() { return this.state.prefs.efectos !== false; }

  /* ---------- sonido (Web Audio, sintetizado) ---------- */

  sndOn() { return this.state.prefs.sonido !== false; }

  audio() {
    if (!this.sndOn()) return null;
    try {
      if (!this.ac) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        this.ac = new AC();
        this.master = this.ac.createGain();
        this.master.gain.value = 0.55;
        this.master.connect(this.ac.destination);
      }
      if (this.ac.state === 'suspended') this.ac.resume();
      return this.ac;
    } catch (e) { return null; }
  }

  tone(freq, start, dur, o) {
    const ac = this.audio();
    if (!ac) return;
    o = o || {};
    try {
      const t0 = ac.currentTime + (start || 0);
      const osc = ac.createOscillator();
      osc.type = o.type || 'sine';
      osc.frequency.setValueAtTime(freq, t0);
      if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t0 + dur);
      const g = ac.createGain();
      const vol = o.vol == null ? 0.15 : o.vol;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol, t0 + (o.attack || 0.006));
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(g);
      g.connect(this.master);
      osc.start(t0);
      osc.stop(t0 + dur + 0.05);
    } catch (e) {}
  }

  bell(freq, start, vol) {
    this.tone(freq, start, 1.4, { vol: vol });
    this.tone(freq * 2.76, start, 0.7, { vol: vol * 0.35 });
    this.tone(freq * 5.4, start, 0.35, { vol: vol * 0.15 });
  }

  sfx(name) {
    if (!this.sndOn()) return;
    const N = { C5: 523.25, E5: 659.25, G5: 783.99, A5: 880, B5: 987.77, C6: 1046.5, E6: 1318.51, G6: 1567.98, C7: 2093 };

      case 'tap': this.tone(1500, 0, 0.045, { type: 'triangle', vol: 0.05 }); break;
      case 'pick': this.tone(880, 0, 0.09, { type: 'triangle', vol: 0.09 }); this.tone(1320, 0.04, 0.08, { type: 'triangle', vol: 0.05 }); break;
      case 'open': this.tone(380, 0, 0.16, { to: 620, vol: 0.07 }); break;
      case 'yes': this.tone(N.C5, 0, 0.22, { type: 'triangle', vol: 0.13 }); this.tone(N.G5, 0.09, 0.3, { type: 'triangle', vol: 0.13 }); break;
      case 'no': this.tone(330, 0, 0.3, { to: 220, vol: 0.11 }); break;
      case 'fanfare':
        [N.C5, N.E5, N.G5, N.C6].forEach((f, i) => this.tone(f, i * 0.08, 0.3, { type: 'triangle', vol: 0.11 }));
        [N.C5, N.E5, N.G5, N.C6].forEach((f) => this.tone(f, 0.36, 0.9, { vol: 0.055, attack: 0.02 }));
        break;
      case 'levelup':
        [N.G5, N.C6, N.E6, N.G6].forEach((f, i) => this.tone(f, i * 0.06, 0.35, { type: 'triangle', vol: 0.08 }));
        [N.C6, N.E6, N.G6].forEach((f) => this.tone(f, 0.3, 1.0, { vol: 0.06, attack: 0.02 }));
        break;
      case 'stats': this.tone(N.E5, 0, 0.18, { type: 'triangle', vol: 0.08 }); this.tone(N.A5, 0.08, 0.28, { type: 'triangle', vol: 0.08 }); break;
      case 'shield': this.bell(N.E6, 0, 0.08); this.bell(N.B5, 0.12, 0.06); break;
      case 'badge': this.bell(N.C6, 0, 0.09); this.bell(N.G6, 0.1, 0.07); this.bell(N.C7, 0.2, 0.045); break;
    }
  }

  xpTick(n) { this.tone(520 + n * 55, 0, 0.035, { type: 'square', vol: 0.022 }); }

  seg(t, a, b) {
    const x = Math.min(1, Math.max(0, (t - a) / (b - a)));
    // ease-out similar a la curva de iOS
    return 1 - Math.pow(1 - x, 4);
  }

  victoryCues(t, flags) {
    const s = this.state.last;
    if (!s) return;
    const pX = this.seg(t, 0, 0.55);
    const n = Math.floor(pX * 14);
    if (n > flags.tick && pX < 1) { flags.tick = n; this.xpTick(n); }
    if (!flags.lvl && this.levelOf(s.xpBefore + Math.round(s.gain * pX)).level > this.levelOf(s.xpBefore).level) { flags.lvl = true; this.sfx('levelup'); }
    if (!flags.shield && s.weekPerfect && t >= 0.45) { flags.shield = true; this.sfx('shield'); }
    if (!flags.stats && t >= 0.95) { flags.stats = true; this.sfx('stats'); }
    if (!flags.badge && (s.newBadges || []).length && t >= 1) { flags.badge = true; setTimeout(() => this.sfx('badge'), 200); }
  }

  startAnim() {
    if (this.raf) cancelAnimationFrame(this.raf);
    let reduce = false;
    try { reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
    this.sfx('fanfare');
    const s = this.state.last;
    if (reduce || !this.fxOn()) {
      this.setState({ t: 1 });
      if (s && this.levelOf(s.xpAfter).level > this.levelOf(s.xpBefore).level) setTimeout(() => this.sfx('levelup'), 450);
      if (s && (s.newBadges || []).length) setTimeout(() => this.sfx('badge'), 1100);
      return;
    }
    const t0 = performance.now() + 250;
    const dur = 1800;
    const flags = { tick: 0, lvl: false, shield: false, stats: false, badge: false };
    this.setState({ t: 0 });
    const step = (now) => {
      const t = Math.min(1, Math.max(0, (now - t0) / dur));
      this.victoryCues(t, flags);
      this.setState({ t: t });
      if (t < 1) this.raf = requestAnimationFrame(step);
    };
    this.raf = requestAnimationFrame(step);
  }

  stepsFor(rid) { return this.sessionData()[rid] || []; }

  syncTicker() {
    const on = this.nav().screen === 'sesion';
    if (on && !this.iv) this.iv = setInterval(() => this.onTick(), 100);
    if (!on && this.iv) { clearInterval(this.iv); this.iv = null; }
  }

  onTick() {
    const s = this.state.sess;
    const patch = { tick: (this.state.tick + 1) % 100000 };
    if (s && s.restEnd) {
      const left = Math.ceil((s.restEnd - Date.now()) / 1000);
      this.beeped = this.beeped || {};
      if (left <= 3 && left > 0 && !this.beeped[left]) { this.beeped[left] = true; this.tone(880, 0, 0.07, { type: 'triangle', vol: 0.08 }); }
      if (left <= 0) {
        patch.sess = Object.assign({}, s, { restEnd: null });
        this.sfx('shield');
        try { if (navigator.vibrate) navigator.vibrate([60, 40, 60]); } catch (e) {}
      }
    }
    this.setState(patch);
  }

  frameSeq(n, poses) {
    this._seq = this._seq || {};
    const key = n + ':' + poses;
    if (this._seq[key]) return this._seq[key];
    const seg = poses > 1 ? Math.round((n - 1) / (poses - 1)) : n;
    const hold = 6;
    const out = [];
    const push = (f) => { out.push(f); if (f % seg === 0) for (let h = 1; h < hold; h++) out.push(f); };
    for (let f = 0; f < n; f++) push(f);
    for (let f = n - 2; f > 0; f--) push(f);
    this._seq[key] = out;
    return out;
  }

  startSession() {
    const si = this.selIdx();
    const r = this.routineAt(si);
    if (!r) return;
    const date = this.keyOf(this.week()[si]);
    const cur = this.state.sess;
    this.sfx('open');
    if (cur && cur.rid === r.id && cur.date === date) { this.go({ screen: 'sesion', menu: false }); return; }
    this.beeped = {};
    this.go({ screen: 'sesion', menu: false, tick: 0, sess: { rid: r.id, date: date, i: 0, sets: {}, start: Date.now(), restEnd: null, restTotal: 0 } }, () => this.enterStep(0));
  }

  enterStep(i) {
    const s = this.state.sess;
    if (!s) return;
    const p = this.stepsFor(s.rid)[i];
    const next = Object.assign({}, s, { i: i, restEnd: null, restTotal: 0 });
    if (p && p.auto) { next.restEnd = Date.now() + p.auto * 1000; next.restTotal = p.auto; }
    this.beeped = {};
    this.setState({ sess: next, tick: 0 }, () => this.persist());
  }

  sesNext() {
    const s = this.state.sess;
    if (!s) return;
    const n = this.stepsFor(s.rid).length;
    if (s.i < n - 1) { this.sfx('tap'); this.enterStep(s.i + 1); } else this.finishSession();
  }

  sesPrev() {
    const s = this.state.sess;
    if (!s || s.i === 0) return;
    this.sfx('tap');
    this.enterStep(s.i - 1);
  }

  markSet(k) {
    const s = this.state.sess;
    if (!s) return;
    const p = this.stepsFor(s.rid)[s.i];
    const done = s.sets[s.i] || 0;
    const sets = Object.assign({}, s.sets);
    const next = Object.assign({}, s, { sets: sets });
    if (k <= done) { sets[s.i] = k - 1; next.restEnd = null; this.sfx('tap'); }
    else {
      sets[s.i] = k;
      this.sfx('pick');
      if (k < p.sets && p.rest) { next.restEnd = Date.now() + p.rest * 1000; next.restTotal = p.rest; this.beeped = {}; }
      else next.restEnd = null;
      if (k >= p.sets) setTimeout(() => this.sfx('stats'), 150);
    }
    this.setState({ sess: next }, () => this.persist());
  }

  restAdd() {
    const s = this.state.sess;
    if (!s || !s.restEnd) return;
    this.sfx('tap');
    this.setState({ sess: Object.assign({}, s, { restEnd: s.restEnd + 15000, restTotal: s.restTotal + 15 }) });
  }

  restSkip() {
    const s = this.state.sess;
    if (!s) return;
    this.sfx('tap');
    this.setState({ sess: Object.assign({}, s, { restEnd: null }) }, () => this.persist());
  }

  setTotals(s) {
    const steps = this.stepsFor(s.rid);
    let total = 0, done = 0;
    steps.forEach((p, i) => { if (p.sets) { total += p.sets; done += Math.min(p.sets, s.sets[i] || 0); } });
    return { total: total, done: done };
  }

  finishSession() {
    const s = this.state.sess;
    if (!s) return;
    this.sfx('yes');
    const minutes = Math.max(5, Math.round((Date.now() - s.start) / 60000));
    const tt = this.setTotals(s);
    let series = null;
    if (tt.total && tt.done) {
      const ratio = tt.done / tt.total;
      series = this.seriesOpts().reduce((best, o) => (Math.abs(o.v - ratio) < Math.abs(best - ratio) ? o.v : best), 1);
    }
    this.go({ screen: 'test', quiz: { step: 1, minutes: minutes, intensity: null, series: series, fromSession: true, setsDone: tt.done, setsTotal: tt.total } });
  }

  discardSession() {
    this.sfx('no');
    this.go({ sess: null }, () => this.persist());
  }

  fmtClock(sec) {
    sec = Math.max(0, Math.floor(sec));
    const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), x = sec % 60;
    const mm = h ? String(m).padStart(2, '0') : String(m);
    return (h ? h + ':' : '') + mm + ':' + String(x).padStart(2, '0');
  }

  sessionVals(s, th, c, dark, primary, onPrimary, fx) {
    const steps = this.stepsFor(s.rid);
    const R = this.routinesById()[s.rid] || { name: '' };
    const i = Math.max(0, Math.min(s.i, steps.length - 1));
    const p = steps[i] || { k: 'rest', how: [], n: 0, poses: 0, sets: 0, phase: '', name: '', dose: '' };
    const now = Date.now();
    let f = 0;
    if (p.n > 1) f = fx ? this.frameSeq(p.n, p.poses)[this.state.tick % this.frameSeq(p.n, p.poses).length] : p.n - 1;
    const done = s.sets[i] || 0;
    const left = s.restEnd ? Math.max(0, Math.ceil((s.restEnd - now) / 1000)) : 0;
    const phaseColor = { 'Calentamiento': c.heatText, 'Ejercicios': c.fuerzaText, 'Cierre de postura': c.tecnicaText, 'Postura': c.tecnicaText, 'Cardio': c.resistenciaText, 'Core': c.constanciaText }[p.phase] || th.sub;
    const notes = [['Ojo', p.watch, c.fuerzaText], ['Más fácil', p.easier, c.constanciaText], ['Más difícil', p.harder, c.tecnicaText], ['Consejo', p.tip, c.resistenciaText]]
      .filter((x) => x[1]).map((x, j) => ({ label: x[0], text: x[1], color: x[2], line: j ? ('inset 0 0.5px 0 ' + th.sep) : 'none' }));
    const isRest = p.k === 'rest';
    return {
      title: R.name, num: i + 1, total: steps.length, pct: Math.round(((i + 1) / Math.max(1, steps.length)) * 1000) / 10,
      elapsed: this.fmtClock((now - s.start) / 1000),
      even: i % 2 === 0, odd: i % 2 === 1,
      phase: p.phase, phaseColor: phaseColor, round: p.round || '',
      hasImg: !!p.img, img: p.img || '', imgW: Math.max(1, p.n) * 100, shift: p.n ? Math.round((f / p.n) * 100000) / 1000 : 0,
      imgBg: dark ? th.card : '#FFFFFF', imgFilter: dark ? 'invert(0.9) hue-rotate(180deg)' : 'none',
      imgAlt: 'Animación de ' + p.name.toLowerCase(),
      isRestStep: isRest,
      name: p.name, dose: p.dose, hasRest: !!p.rest && !isRest, restLabel: p.rest ? (p.rest >= 60 && p.rest % 60 === 0 ? (p.rest / 60) + ' min' : p.rest + ' s') : '',
      hasWorks: !!p.works, works: p.works || '',
      hasSets: p.sets > 0, sets: p.sets, setsDone: Math.min(done, p.sets),
      setBtns: Array.from({ length: p.sets || 0 }, (_, k) => ({
        n: k + 1, aria: 'Serie ' + (k + 1) + (k < done ? ', hecha' : ''), pressed: k < done, open: k >= done,
        bg: k < done ? primary : th.segBg, fg: k < done ? onPrimary : th.text,
        ring: k === done ? ('inset 0 0 0 2px ' + primary) : 'none',
        pick: () => this.markSet(k + 1)
      })),
      resting: !!s.restEnd && !isRest, restLeft: this.fmtClock(isRest && !s.restEnd ? 0 : left),
      restPct: s.restEnd && s.restTotal ? Math.round((left / s.restTotal) * 1000) / 10 : 0,

  /* Horas para recuperarse tras una sesión dura (cerca del fallo), por grupo muscular.
     Grandes y multiarticulares ~72 h, medianos ~48 h, pequeños ~36 h. */
  recoveryHours() {
    return {
      'Espalda': 72, 'Cuádriceps': 72, 'Isquiotibiales': 72, 'Glúteos': 60,
      'Pecho': 48, 'Hombros': 48, 'Deltoides posterior': 48, 'Tríceps': 42,

    };

  sessionTime(key, s) {
    return s && s.at ? s.at : this.dateOf(key).getTime() + 19 * 3600000;
  }

  // Fatiga de cada músculo en un instante: cada sesión suma fatiga según cuánto trabajó el músculo
  // y la intensidad, y se disipa con una curva suave en el tiempo de recuperación de ese músculo.
  fatigue(st) {
    const RH = this.recoveryHours();
    const TI = { suave: 0.75, moderada: 0.9, dura: 1, limite: 1.2 };
    const now = Date.now();
    const parts = {};
    Object.keys(st.log).forEach((key) => {
      const e = st.log[key];
      if (!e || e.status !== 'done' || !e.summary || !e.summary.muscles) return;
      const t0 = this.sessionTime(key, e.summary);
      const age = (now - t0) / 3600000;
      if (age < 0 || age > 200) return;
      const ti = TI[e.summary.intensityKey] || 0.9;
      e.summary.muscles.forEach((mu) => {
        const w = Math.min(1, mu.w);
        const T = (RH[mu.name] || 48) * ti * (0.6 + 0.4 * w);
        const F = Math.min(1, w * (0.55 + 0.45 * ti));
        (parts[mu.name] = parts[mu.name] || []).push({ age: age, T: T, F: F });
      });
    });
    const at = (list, plus) => Math.min(1, list.reduce((sum, p) => {
      const x = (p.age + plus) / p.T;
      return sum + (x >= 1 ? 0 : p.F * 0.5 * (1 + Math.cos(Math.PI * x)));
    }, 0));
    const out = {};
    Object.keys(parts).forEach((m) => {
      const load = at(parts[m], 0);
      let h = 0;
      while (h < 200 && at(parts[m], h) >= 0.12) h += 1;
      out[m] = { load: load, hours: h };
    });
    return out;
  }

    const dt = d === 1 ? '1 día' : d + ' días';
    if (r >= 21) return 'Listo en ' + (d + 1) + ' días';
    return r < 3 ? 'Listo en ' + dt : 'Listo en ' + dt + ' y ' + r + ' h';
  }

  /* ---------- fechas ---------- */

  week() {
    const now = new Date();
    const t = (now.getDay() + 6) % 7;
    const out = [];
    for (let i = 0; i < 7; i++) out.push(new Date(now.getFullYear(), now.getMonth(), now.getDate() - t + i));
    return out;
  }

  mondayOf(d) {
    const t = (d.getDay() + 6) % 7;
    return new Date(d.getFullYear(), d.getMonth(), d.getDate() - t);
  }

  keyOf(d) {
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return d.getFullYear() + '-' + m + '-' + day;
  }

  dateOf(key) {
    const p = key.split('-').map(Number);
    return new Date(p[0], p[1] - 1, p[2]);
  }

    const n = this.dayNames()[(d.getDay() + 6) % 7];
    return n.charAt(0).toUpperCase() + n.slice(1) + ' ' + d.getDate() + ' de ' + this.monthNames()[d.getMonth()];
  }

  /* ---------- reglas del juego ---------- */

  levelOf(xp) {
    let lvl = 1, need = 100, rest = xp;
    while (rest >= need) { rest -= need; lvl += 1; need = 100 * lvl; }
    return { level: lvl, into: rest, need: need, pct: Math.round((rest / need) * 1000) / 10 };
  }

  peso() {
    const p = Number(this.state.peso ?? this.props.peso ?? 70);
    return p > 0 ? p : 70;
  }

  buildSummary(r, st, q, date) {
    const I = this.intensities()[q.intensity] || this.intensities().moderada;
    const sf = q.series == null ? 1 : q.series;
    const minutes = q.minutes || r.minutes;
    const peso = this.peso();
    const streak = st.streak + 1;
    const bonus = 10 * Math.min(streak - 1, 5);
    const base = Math.max(20, Math.round(((minutes * 1.5 + 20) * I.mult * (0.4 + 0.6 * sf)) / 5) * 5);
    const gain = base + bonus;
    const one = (x) => Math.max(1, Math.round(x));
    const g = {
      fuerza: one(r.gains.fuerza * I.mult * sf),
      resistencia: one(r.gains.resistencia * (minutes / r.minutes) * sf),
      tecnica: one(r.gains.tecnica * sf),
      constancia: streak >= 5 ? 2 : 1
    };
    const cl = this.clases()[this.state.prefs.clase];
    if (cl) g[cl.stat] += 1;
    const statsAfter = {};
    Object.keys(st.stats).forEach((k) => { statsAfter[k] = st.stats[k] + (g[k] || 0); });
    // MET (Compendium, entrenamiento con pesas) × kg × horas
    const kcal = Math.round((I.met * peso * (minutes / 60)) / 5) * 5;
    return {
      id: r.id, name: r.name, title: r.title, minutes: minutes,
      date: this.keyOf(date || new Date()),
      intensityKey: q.intensity || 'moderada', intensity: I.label,
      gain: gain, bonus: bonus, streak: streak,
      xpBefore: st.xp, xpAfter: st.xp + gain,
      statsBefore: Object.assign({}, st.stats), statsAfter: statsAfter,
      classStat: cl ? cl.stat : null,
      kcal: kcal, peso: peso,
      muscles: r.muscles.map((m) => ({
        name: m.name, role: m.w >= 1 ? 'principal' : 'secundario',
        w: Math.round(m.w * (0.5 + 0.5 * sf) * 100) / 100
      }))
    };
  }

  seedDemo() {
    const R = this.routinesById();
    const plan = this.state.plan;
    const meta = this.state.prefs.meta;
    const sim = { log: {}, xp: 0, stats: Object.assign({}, this.state.stats), streak: 0, best: 0, shields: 0, perfectWeeks: 0 };
    const now = new Date();
    const today0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const ti = this.todayIdx();
    const quizzes = [[60, 'dura', 1], [45, 'moderada', 0.8], [60, 'limite', 1], [75, 'dura', 1], [45, 'moderada', 1], [60, 'dura', 0.8], [60, 'moderada', 1]];
    const weekCount = {};
    let k = 0;
    for (let off = ti + 42; off >= 1; off--) {
      const d = new Date(today0.getFullYear(), today0.getMonth(), today0.getDate() - off);
      const rid = plan[(d.getDay() + 6) % 7];
      if (!rid || (rid === 'caminata' && off % 14 > 6)) continue;
      const key = this.keyOf(d);
      if (k === 4 || k === 13) {
        const shielded = sim.shields > 0 && sim.streak > 0;
        sim.log[key] = { status: 'missed', shielded: shielded };
        if (shielded) sim.shields -= 1; else sim.streak = 0;
        k++;
        continue;
      }
      const q = quizzes[k % quizzes.length];
      const s = this.buildSummary(R[rid], sim, { minutes: q[0], intensity: q[1], series: q[2] }, d);
      sim.log[key] = { status: 'done', summary: s };
      sim.xp = s.xpAfter; sim.stats = s.statsAfter; sim.streak = s.streak; sim.best = Math.max(sim.best, s.streak);
      const wk = this.keyOf(this.mondayOf(d));
      weekCount[wk] = (weekCount[wk] || 0) + 1;
      if (weekCount[wk] === meta) { sim.perfectWeeks += 1; sim.shields = Math.min(2, sim.shields + 1); }
      k++;
    }
    return sim;
  }

  metrics(st) {
    const m = { sessions: 0, minutes: 0, kcal: 0, legs: 0, limite: 0 };
    Object.keys(st.log).forEach((key) => {
      const e = st.log[key];
      if (!e || e.status !== 'done' || !e.summary) return;
      const s = e.summary;
      m.sessions += 1;
      m.minutes += s.minutes || 0;
      m.kcal += s.kcal || 0;
      if (s.id === 'piernasA' || s.id === 'piernasB' || s.id === 'piernas') m.legs += 1;
      if (s.intensityKey === 'limite') m.limite += 1;
    });
    m.best = st.best || 0;
    m.perfect = st.perfectWeeks || 0;
    m.level = this.levelOf(st.xp).level;
    return m;
  }

  answerYes() {
    this.sfx('yes');
    this.go({ screen: 'test', menu: false, quiz: { step: 0, minutes: null, intensity: null, series: null } });
  }

  answerNo() {
    this.sfx('no');
    const key = this.keyOf(this.week()[this.selIdx()]);
    const log = Object.assign({}, this.state.log);
    let shields = this.state.shields, streak = this.state.streak;
    const optional = (this.routineAt(this.selIdx()) || {}).id === 'caminata';
    if (!log[key] && optional) {
      log[key] = { status: 'missed', optional: true };
    } else if (!log[key]) {
      const shielded = shields > 0 && streak > 0;
      if (shielded) shields -= 1; else streak = 0;
      log[key] = { status: 'missed', shielded: shielded };
    }
    this.go({ log: log, shields: shields, streak: streak, screen: 'inicio' }, () => this.persist());
  }

  quizPick(field, value) {
    this.sfx('pick');
    const q = Object.assign({}, this.state.quiz);
    q[field] = value;
    this.setState({ quiz: q });
    if (this.timer) clearTimeout(this.timer);
    this.timer = setTimeout(() => {
      if (q.step >= 2) this.finish(q);
      else this.setState({ quiz: Object.assign({}, q, { step: q.step + 1 }) });
    }, 220);
  }

  finish(q) {
    const R = this.routinesById();
    const si = this.selIdx();
    const r0 = this.routineAt(si);
    const r = r0 || R.superiorA;
    const st = this.state;
    const days = this.week();
    const s = this.buildSummary(r, st, q, days[si]);
    s.meta = st.prefs.meta;
    s.at = si === this.todayIdx() ? Date.now() : days[si].getTime() + 19 * 3600000;
    if (!r0) {
      s.weekDone = 0;
      this.go({ last: s, screen: 'victoria' }, () => this.startAnim());
      return;
    }
    const log = Object.assign({}, st.log);
    log[this.keyOf(days[si])] = { status: 'done', summary: s };
    const weekDone = days.filter((d) => log[this.keyOf(d)] && log[this.keyOf(d)].status === 'done').length;
    let shields = st.shields, perfectWeeks = st.perfectWeeks;
    s.weekDone = weekDone;
    if (weekDone === st.prefs.meta) {
      perfectWeeks += 1;
      s.weekPerfect = true;
      s.shieldEarned = shields < 2;
      shields = Math.min(2, shields + 1);
    }
    const next = { log: log, xp: s.xpAfter, stats: s.statsAfter, streak: s.streak, best: Math.max(st.best, s.streak), shields: shields, perfectWeeks: perfectWeeks, sess: null };
    const before = {};
    this.badges(st).forEach((b) => { if (b.unlocked) before[b.id] = true; });
    s.newBadges = this.badges(Object.assign({}, st, next)).filter((b) => b.unlocked && !before[b.id]).map((b) => b.id);
    this.go(Object.assign(next, { last: s, screen: 'victoria' }), () => { this.persist(); this.startAnim(); });
  }

    const ord = this.state.prefs.homeOrder.slice();
    const i = ord.indexOf(k), j = i + dir;
    if (i < 0 || j < 0 || j >= ord.length) return;
    this.sfx('tap');

    this.sfx('tap');

    const cur = this.state.plan[i] || null;

    this.setState({ plan: plan }, () => this.persist());
  }

  habitCfg() {
    const p = this.state.prefs;
    const hp = p.habits || {};
    const on = hp.on || this.habitCatalog().filter((h) => h.def).map((h) => h.id);
    return { on: on, goals: hp.goals || {}, cues: hp.cues || {}, minis: hp.minis || {} };
  }

  setHabitCfg(patch) {
    const cfg = this.habitCfg();
    this.setPref('habits', Object.assign({ on: cfg.on, goals: cfg.goals, cues: cfg.cues, minis: cfg.minis }, patch));
  }

  waterGoal(date) {
    // ~30 ml por kg al día en bebidas (los 3,7 L de referencia para hombres incluyen comida) + 500 ml si entrenas.
    const base = Math.max(8, Math.round((this.peso() * 30) / 250));
    const r = this.routineAt((date.getDay() + 6) % 7);
    return base + (r && r.id !== 'caminata' ? 2 : 0);
  }

  habitGoal(h, date) {
    if (h.id === 'agua') return this.habitCfg().goals.agua || this.waterGoal(date);
    return this.habitCfg().goals[h.id] || h.goal || 1;
  }

  // fracción cumplida de un hábito en un día: null = no aplica (descanso), 0..1
  habitFrac(h, key, date) {
    const st = this.state;
    if (h.kind === 'auto') {
      const r = this.routineAt((date.getDay() + 6) % 7);
      const e = st.log[key];
      if (e && e.status === 'done') return 1;
      if (!r || r.id === 'caminata') return null;
      return 0;
    }
    const d = (st.hlog || {})[key] || {};
    const mini = !!d[h.id + '~'];
    let f = h.kind === 'bin' ? (d[h.id] ? 1 : 0) : Math.min(1, (d[h.id] || 0) / this.habitGoal(h, date));
    if (mini && f < 0.5) f = 0.5;
    return f;
  }

  habitMet(h, key, date) {
    const f = this.habitFrac(h, key, date);
    if (f === null) return null;
    const d = ((this.state.hlog || {})[key] || {});
    return f >= 1 || !!d[h.id + '~'];
  }

  dayScore(key, date) {
    const cfg = this.habitCfg();
    const list = this.habitCatalog().filter((h) => cfg.on.indexOf(h.id) >= 0);
    let n = 0, sum = 0;
    list.forEach((h) => { const f = this.habitFrac(h, key, date); if (f !== null) { n++; sum += f; } });
    return n ? sum / n : null;
  }

  habitStreak(h, today0) {
    let streak = 0;
    for (let i = 0; i < 400; i++) {
      const d = new Date(today0.getFullYear(), today0.getMonth(), today0.getDate() - i);
      const m = this.habitMet(h, this.keyOf(d), d);
      if (m === null) continue;
      if (m) streak++;
      else if (i === 0) continue;
      else break;
    }
    return streak;
  }

  setHabit(key, id, v) {
    const hl = Object.assign({}, this.state.hlog || {});
    hl[key] = Object.assign({}, hl[key] || {});
    if (v === null || v === 0 || v === false) delete hl[key][id]; else hl[key][id] = v;
    this.setState({ hlog: hl }, () => this.persist());
  }

  habitDate() {
    const now = new Date();
    return new Date(now.getFullYear(), now.getMonth(), now.getDate() + (this.state.hday || 0));
  }

  fmtNum(v) { return String(Math.round(v * 10) / 10).replace('.', ','); }

  habitValueLabel(h, v, goal) {
    if (h.kind === 'bin') return v ? 'Hecho' : 'Pendiente';
    if (h.id === 'pasos') return this.fmtNum(v) + ' de ' + goal + ' mil pasos';
    return this.fmtNum(v) + ' de ' + this.fmtNum(goal) + ' ' + h.unit;
  }

    const cfg = this.habitCfg();
    const date = this.habitDate();
    const key = this.keyOf(date);
    const now = new Date();
    const today0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const isToday = (st.hday || 0) === 0;
    const yesterday = new Date(date.getFullYear(), date.getMonth(), date.getDate() - 1);
    const ykey = this.keyOf(yesterday);
    const d = (st.hlog || {})[key] || {};
    const cat = this.habitCatalog();
    const tint = (k) => c[k] + (dark ? '33' : '24');
    const items = [];
    let done = 0, total = 0;
    cat.filter((h) => cfg.on.indexOf(h.id) >= 0).forEach((h) => {
      const f = this.habitFrac(h, key, date);
      if (f === null) return;
      total++;
      const met = f >= 1;
      if (met) done++;
      if (h.id === 'agua') return;
      const goal = this.habitGoal(h, date);
      const v = d[h.id] || 0;
      const ym = this.habitMet(h, ykey, yesterday);
      const mini = !!d[h.id + '~'];
      const streak = this.habitStreak(h, date);
      const atRisk = ym === false && ykey >= (st.since || key) && !met && !mini;
      const step = h.step || 1;
      let status;
      if (h.kind === 'auto') status = met ? 'Sesión completada' : 'Toca entrenar hoy';
      else status = this.habitValueLabel(h, v, goal);
      if (mini && !met) status += ', versión mínima';
      items.push({
        id: h.id, name: h.name, icon: h.icon, color: c[h.color], tint: tint(h.color),
        status: status, streakTxt: streak > 1 ? streak + ' días seguidos' : '',

        doMini: () => { this.sfx('pick'); this.setHabit(key, h.id + '~', true); },
        valueShort: h.kind === 'num' ? this.fmtNum(v) : ''
      });
    });
    // agua
    const wOn = cfg.on.indexOf('agua') >= 0;
    const wGoal = this.habitGoal({ id: 'agua' }, date);
    const w = d.agua || 0;
    const glasses = [];
    for (let i = 1; i <= Math.max(wGoal, w); i++) {
      const full = i <= w;
      glasses.push({
        aria: 'Vaso ' + i + (full ? ', tomado' : ''),
        fill: full ? c.resistencia : 'none', stroke: full ? c.resistencia : th.tertiary,
        bg: full ? tint('resistencia') : th.segBg,
        pick: () => { this.sfx(full ? 'tap' : 'pick'); this.setHabit(key, 'agua', i === w ? i - 1 : i); }
      });
    }
    const L = (n) => String(Math.round(n * 0.25 * 100) / 100).replace('.', ',');
    const water = {
      on: wOn, count: w, goal: wGoal, liters: L(w), goalL: L(wGoal), glasses: glasses,
      pct: Math.round(Math.min(1, w / wGoal) * 100), met: w >= wGoal,
      left: w >= wGoal ? 'Meta cumplida' : 'Te faltan ' + (wGoal - w) + (wGoal - w === 1 ? ' vaso' : ' vasos'),
      cue: cfg.cues.agua || cat[1].cue,
      add: () => { this.sfx(w + 1 === wGoal ? 'pick' : 'tap'); this.setHabit(key, 'agua', w + 1); },
      add2: () => { this.sfx(w + 2 >= wGoal && w < wGoal ? 'pick' : 'tap'); this.setHabit(key, 'agua', w + 2); },
      sub: () => { this.sfx('tap'); this.setHabit(key, 'agua', Math.max(0, w - 1)); }
    };
    const score = total ? done / total : 0;
    const names = this.dayNames();
    const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
    const left = total - done;
    return {
      dayLabel: isToday ? 'Hoy' : ((st.hday || 0) === -1 ? 'Ayer' : cap(names[(date.getDay() + 6) % 7]) + ' ' + date.getDate()),
      dateLabel: this.longDate(date), isToday: isToday, canNext: !isToday, canPrev: (st.hday || 0) > -6,
      nextOp: isToday ? 0.3 : 1, prevOp: (st.hday || 0) > -6 ? 1 : 0.3,
      done: done, total: total, items: items, water: water,
      ringOff: (238.8 * (1 - score)).toFixed(1),
      title: total ? (done === total ? 'Día completo' : 'Vas al ' + Math.round(score * 100) + '%') : 'Sin hábitos',
      sub: total ? (left === 0 ? 'Este día queda en el verde más oscuro del historial.' : 'Te faltan ' + left + (left === 1 ? ' hábito' : ' hábitos') + ' para el verde más oscuro.') : 'Elige qué hábitos seguir.',
      hasRisk: items.some((x) => x.atRisk),
      prev: () => { this.sfx('tap'); this.setState({ hday: Math.max(-6, (st.hday || 0) - 1) }); },
      next: () => { this.sfx('tap'); this.setState({ hday: Math.min(0, (st.hday || 0) + 1) }); }
    };
  }

  habitEditorVals(th, c, dark, primary) {
    const cfg = this.habitCfg();
    const today = new Date();
    return this.habitCatalog().map((h, i) => {
      const on = cfg.on.indexOf(h.id) >= 0;
      const hasGoal = h.kind === 'num';
      const goal = hasGoal ? this.habitGoal(h, today) : 0;
      const step = h.step || 1;
      const autoWater = h.id === 'agua' && !cfg.goals.agua;
      return {
        id: h.id, name: h.name, desc: h.desc, icon: h.icon, color: c[h.color], tint: c[h.color] + (dark ? '33' : '24'),

  hhmm(m) { m = ((m % 1440) + 1440) % 1440; return Math.floor(m / 60) + ':' + String(m % 60).padStart(2, '0'); }

  pushSupported() {
    try { return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window; } catch (e) { return false; }
  }

  isStandalone() {
    try { return window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches; } catch (e) { return false; }
  }

  b64u(bytes) {
    let s = '';
    bytes.forEach((b) => { s += String.fromCharCode(b); });
    return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }

  fromB64u(str) {
    const s = atob(str.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((str.length + 3) % 4));
    return Uint8Array.from(s, (ch) => ch.charCodeAt(0));
  }

  async enablePush() {
    // requestPermission tiene que ser lo primero tras el toque (iOS exige el gesto del usuario)
    let perm = 'default';
    try { perm = await Notification.requestPermission(); } catch (e) {}
    this.sfx('tap');
    if (perm !== 'granted') {
      this.setState({ pushMsg: 'Sin permiso. Actívalo en Ajustes del iPhone, Notificaciones, Rutina.' });
      return;
    }
    try {
      let keys = this.state.prefs.pushKeys;
      if (!keys) {
        const kp = await crypto.subtle.generateKey({ name: 'ECDSA', namedCurve: 'P-256' }, true, ['sign', 'verify']);
        const raw = new Uint8Array(await crypto.subtle.exportKey('raw', kp.publicKey));
        const jwk = await crypto.subtle.exportKey('jwk', kp.privateKey);
        keys = { pub: this.b64u(raw), priv: jwk.d };
      }
      const reg = await navigator.serviceWorker.ready;
      let sub = await reg.pushManager.getSubscription();
      if (sub) {
        const cur = sub.options && sub.options.applicationServerKey ? this.b64u(new Uint8Array(sub.options.applicationServerKey)) : null;
        if (cur && cur !== keys.pub) { await sub.unsubscribe(); sub = null; }
      }
      if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: this.fromB64u(keys.pub) });
      const p = Object.assign({}, this.state.prefs, { pushKeys: keys, pushSub: sub.toJSON(), remDirty: true });
      this.setState({ prefs: p, pushMsg: 'Activados en este teléfono. Falta el último paso: copia el código y pégalo en GitHub.' }, () => this.persist());
      this.sfx('yes');
    } catch (e) {
      this.setState({ pushMsg: 'No se pudo activar: ' + (e && e.message ? e.message : 'error desconocido') });
    }
  }

  pushCode() {
    const p = this.state.prefs;
    if (!p.pushSub || !p.pushKeys) return '';
    const r = this.remCfg();
    const days = [];
    for (let i = 0; i < 7; i++) { const rr = this.routineAt(i); if (rr && rr.id !== 'caminata') days.push(i + 1); }
    let tz = 'America/Santiago';
    try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || tz; } catch (e) {}
    const cfg = { v: 1, tz: tz, sub: p.pushSub, pub: p.pushKeys.pub, priv: p.pushKeys.priv, rem: r, days: days };
    const json = JSON.stringify(cfg);
    return this.b64u(new TextEncoder().encode(json));
  }

  copyPushCode() {
    const code = this.pushCode();
    if (!code) return;
    this.sfx('tap');
    const ok = () => {
      const p = Object.assign({}, this.state.prefs, { remDirty: false });
      this.setState({ prefs: p, pushMsg: 'Código copiado. Ábrelo en GitHub y pégalo como el secreto RUTINA_PUSH.', showCode: false }, () => this.persist());
    };
    try {
      navigator.clipboard.writeText(code).then(ok).catch(() => this.setState({ showCode: true, pushMsg: 'Copia el código de abajo manualmente.' }));
    } catch (e) { this.setState({ showCode: true, pushMsg: 'Copia el código de abajo manualmente.' }); }
  }

  /* ---------- vistas ---------- */

  mix(a, b, t) {
    const p = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
    const A = p(a), B = p(b);
    const k = Math.max(0, Math.min(1, t));
    return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * k).toString(16).padStart(2, '0')).join('');
  }

  heatColor(th, c, dark, t) {
    const soft = dark ? '#C9650C' : '#FFC27A';
    if (t <= 0.5) return this.mix(th.muscleOff, soft, t * 2);
    return this.mix(soft, c.heat, (t - 0.5) * 2);
  }

  isDark() {
    const t = this.state.prefs.tema;
    if (t === 'oscuro') return true;
    if (t === 'claro') return false;
    try { return window.matchMedia('(prefers-color-scheme: dark)').matches; } catch (e) { return false; }
  }

  theme(dark) {
    return dark ? {
      bg: '#000000', card: '#1C1C1E', menu: '#2C2C2E', text: '#FFFFFF', sub: '#98989F', tertiary: '#5A5A5F', sep: '#38383A',
      fill: '#2C2C2E', btn2: '#2C2C2E', segBg: '#3A3A3C', segSel: '#636366', bodyBase: '#2C2C2E', muscleOff: '#48484A', barOff: '#48484A',
      bar: 'rgba(22, 22, 23, 0.92)', scrim: 'rgba(0, 0, 0, 0.5)', shadow: '0 12px 40px rgba(0, 0, 0, 0.55)', danger: '#FF453A'
    } : {
      bg: '#F2F2F7', card: '#FFFFFF', menu: '#FFFFFF', text: '#000000', sub: '#6C6C70', tertiary: '#C4C4C8', sep: '#DCDCE0',
      fill: '#E9E9EE', btn2: '#E5E5EA', segBg: '#EEEEF0', segSel: '#FFFFFF', bodyBase: '#E1E1E6', muscleOff: '#CDCDD2', barOff: '#D1D1D6',
      bar: 'rgba(249, 249, 249, 0.92)', scrim: 'rgba(0, 0, 0, 0.25)', shadow: '0 12px 40px rgba(0, 0, 0, 0.16)', danger: '#D70015'
    };
  }

  fonts() {
    return {
      sistema: "-apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, system-ui, sans-serif",
      redondeada: "ui-rounded, 'SF Pro Rounded', Nunito, system-ui, sans-serif",

  medal(color, unlocked, dark, th, c, primary, primaryText) {
    if (!unlocked) return { bg: th.fill, fg: th.tertiary, shadow: 'none', nameColor: th.sub };
    if (color === 'mono') return { bg: primary + (dark ? '29' : '14'), fg: primaryText, shadow: 'inset 0 0 0 2px ' + primary + '59', nameColor: th.text };
    return { bg: c[color] + (dark ? '33' : '24'), fg: c[color + 'Text'], shadow: 'inset 0 0 0 2px ' + c[color] + '66', nameColor: th.text };
  }

  victoryVals(s, t, th, c, dark, primary, onPrimary) {
    const pX = this.seg(t, 0, 0.55), pB = this.seg(t, 0.15, 0.7), pT = this.seg(t, 0.1, 0.6), pS = this.seg(t, 0.35, 0.95);
    const a = this.levelOf(s.xpBefore);
    const lv = this.levelOf(s.xpBefore + Math.round(s.gain * pX));
    const leveledNow = lv.level > a.level;
    const body = {};
    this.regionKeys().forEach((k) => { body[k] = 0; });
    s.muscles.forEach((m) => { this.regionsOf(m.name).forEach((k) => { body[k] = Math.max(body[k], m.w); }); });
    const vb = {};
    Object.keys(body).forEach((k) => { vb[k] = this.heatColor(th, c, dark, body[k] * pB); });
    const labels = [['fuerza', 'Fuerza'], ['resistencia', 'Resistencia'], ['constancia', 'Constancia'], ['tecnica', 'Técnica']];
    const all = {};
    this.badges(this.state).forEach((b) => { all[b.id] = b; });
    const nb = (s.newBadges || []).filter((id) => all[id]).map((id, i) => {
      const b = all[id];
      return Object.assign({ name: b.name, desc: b.desc, glyph: b.glyph, line: i ? ('inset 0 0.5px 0 ' + th.sep) : 'none' }, this.medal(b.color, true, dark, th, c, primary, this.primaryTextCache));
    });
    const d = s.date ? this.dateOf(s.date) : new Date();
    return {
      v: {
        dateLine: s.name + ', ' + this.longDate(d).toLowerCase(),
        minutes: s.minutes, intensity: s.intensity || 'Moderada',
        gainNow: Math.round(s.gain * pX),
        level: lv.level, nextLevel: lv.level + 1, into: lv.into, need: lv.need,
        ringOff: (477.5 * (1 - lv.pct / 100)).toFixed(1),
        leveledNow: leveledNow, notLeveledNow: !leveledNow,
        hasBonus: s.bonus > 0, bonus: s.bonus,
        kcalNow: this.fmt(s.kcal * pT),
        streakNow: Math.max(0, Math.round((s.streak - 1) + pT)),
        streakWord: s.streak === 1 ? 'sesión' : 'sesiones',
        weekPerfect: !!s.weekPerfect,
        shieldText: s.shieldEarned ? 'Ganaste un escudo de racha.' : 'Ya tienes el máximo de 2 escudos.',
        hasBadges: nb.length > 0, badges: nb,
        muscles: s.muscles.map((m) => ({
          name: m.name, role: m.role, pct: Math.round(m.w * 100 * pB), w: Math.round(m.w * 1000 * pB) / 10
        })),
        stats: labels.map((l, i) => {
          const before = s.statsBefore[l[0]], after = s.statsAfter[l[0]];
          const delta = after - before;
          const cap = Math.ceil((after + 5) / 25) * 25;
          return {
            label: l[1], color: c[l[0]], text: c[l[0] + 'Text'], soft: c[l[0]] + (dark ? '59' : '4D'),
            cur: Math.round(before + delta * pS), deltaNow: Math.round(delta * pS),
            wBefore: Math.round((before / cap) * 1000) / 10,
            wGain: Math.round(((delta * pS) / cap) * 1000) / 10,
            line: i ? ('inset 0 0.5px 0 ' + th.sep) : 'none',
            hasNote: s.classStat === l[0], note: 'Incluye +1 por tu clase'
          };
        })
      },
      vb: vb
    };
  }
