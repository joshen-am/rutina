          hDone++;
        } else if (e && e.status === 'missed' && !e.optional) {
          bg = e.shielded ? c.resistencia + (dark ? '73' : '59') : missBg;
          hMiss++;
        } else if (rid && rid !== 'caminata' && day < today0 && day >= sinceD) {
          bg = missBg;
          hMiss++;
        } else if (day > today0) {
          bg = 'transparent'; ring = 'inset 0 0 0 1px ' + th.sep;
        }
        if (habMode) {
          ring = 'none';
          const sc = day <= today0 && day >= sinceD ? this.dayScore(this.keyOf(day), day) : null;
          if (day > today0) { bg = 'transparent'; ring = 'inset 0 0 0 1px ' + th.sep; }
          else if (sc === null || sc <= 0) bg = th.fill;
          else { bg = this.mix(th.fill, c.constancia, sc >= 1 ? 1 : sc > 0.66 ? 0.78 : sc > 0.33 ? 0.55 : 0.32); if (sc >= 1) hFull++; }
        }
        if (isToday) ring = 'inset 0 0 0 1.5px ' + primary;
        items.push({ isLabel: false, isCell: true, bg: bg, ring: ring });
      }
    }
    const hist = {
      weeks: HW, items: items, missBg: missBg,
      scale: shades.map((k) => ({ bg: this.mix(th.fill, c.constancia, k) })),
      summary: habMode ? (hFull + (hFull === 1 ? ' día completo' : ' días completos')) : (hDone + (hDone === 1 ? ' sesión' : ' sesiones') + ' en ' + HW + ' semanas'),
      habMode: habMode, trainMode: !habMode,
      modes: [['habitos', 'Hábitos'], ['entreno', 'Entrenos']].map((m) => {
        const sel = (st.prefs.histMode || 'habitos') === m[0];
        return { label: m[1], selected: sel, bg: sel ? th.segSel : 'transparent', weight: sel ? 600 : 400, shadow: sel && !dark ? '0 2px 6px rgba(0, 0, 0, 0.12)' : 'none', pick: () => { this.sfx('tap'); this.setPref('histMode', m[0]); } };
      }),
      aria: 'Historial de las últimas ' + HW + ' semanas: ' + hDone + ' sesiones hechas y ' + hMiss + ' no hechas.'
    };

    const wb = {
      bars: wraw.map((o) => ({
        label: o.label, h: Math.round((o.cnt / maxC) * 100),
        bg: o.cnt >= meta ? primary : (o.cnt ? th.barOff : th.fill),
        labelColor: o.cur ? th.text : th.sub, labelWeight: o.cur ? 600 : 400
      })),
      metaPx: Math.round((meta / maxC) * 100),
      aria: 'Sesiones por semana, de la más antigua a la actual: ' + wraw.map((o) => o.cnt).join(', ')
    };

    /* victoria */
    const summary = st.last || Object.assign(this.buildSummary(rc, st, { minutes: rc.minutes, intensity: 'dura', series: 0.8 }, sd), { weekDone: weekDone, meta: meta });
    const vv = this.victoryVals(summary, st.t, th, c, dark, primary, onPrimary);

    /* orden de inicio */
    const edit = !!st.editHome;
    const HL = { hist: 'Historial', habitos: 'Hábitos de hoy', agua: 'Agua', recup: 'Recuperación muscular', progreso: 'Nivel y semana', semana: 'Días de la semana', rutina: 'Rutina del día', logro: 'Próximo logro' };
    const ordH = st.prefs.homeOrder || ['hist', 'habitos', 'agua', 'recup', 'progreso', 'semana', 'rutina', 'logro'];
    const hidH = st.prefs.homeHidden || {};
    const ho = { pad: edit ? '10px' : '0', frame: edit ? ('inset 0 0 0 1.5px ' + th.sep) : 'none', pe: edit ? 'none' : 'auto', maxH: edit ? '132px' : 'none', ov: edit ? 'hidden' : 'visible' };
    ordH.forEach((k, idx) => {
      const hidden = !!hidH[k];
      ho[k] = {
        label: HL[k], order: idx + 1, hidden: hidden,
        display: hidden && !edit ? 'none' : 'block', opacity: hidden && edit ? 0.35 : 1,
        upOp: idx === 0 ? 0.35 : 1, downOp: idx === ordH.length - 1 ? 0.35 : 1,
        toggleLabel: hidden ? 'Mostrar' : 'Ocultar',
        up: () => this.moveHome(k, -1), down: () => this.moveHome(k, 1), toggle: () => this.toggleHome(k)
      };
    });

    const hdv = this.habitsVals(th, c, dark, primary, onPrimary);

    /* sesión */
    const sesForView = st.sess || { rid: rc.id, date: '', i: 9, sets: { 9: 1 }, start: Date.now() - 754000, restEnd: null, restTotal: 0 };
    const ss = this.sessionVals(sesForView, th, c, dark, primary, onPrimary, fx);
    const sesToday = st.sess && r0 && st.sess.rid === r0.id && st.sess.date === this.keyOf(sd);

    /* perfil */
    const temas = [['claro', 'Claro'], ['oscuro', 'Oscuro'], ['auto', 'Auto']];
    const fuentes = [['sistema', 'Sistema'], ['redondeada', 'Redonda'], ['serif', 'Serif']];
    const C = this.clases();
    const selRing = 'inset 0 0 0 2px ' + primary;

    const tabC = {}, tabW = {}, tabGo = {}, tabCur = {};
    ['inicio', 'habitos', 'stats', 'logros', 'ajustes'].forEach((k) => {
      const on = n.tab === k;
      tabC[k] = on ? primaryText : th.sub;
      tabW[k] = on ? 2.3 : 1.8;
      tabCur[k] = on ? 'page' : null;
      tabGo[k] = () => { this.sfx('tap'); this.go({ tab: k, screen: 'inicio', menu: false }); };
    });
    const main = n.screen === 'inicio' || n.screen === 'confirmar';

    const shieldMsg = rc.id === 'caminata' ? 'Es opcional: si respondes que no, tu racha no cambia.' : st.streak > 0
      ? (st.shields > 0 ? 'Si respondes que no, usarás un escudo y mantendrás tu racha de ' + st.streak + '.' : 'Si respondes que no, tu racha de ' + st.streak + ' volverá a cero.')
      : '';

    return {
      th: th, c: c, tint: tint, primary: primary, onPrimary: onPrimary, primaryText: primaryText,
      font: fonts[st.prefs.fuente] || fonts.sistema,
      prefs: st.prefs, initial: (st.prefs.nombre || '?').trim().charAt(0).toUpperCase() || '?',
      clase: cl,

      showInicio: main && n.tab === 'inicio',
      showStats: main && n.tab === 'stats',
      showLogros: main && n.tab === 'logros',
      showAjustes: main && n.tab === 'ajustes',
      showHabitos: main && n.tab === 'habitos' && !st.habEdit,
      isHabEditor: main && n.tab === 'habitos' && !!st.habEdit,
      hd: hdv, he: this.habitEditorVals(th, c, dark, primary), rm: this.remVals(th, c),
      wbBg: dark ? c.resistencia : c.resistenciaText, wbFg: dark ? '#000000' : '#FFFFFF',
      openHabEditor: () => { this.sfx('open'); this.go({ habEdit: true, tab: 'habitos', screen: 'inicio', menu: false }); },
      closeHabEditor: () => { this.sfx('tap'); this.setState({ habEdit: false }); },
      goHabitos: () => { this.sfx('tap'); this.go({ tab: 'habitos', screen: 'inicio', menu: false, hday: 0 }); },
      showTabs: main && !st.habEdit,
      menuOpen: main && n.menu,
      isConfirm: n.screen === 'confirmar',
      isTest: n.screen === 'test',
      isVictory: n.screen === 'victoria',
      isSesion: n.screen === 'sesion',
      ss: ss, hasSess: !!sesToday,
      startLabel: sesToday ? 'Continuar sesión, paso ' + (st.sess.i + 1) : 'Iniciar sesión',

      dateLabel: this.longDate(sd),
      dayTitle: si === ti ? 'Hoy' : cap(names[si]),
      selName: names[si],
      lvl: this.levelOf(st.xp),
      streak: st.streak,
      shields: st.shields,
      shieldWord: st.shields === 1 ? 'escudo' : 'escudos',
      wk: { done: weekDone, meta: meta, off: (238.8 * (1 - Math.min(1, weekDone / meta))).toFixed(1) },
      days: dayVm,
      hasRoutine: !!r0, isRest: !r0, isDone: isDone, isMissed: isMissed, isFuture: isFuture,
      missedLabel: entry && entry.optional ? 'No la hiciste' : (entry && entry.shielded ? 'Protegida con escudo' : 'No completada'),
      canFinish: !!r0 && !isDone && !isMissed && !isFuture,
      showBar: !!r0,
      showBarNow: !!r0 && !edit,
      editHome: edit, ho: ho, editLabel: edit ? 'Listo' : 'Ordenar inicio',
      toggleEdit: () => { this.sfx('tap'); this.go({ editHome: !edit }); },
      editFromSettings: () => { this.sfx('tap'); this.go({ editHome: true, tab: 'inicio', screen: 'inicio', menu: false }); },
      r: r, rc: rc, rcTitleLower: rc.title.charAt(0).toLowerCase() + rc.title.slice(1),
      hasShieldMsg: !!shieldMsg, shieldMsg: shieldMsg,

      hasNext: !!next, nb: nb, badgeList: badgeList, badgeCount: unlocked, badgeTotal: bl.length,
      tot: tot, radar: radar, hb: hb, hist: hist,
      heat: { has: top.length > 0, none: top.length === 0, top: top.slice(0, 6) },
      rec: {
        has: recovering > 0, none: recovering === 0, top: top.slice(0, 4),
        summary: recovering ? (recovering === 1 ? '1 músculo recuperándose' : recovering + ' músculos recuperándose') : 'Todo recuperado'
      },
      persistLabel: st.persisted ? 'Protegido' : 'Activo',
      backupLabel: st.prefs.lastBackup ? this.agoText(st.prefs.lastBackup) : 'Nunca',
      hasBackupMsg: !!st.backupMsg, backupMsg: st.backupMsg || '',
      showBackupNudge: m.sessions >= 3 && Date.now() - (st.prefs.lastBackup || 0) > 14 * 864e5 && Date.now() > (st.prefs.backupSnooze || 0),
      exportBackup: () => this.exportBackup(),
      importBackup: (e) => this.importBackup(e),
      snoozeBackup: () => { this.sfx('tap'); this.setPref('backupSnooze', Date.now() + 7 * 864e5); },
      wb: wb,

      q: this.quizVals(primary, onPrimary, th),
      pesoActual: this.peso(),
      v: vv.v, vb: vv.vb,

      temaOpts: temas.map((x) => {
        const sel = st.prefs.tema === x[0];
        return { label: x[1], selected: sel, bg: sel ? th.segSel : 'transparent', weight: sel ? 600 : 400, shadow: sel && !dark ? '0 3px 8px rgba(0, 0, 0, 0.12), 0 1px 1px rgba(0, 0, 0, 0.04)' : 'none', pick: () => { this.sfx('tap'); this.setPref('tema', x[0]); } };
      }),
      temaName: (temas.find((x) => x[0] === st.prefs.tema) || temas[2])[1],
      colorOpts: ACC.map((x) => {
        const sel = x.key === acc.key;
        const hex = dark ? x.dark : x.light;
        return { label: x.name, hex: hex, selected: sel, check: dark ? x.onDark : x.onLight, ring: sel ? ('0 0 0 2px ' + th.menu + ', 0 0 0 4px ' + hex) : 'none', pick: () => { this.sfx('tap'); this.setPref('acento', x.key); } };
      }),
      colorName: acc.name,
      fuenteOpts: fuentes.map((x) => {
        const sel = st.prefs.fuente === x[0];
        return { label: x[1], fam: fonts[x[0]], selected: sel, ring: sel ? selRing : 'none', pick: () => { this.sfx('tap'); this.setPref('fuente', x[0]); } };
      }),
      claseOpts: Object.keys(C).map((k) => {
        const sel = st.prefs.clase === k;
        return {
          label: C[k].name, bonus: C[k].bonus, icon: c[C[k].stat],
          isG: k === 'guerrero', isE: k === 'explorador', isS: k === 'estratega',
          selected: sel, ring: sel ? selRing : 'none', pick: () => { this.sfx('tap'); this.setPref('clase', k); }
        };
      }),

      planRows: [0, 1, 2, 3, 4, 5, 6].map((i) => {
        const rr = this.routineAt(i);
        return {
          day: cap(names[i]), value: rr ? rr.name : 'Descanso',
          color: rr ? th.text : th.sub,
          line: i ? ('inset 0 0.5px 0 ' + th.sep) : 'none',
          aria: cap(names[i]) + ': ' + (rr ? rr.name : 'descanso') + '. Toca para cambiar',
          pick: () => this.cyclePlan(i)
        };
      }),
      fxTrack: fx ? c.constancia : th.segBg,
      fxKnob: fx ? 20 : 0,
      sndTrack: this.sndOn() ? c.constancia : th.segBg,
      sndKnob: this.sndOn() ? 20 : 0,
      resetLabel: st.resetArmed ? 'Toca otra vez para borrar todo' : 'Reiniciar progreso',
      resetWeight: st.resetArmed ? 600 : 400,

      tabC: tabC, tabW: tabW, tabGo: tabGo, tabCur: tabCur,

      openMenu: () => { this.sfx('open'); this.go({ menu: true, screen: 'inicio' }); },
      closeMenu: () => this.go({ menu: false }),
      goAjustes: () => { this.sfx('tap'); this.go({ tab: 'ajustes', menu: false, screen: 'inicio' }); },
      goLogros: () => { this.sfx('tap'); this.go({ tab: 'logros', menu: false, screen: 'inicio' }); },
      startSession: () => this.startSession(),
      discardSession: () => this.discardSession(),
      sesClose: () => { this.sfx('tap'); this.go({ screen: 'inicio' }); },
      sesNext: () => this.sesNext(),
      sesPrev: () => this.sesPrev(),
      restAdd: () => this.restAdd(),
      restSkip: () => this.restSkip(),
      openConfirm: () => { this.sfx('open'); this.go({ screen: 'confirmar', menu: false }); },
      closeConfirm: () => this.go({ screen: 'inicio' }),
      answerYes: () => this.answerYes(),
      answerNo: () => this.answerNo(),
      quizBack: () => {
        this.sfx('tap');
        const q = st.quiz;
        if (q.step === 1 && q.fromSession) { this.go({ screen: 'sesion' }); return; }
        if (q.step > 0) this.setState({ quiz: Object.assign({}, q, { step: q.step - 1 }) });
        else this.go({ screen: 'confirmar' });
      },
      quizSkip: () => this.finish({ minutes: rc.minutes, intensity: 'moderada', series: 1 }),
      pesoMenos: () => this.setPeso(-1),
      pesoMas: () => this.setPeso(1),
      metaMenos: () => this.setMeta(-1),
      metaMas: () => this.setMeta(1),
      setNombre: (e) => this.setPref('nombre', (e && e.target ? e.target.value : '').slice(0, 24)),
      toggleFx: () => { this.sfx('tap'); this.setPref('efectos', !fx); },
      toggleSnd: () => {
        const on = !this.sndOn();
        this.setPref('sonido', on);
        if (on) setTimeout(() => this.sfx('yes'), 30);
      },
      resetAll: () => this.resetAll(),
      showSummary: () => { if (entry && entry.summary) this.go({ last: entry.summary, screen: 'victoria' }, () => this.startAnim()); },
      goHome: () => { this.sfx('tap'); this.go({ screen: 'inicio', tab: 'inicio' }); }
    };
  }
}

</script>
<script>

(function () {
  'use strict';
  var PROPS = { pantalla: 'inicio', datosEjemplo: false, peso: 70, acento: 'grafito' };
  var appEl = document.getElementById('app');
  var tplRoot = document.getElementById('tpl').content;
  var handlers = [];
  var pending = false;
  var comp = null;
  var VOID = { area: 1, base: 1, br: 1, col: 1, embed: 1, hr: 1, img: 1, input: 1, link: 1, meta: 1, source: 1, track: 1, wbr: 1 };

  window.__dc.schedule = function () { schedule(); };

  function schedule() {
    if (pending) return;
    pending = true;
    requestAnimationFrame(render);
  }

  function lookup(scope, path) {
    path = path.trim();
    if (path === 'true') return true;
    if (path === 'false') return false;
    if (/^-?\d/.test(path)) return Number(path);
    var parts = path.split('.');
    var v = scope;
    for (var i = 0; i < parts.length; i++) { if (v == null) return undefined; v = v[parts[i]]; }
    return v;
  }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function escA(s) { return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;'); }
  var HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
  function interp(str, scope) {
    return str.replace(HOLE, function (m, p) { var v = lookup(scope, p); return v == null ? '' : String(v); });
  }
  function hole(str) { var m = /^\s*\{\{\s*([^}]+?)\s*\}\}\s*$/.exec(str); return m ? m[1] : null; }

  function build(node, scope) {
    var out = '';
    var kids = node.childNodes;
    for (var i = 0; i < kids.length; i++) {
      var ch = kids[i];
      if (ch.nodeType === 3) { out += esc(interp(ch.textContent, scope)); continue; }
      if (ch.nodeType !== 1) continue;
      var tag = ch.localName;
      if (tag === 'sc-if') { if (lookup(scope, hole(ch.getAttribute('value')))) out += build(ch, scope); continue; }
      if (tag === 'sc-for') {
        var list = lookup(scope, hole(ch.getAttribute('list'))) || [];
        var as = ch.getAttribute('as');
        for (var j = 0; j < list.length; j++) { var s2 = Object.create(scope); s2[as] = list[j]; s2.$index = j; out += build(ch, s2); }
        continue;
      }
      var attrs = '';
      for (var a = 0; a < ch.attributes.length; a++) {
        var at = ch.attributes[a];
        var name = at.name;
        if (name.indexOf('hint-') === 0) continue;
        if (name === 'onclick' || name === 'onchange') {
          var fn = lookup(scope, hole(at.value));
          if (typeof fn === 'function') { handlers.push(fn); attrs += ' data-h' + (name === 'onclick' ? 'c' : 'i') + '="' + (handlers.length - 1) + '"'; }
          continue;
        }
        var raw = at.value;
        var val = interp(raw, scope);
        if (val === '' && raw !== '') continue;
        attrs += ' ' + name + '="' + escA(val) + '"';
      }
      out += '<' + tag + attrs + '>';
      if (!VOID[tag]) out += build(ch, scope) + '</' + tag + '>';
    }
    return out;
  }

  function render() {
    pending = false;
    handlers = [];
    var vals = comp.renderVals();
    var html = build(tplRoot, vals);
    morphdom(appEl, '<div id="app">' + html + '</div>', {
      onBeforeElUpdated: function (from, to) {
        if (from.isEqualNode(to)) return false;
        if (from === document.activeElement && from.tagName === 'INPUT') to.value = from.value;
        return true;
      }
    });
    if (vals.th) {
      document.documentElement.style.background = vals.th.bg;
      document.body.style.background = vals.th.bg;
      var tc = document.querySelector('meta[name="theme-color"]');
      if (tc) tc.setAttribute('content', vals.th.bg);
    }
    if (comp.componentDidUpdate) comp.componentDidUpdate();
    var run = window.__dc.cbs; window.__dc.cbs = [];
    run.forEach(function (f) { try { f(); } catch (e) { console.error(e); } });
  }

  appEl.addEventListener('click', function (e) {
    var el = e.target.closest('[data-hc]');
    if (!el || !appEl.contains(el)) return;
    var fn = handlers[+el.getAttribute('data-hc')];
    if (fn) fn(e);
  });
  appEl.addEventListener('change', function (e) {
    var el = e.target.closest('[data-hi]');
    if (!el || el.type !== 'file') return;
    var fn = handlers[+el.getAttribute('data-hi')];
    if (fn) fn(e);
  });
  appEl.addEventListener('input', function (e) {
    var el = e.target.closest('[data-hi]');
    if (el && el.type === 'file') return;
    if (!el) return;
    var fn = handlers[+el.getAttribute('data-hi')];
    if (fn) fn(e);
  });

  // iOS (web app instalada con barra de estado translúcida) resta la barra de estado a 100% y 100vh,
  // lo que deja una franja vacía abajo. Se usa la altura real de la pantalla.
  function fitHeight() {
    var h = window.innerHeight;
    if (window.navigator.standalone) {
      var portrait = window.matchMedia('(orientation: portrait)').matches;
      var sh = portrait ? Math.max(screen.width, screen.height) : Math.min(screen.width, screen.height);
      if (sh > h) h = sh;
    }
    document.documentElement.style.setProperty('--app-h', h + 'px');
  }
  fitHeight();
  window.addEventListener('resize', fitHeight);
  window.addEventListener('orientationchange', function () { setTimeout(fitHeight, 300); });

  comp = new Component();
  comp.props = PROPS;
  render();
  if (comp.componentDidMount) comp.componentDidMount();
  try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', schedule); } catch (e) {}
  document.addEventListener('visibilitychange', function () { if (!document.hidden) schedule(); });

  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
})();

</script>
