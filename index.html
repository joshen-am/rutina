<sc-if value="{{ cap.count }}" hint-placeholder-val="{{ false }}"><span style="font-size: 16px; color: rgba(250, 250, 250, 0.8)">Ponte en posición…</span></sc-if>
<sc-if value="{{ cap.review }}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{ cap.retake }}"  style="appearance: none; border: 0; margin: 0; padding: 0; font: inherit; cursor: pointer; height: 52px; padding: 0 24px; border-radius: 999px; background: rgba(255, 255, 255, 0.1); color: #FAFAFA; font-size: 16px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 8px; flex: 1">Repetir</button><button type="button" onClick="{{ cap.next }}"  style="appearance: none; border: 0; margin: 0; padding: 0; font: inherit; cursor: pointer; height: 52px; padding: 0 24px; border-radius: 999px; background: #FAFAFA; color: #09090B; font-size: 16px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 8px; flex: 1">{{ cap.nextLabel }}</button></sc-if>
<sc-if value="{{ cap.noCam }}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{ cap.skip }}" style="appearance: none; border: 0; margin: 0; padding: 0; font: inherit; cursor: pointer; height: 44px; padding: 0 16px; background: transparent; color: rgba(250, 250, 250, 0.72); font-size: 16px">Saltar esta pose</button></sc-if>
</div>
</div>
</sc-if>

<sc-if value="{{ hv.measOpen }}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; inset: 0; z-index: 30">
<button type="button" aria-label="Cerrar" onClick="{{ hv.closeMeas }}" style="position: absolute; inset: 0; width: 100%; height: 100%; border: 0; margin: 0; padding: 0; background: {{ th.scrim }}; cursor: default; animation: fade 0.25s ease-out both"></button>
<div role="dialog" aria-modal="true" aria-label="Registrar medición" class="scroll" style="position: absolute; left: 0; right: 0; bottom: 0; max-height: 88%; overflow-y: auto; box-sizing: border-box; background: {{ th.menu }}; border-radius: 28px 28px 0 0; padding: 12px 16px calc(env(safe-area-inset-bottom) + 12px); display: flex; flex-direction: column; gap: 12px; animation: sheet 0.42s cubic-bezier(.32,.72,0,1) both">
<span aria-hidden="true" style="align-self: center; width: 36px; height: 5px; border-radius: 3px; background: {{ th.fill }}; margin-bottom: 4px"></span>

<div style="display: flex; flex-direction: column; gap: 8px; padding: 0 4px"><span style="font-size: 13px; line-height: 20px; color: {{ th.sub }}; color: {{ th.sub }}">Hoy</span><h2 style="margin: 0; font-size: 28px; line-height: 32px; font-weight: 500; letter-spacing: -0.04em">Registrar medición</h2></div>
<section style="background: {{ th.card }}; box-shadow: {{ th.cardShadow }}; border-radius: 24px; padding: 0 0 0 16px">
<sc-for list="{{ hv.mrows }}" as="mr" hint-placeholder-count="5">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 60px; padding-right: 12px; border-top: 0.5px solid {{ th.sep }}">
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px">{{ mr.label }}</span><span style="font-family: {{ mono }}; font-size: 13px; color: {{ th.tertiary }}">{{ mr.unit }}</span></span>
<div style="display: flex; align-items: center; gap: 12px"><span style="font-family: {{ mono }}; font-size: 16px; font-variant-numeric: tabular-nums; white-space: nowrap">{{ mr.val }}</span><button type="button" onClick="{{ mr.minus }}" aria-label="Bajar" style="appearance: none; border: 0; margin: 0; padding: 0; font: inherit; cursor: pointer; padding: 0; width: 44px; height: 44px; flex: none; border-radius: 50%; background: {{ th.fill }}; color: {{ th.text }}; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button><button type="button" onClick="{{ mr.plus }}" aria-label="Subir" style="appearance: none; border: 0; margin: 0; padding: 0; font: inherit; cursor: pointer; padding: 0; width: 44px; height: 44px; flex: none; border-radius: 50%; background: {{ th.fill }}; color: {{ th.text }}; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button></div>
</div>
</sc-for>
</section>
<p style="margin: 0; padding: 0 4px; font-size: 13px; line-height: 20px; color: {{ th.sub }}">Mide el pulso y la presión sentado, tranquilo, después de 5 minutos de reposo. Lo que dejes en «—» no se guarda.</p>
<button type="button" onClick="{{ hv.saveMeas }}"  style="appearance: none; border: 0; margin: 0; padding: 0; font: inherit; cursor: pointer; height: 52px; padding: 0 24px; border-radius: 999px; background: {{ th.inv }}; color: {{ th.onInv }}; font-size: 16px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 8px; ">Guardar</button>
</div>
</div>
</sc-if>

<sc-if value="{{ isEval }}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; inset: 0; background: #0B0B0C; box-shadow: inset 0 0 0 1px {{ th.line }}; color: #FAFAFA; display: flex; flex-direction: column; animation: present 0.5s cubic-bezier(.32,.72,0,1) both; z-index: 25; overflow: hidden">
<span aria-hidden="true" class="halo" style="position: absolute; inset: 0; pointer-events: none; background: {{ haloEval }}; transition: background 0.6s"></span>
<div style="position: relative; padding: calc(env(safe-area-inset-top) + 32px) 16px 0; display: flex; align-items: center; gap: 12px">
<button type="button" onClick="{{ ev.close }}" aria-label="Cerrar evaluación" style="appearance: none; border: 0; margin: 0; padding: 0; font: inherit; cursor: pointer; width: 44px; height: 44px; flex: none; border-radius: 50%; background: rgba(255, 255, 255, 0.1); color: #FAFAFA; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
<div style="flex: 1; height: 3px; border-radius: 2px; background: rgba(255, 255, 255, 0.14); overflow: hidden"><div style="height: 100%; width: 100%; transform-origin: left center; transform: scaleX(calc({{ ev.pct }} / 100)); background: #FAFAFA; border-radius: 2px; transition: transform 0.4s cubic-bezier(.32,.72,0,1)"></div></div>
<span style="font-family: {{ mono }}; font-size: 13px; color: rgba(250, 250, 250, 0.62); font-variant-numeric: tabular-nums;">{{ ev.step }}/{{ ev.total }}</span>
</div>
<div class="push scroll" style="position: relative; flex: 1; overflow-y: auto; padding: 40px 20px 20px; display: flex; flex-direction: column; gap: 12px">
<span style="font-family: {{ mono }}; font-size: 13px; color: rgba(250, 250, 250, 0.62)">{{ ev.secNum }} / {{ ev.secTotal }} · {{ ev.sec }}</span>
<h1 style="margin: 0; font-size: 28px; line-height: 32px; font-weight: 400; letter-spacing: -0.04em">{{ ev.q }}</h1>
<sc-if value="{{ ev.hasHint }}" hint-placeholder-val="{{ true }}"><p style="margin: 0; font-size: 16px; line-height: 24px; color: rgba(250, 250, 250, 0.68)">{{ ev.hint }}</p></sc-if>
<div style="height: 10px"></div>
<sc-if value="{{ ev.isChoice }}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{ ev.opts }}" as="o" hint-placeholder-count="4">
<button type="button" onClick="{{ o.pick }}" aria-pressed="{{ o.sel }}" style="appearance: none; border: 0; margin: 0; padding: 0; font: inherit; cursor: pointer; min-height: 56px; padding: 0 20px; border-radius: 999px; background: {{ o.bg }}; color: {{ o.fg }}; font-size: 16px; text-align: left; display: flex; align-items: center; justify-content: space-between; transition: background 0.15s">{{ o.label }}<sc-if value="{{ o.sel }}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.0" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if></button>
</sc-for>
</div>
</sc-if>
<sc-if value="{{ ev.isScale }}" hint-placeholder-val="{{ false }}">
<div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{ ev.opts }}" as="o" hint-placeholder-count="5">
<button type="button" onClick="{{ o.pick }}" aria-pressed="{{ o.sel }}" style="appearance: none; border: 0; margin: 0; padding: 0; font: inherit; cursor: pointer; height: 64px; border-radius: 16px; background: {{ o.bg }}; color: {{ o.fg }}; font-family: {{ mono }}; font-size: 20px">{{ o.label }}</button>
</sc-for>
</div>
<div style="display: flex; justify-content: space-between; font-family: {{ mono }}; font-size: 13px; color: rgba(250, 250, 250, 0.62)"><span>{{ ev.lo }}</span><span>{{ ev.hi }}</span></div>
</sc-if>
<sc-if value="{{ ev.isNum }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 0">
<button type="button" onClick="{{ ev.minus }}" aria-label="Menos" style="appearance: none; border: 0; margin: 0; padding: 0; font: inherit; cursor: pointer; width: 56px; height: 56px; border-radius: 50%; background: rgba(255, 255, 255, 0.1); color: #FAFAFA; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
<span style="display: flex; align-items: baseline; gap: 8px"><span style="font-size: 72px; line-height: 72px; font-weight: 300; letter-spacing: -0.06em; font-variant-numeric: tabular-nums;">{{ ev.num }}</span><span style="font-family: {{ mono }}; font-size: 16px; color: rgba(250, 250, 250, 0.62)">{{ ev.unit }}</span></span>
<button type="button" onClick="{{ ev.plus }}" aria-label="Más" style="appearance: none; border: 0; margin: 0; padding: 0; font: inherit; cursor: pointer; width: 56px; height: 56px; border-radius: 50%; background: rgba(255, 255, 255, 0.1); color: #FAFAFA; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
</div>
<div style="display: flex; justify-content: center; gap: 8px">
<button type="button" class="hit" onClick="{{ ev.minus5 }}" style="appearance: none; border: 0; margin: 0; padding: 0; font: inherit; cursor: pointer; height: 36px; padding: 0 16px; border-radius: 999px; background: rgba(255, 255, 255, 0.08); color: #FAFAFA; font-family: {{ mono }}; font-size: 13px">−5</button>
<button type="button" class="hit" onClick="{{ ev.plus5 }}" style="appearance: none; border: 0; margin: 0; padding: 0; font: inherit; cursor: pointer; height: 36px; padding: 0 16px; border-radius: 999px; background: rgba(255, 255, 255, 0.08); color: #FAFAFA; font-family: {{ mono }}; font-size: 13px">+5</button>
</div>
</sc-if>
</div>
<div style="position: relative; padding: 12px 20px calc(env(safe-area-inset-bottom) + 12px); display: flex; align-items: center; gap: 12px">
<button type="button" onClick="{{ ev.back }}" aria-label="Pregunta anterior" style="appearance: none; border: 0; margin: 0; padding: 0; font: inherit; cursor: pointer; width: 52px; height: 52px; flex: none; border-radius: 50%; background: rgba(255, 255, 255, 0.1); color: #FAFAFA; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
<sc-if value="{{ ev.optional }}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{ ev.skip }}" style="appearance: none; border: 0; margin: 0; padding: 0; font: inherit; cursor: pointer; height: 52px; padding: 0 20px; border-radius: 999px; background: transparent; color: rgba(250, 250, 250, 0.72); font-size: 16px">No lo sé</button></sc-if>
<button type="button" onClick="{{ ev.next }}" style="appearance: none; border: 0; margin: 0; padding: 0; font: inherit; cursor: pointer; flex: 1; height: 52px; border-radius: 999px; background: #FAFAFA; color: #09090B; font-size: 16px; font-weight: 500; opacity: {{ ev.nextOp }}">Continuar</button>
</div>
</div>
</sc-if>

<sc-if value="{{ isSesion }}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; inset: 0; background: {{ th.bg }}; display: flex; flex-direction: column; animation: present 0.5s cubic-bezier(.32,.72,0,1) both; z-index: 20">
<div style="padding: calc(env(safe-area-inset-top) + 32px) 12px 0; display: grid; grid-template-columns: 96px minmax(0, 1fr) 96px; align-items: center">
<button type="button" class="hit" onClick="{{ sesClose }}" style="appearance: none; border: 0; margin: 0; padding: 0; font: inherit; cursor: pointer; justify-self: start; height: 38px; padding: 0 16px 0 12px; border-radius: 999px; display: flex; align-items: center; gap: 4px; background: {{ th.card }}; color: {{ th.text }}; font-size: 16px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 9l7 7 7-7"></path></svg>Salir</button>
<div style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; text-align: center">
<span style="max-width: 100%; font-size: 16px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ ss.title }}</span>
<span style="font-family: {{ mono }}; font-size: 13px; color: {{ th.sub }}; font-variant-numeric: tabular-nums;">Ejercicio {{ ss.num }} de {{ ss.total }}</span>
</div>
<span aria-label="Tiempo de sesión" style="justify-self: end; padding-right: 8px; font-family: {{ mono }}; font-size: 16px; font-variant-numeric: tabular-nums;">{{ ss.elapsed }}</span>
</div>
<div aria-hidden="true" style="margin: 12px 16px 0; height: 3px; border-radius: 2px; background: {{ th.fill }}; overflow: hidden"><div style="height: 100%; width: 100%; transform-origin: left center; transform: scaleX(calc({{ ss.pct }} / 100)); border-radius: 2px; background: {{ c.accent }}; transition: transform 0.4s cubic-bezier(.32,.72,0,1)"></div></div>
<div style="position: relative; flex: 1; min-height: 0">
<div id="paso-{{ ss.num }}" class="push scroll" style="position: absolute; inset: 0; overflow-y: auto; box-sizing: border-box; padding: 16px 16px 32px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 0 4px">
<span style="font-family: {{ mono }}; font-size: 13px; color: {{ ss.phaseColor }}">{{ ss.phase }}</span>
<span style="font-family: {{ mono }}; font-size: 13px; color: {{ th.sub }}">{{ ss.round }}</span>
</div>

<sc-if value="{{ ss.hasPages }}" hint-placeholder-val="{{ true }}">
<section aria-label="Cómo hacerlo" style="position: relative; overflow: hidden; background: #0B0B0C; box-shadow: inset 0 0 0 1px {{ th.line }}; color: #FAFAFA; border-radius: 24px; padding: 12px 12px 16px; display: flex; flex-direction: column; gap: 12px">
<span aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none; background: {{ halo }}"></span>
<div role="img" aria-label="{{ ss.pgAlt }}" onClick="{{ ss.pgTap }}" style="position: relative; width: 100%; aspect-ratio: 354 / 300; cursor: {{ ss.pgCursor }}">
<sc-for list="{{ ss.pages }}" as="pg" hint-placeholder-count="1">
<div aria-hidden="true" class="pg" data-on="{{ pg.on }}" style="position: absolute; inset: 0; display: flex; overflow: hidden; opacity: {{ pg.op }}; transition: {{ ss.pgFade }}">
<sc-for list="{{ pg.figs }}" as="fg" hint-placeholder-count="1"><img src="{{ fg.src }}" alt="" style="flex: 1 1 0; min-width: 0; height: 100%; object-fit: contain"></sc-for>
</div>
</sc-for>
<sc-if value="{{ ss.hasView }}" hint-placeholder-val="{{ false }}"><span style="position: absolute; right: 8px; top: 4px; font-family: {{ mono }}; font-size: 13px; line-height: 20px; color: rgba(250, 250, 250, 0.62)">{{ ss.view }}</span></sc-if>
</div>
<div style="position: relative; display: flex; flex-direction: column; gap: 8px; padding: 0 8px">
<sc-if value="{{ ss.multiPg }}" hint-placeholder-val="{{ true }}"><span aria-live="polite" style="font-family: {{ mono }}; font-size: 13px; line-height: 20px; color: rgba(250, 250, 250, 0.62)">Paso {{ ss.pgN }} de {{ ss.pgCount }}</span></sc-if>
<sc-for list="{{ ss.pgLines }}" as="ln" hint-placeholder-count="1"><p style="margin: 0; font-size: {{ ss.pgSize }}px; line-height: {{ ss.pgLh }}px; font-weight: 400; letter-spacing: -0.03em">{{ ln.text }}</p></sc-for>
</div>
<sc-if value="{{ ss.multiPg }}" hint-placeholder-val="{{ true }}">
<div style="position: relative; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-left: 8px">
<div aria-hidden="true" style="display: flex; align-items: center; gap: 6px">
<sc-for list="{{ ss.pgDots }}" as="dt" hint-placeholder-count="3"><span style="width: {{ dt.w }}px; height: 6px; border-radius: 3px; background: {{ dt.bg }}; transition: {{ ss.pgDotFx }}"></span></sc-for>
</div>
<div style="display: flex; gap: 8px">
<button type="button" onClick="{{ ss.pgPrev }}" aria-label="Dibujo anterior" aria-disabled="{{ ss.pgFirst }}" style="appearance: none; border: 0; margin: 0; padding: 0; font: inherit; cursor: pointer; width: 48px; height: 48px; border-radius: 999px; background: rgba(255, 255, 255, 0.08); color: #FAFAFA; opacity: {{ ss.prevOp }}; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></button>
<button type="button" onClick="{{ ss.pgNext }}" aria-label="{{ ss.pgNextLabel }}" style="appearance: none; border: 0; margin: 0; padding: 0; font: inherit; cursor: pointer; width: 48px; height: 48px; border-radius: 999px; background: rgba(255, 255, 255, 0.2); color: #FAFAFA; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
</div>
</div>
</sc-if>
</section>
</sc-if>

<sc-if value="{{ ss.isRestStep }}" hint-placeholder-val="{{ false }}">
<div style="position: relative; overflow: hidden; background: #0B0B0C; color: #FAFAFA; border-radius: 24px; padding: 30px 20px 24px; display: flex; flex-direction: column; align-items: center; gap: 20px">
<span aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none; background: {{ halo }}"></span>
<span style="position: relative; font-size: 72px; line-height: 72px; font-weight: 300; letter-spacing: -0.06em; font-variant-numeric: tabular-nums">{{ ss.restLeft }}</span>
<div style="position: relative; width: 100%; height: 3px; border-radius: 2px; background: rgba(255, 255, 255, 0.16); overflow: hidden"><div style="height: 100%; border-radius: 2px; width: {{ ss.restPct }}%; background: #FAFAFA"></div></div>
<div style="position: relative; display: flex; gap: 12px">
<button type="button" onClick="{{ restAdd }}" style="appearance: none; border: 0; margin: 0; font: inherit; cursor: pointer; height: 44px; padding: 0 20px; border-radius: 999px; background: rgba(255, 255, 255, 0.12); color: #FAFAFA; font-size: 16px; font-weight: 500">+15 s</button>
<button type="button" onClick="{{ sesNext }}" style="appearance: none; border: 0; margin: 0; font: inherit; cursor: pointer; height: 44px; padding: 0 20px; border-radius: 999px; background: #FAFAFA; color: #09090B; font-size: 16px; font-weight: 500">Saltar descanso</button>
</div>
</div>
</sc-if>

<div style="display: flex; flex-direction: column; gap: 8px; padding: 0 4px">
<h1 style="margin: 0; font-size: 28px; line-height: 32px; font-weight: 500; letter-spacing: -0.04em">{{ ss.name }}</h1>
<div style="display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px">
<span style="font-family: {{ mono }}; font-size: 20px; font-variant-numeric: tabular-nums">{{ ss.dose }}</span>
<sc-if value="{{ ss.hasRest }}" hint-placeholder-val="{{ true }}"><span style="font-size: 16px; color: {{ th.sub }}">descanso {{ ss.restLabel }} entre series</span></sc-if>
</div>
<sc-if value="{{ ss.hasWorks }}" hint-placeholder-val="{{ true }}"><p style="margin: 2px 0 0; font-size: 16px; line-height: 24px; color: {{ th.sub }}">{{ ss.works }}</p></sc-if>
</div>

<sc-if value="{{ ss.hasSets }}" hint-placeholder-val="{{ true }}">
<section aria-label="Series" style="background: {{ th.card }}; border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px">
<span style="font-size: 16px; font-weight: 500">Series</span>
<span style="font-family: {{ mono }}; font-size: 13px; color: {{ th.sub }}; font-variant-numeric: tabular-nums">{{ ss.setsDone }}/{{ ss.sets }}</span>
</div>
<sc-if value="{{ ss.hasReps }}" hint-placeholder-val="{{ true }}">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px">{{ ss.repLabel }}</span><sc-if value="{{ ss.hasEach }}" hint-placeholder-val="{{ false }}"><span style="font-size: 13px; color: {{ th.sub }}">{{ ss.repEach }}</span></sc-if></span>
<div style="display: flex; align-items: center; gap: 8px">
<button type="button" onClick="{{ ss.repMinus }}" aria-label="Menos" style="appearance: none; border: 0; margin: 0; padding: 0; font: inherit; cursor: pointer; width: 44px; height: 44px; flex: none; border-radius: 50%; background: {{ th.fill }}; color: {{ th.text }}; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
<span aria-live="polite" style="min-width: 48px; text-align: center; font-family: {{ mono }}; font-size: 28px; line-height: 32px; font-variant-numeric: tabular-nums">{{ ss.repVal }}</span>
<button type="button" onClick="{{ ss.repPlus }}" aria-label="Más" style="appearance: none; border: 0; margin: 0; padding: 0; font: inherit; cursor: pointer; width: 44px; height: 44px; flex: none; border-radius: 50%; background: {{ th.fill }}; color: {{ th.text }}; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
</div>
</div>

<script>

window.__dc = { cbs: [], schedule: function () {} };
window.DCLogic = class {
  constructor() { this.props = {}; this.state = {}; }
  setState(patch, cb) {
    var p = typeof patch === 'function' ? patch(this.state, this.props) : patch;
    this.state = Object.assign({}, this.state, p);
    if (cb) window.__dc.cbs.push(cb);
    window.__dc.schedule();
  }
  forceUpdate(cb) { if (cb) window.__dc.cbs.push(cb); window.__dc.schedule(); }
};

</script>
<script>
class Component extends DCLogic {
  state = {
    screen: null,
    tab: null,
    menu: null,
    sel: null,
    log: {},
    last: null,
    peso: null,
    quiz: { step: 0, minutes: null, intensity: null, series: null },
    t: 1,
    prefs: { tema: 'auto', nombre: 'Joshen', meta: 5, efectos: true, sonido: true, homeOrder: ['diario', 'salud', 'hoy', 'rutina', 'fotos', 'recup', 'semanal', 'progreso'], homeHidden: {}, lastBackup: 0, backupSnooze: 0, histMode: 'habitos', v3: true, v4: true, v5: true, goal: 'general' },
    plan: { 0: 'superiorA', 1: 'piernasA', 2: 'cardio', 3: 'superiorB', 4: 'piernasB', 5: 'caminata' },
    resetArmed: false,
    noDemo: false,
    sess: null,
    tick: 0,
    since: null,
    editHome: false,
    persisted: false,
    backupMsg: '',
    hlog: {},
    hday: 0,
    habEdit: false,
    pushMsg: '',
    showCode: false,
    flog: {},
    fday: 0,
    fsheet: null,
    fdraft: null,
    fentry: null,
    frev: null,
    hp: null,
    meas: [],
    mood: {},
    ev: null,
    area: null,
    msheet: null,
    aiShow: false,
    xlog: {},
    hpHist: [],
    prog: false,
    recAdv: false,
    daily: {},
    bodyPhotos: [],
    adapt: {},
    chat: [],
    cap: null,
    photos: false,
    aspecto: false,
    chatOpen: false,
    dayScores: {}
  };

  /* ---------- ciclo de vida y guardado ---------- */

  componentDidMount() {
    let loaded = false;
    let localAt = 0;
    try {
      const raw = window.localStorage.getItem('tracker-rutinas-v3');
      if (raw) {
        const s = JSON.parse(raw);
        this.setState(this.applyData(s));
        localAt = s.savedAt || 1;
        loaded = true;
      }
    } catch (e) {}
    if (!loaded && this.props.datosEjemplo === true) this.setState(this.seedDemo());
    if (!this.state.since) {
      const keys = Object.keys(this.state.log).sort();
      this.setState({ since: keys[0] || this.keyOf(new Date()) }, () => this.persist());
    }
    // Segunda copia en IndexedDB: si localStorage se perdió o quedó atrás, se recupera desde ahí.
    this.idbGet().then((d) => {
      if (d && d.savedAt && d.savedAt > localAt) this.setState(this.applyData(d), () => this.persist());
      else if (loaded) this.idbPut(this.snapshot());
    }).catch(() => {});
    try {
      if (navigator.storage && navigator.storage.persist) {
        navigator.storage.persisted().then((p) => (p ? p : navigator.storage.persist())).then((p) => this.setState({ persisted: !!p })).catch(() => {});
      }
    } catch (e) {}
    // guarda el puntaje de los días que ya terminaron, al abrir y al volver a la app (iPhone la deja abierta días)
    setTimeout(() => this.closeDays(), 1200);
    this._onVis = () => { if (!document.hidden) this.closeDays(); };
    document.addEventListener('visibilitychange', this._onVis);
    this.warmAudio();
    this.syncTicker();
    if (this.isNative()) setTimeout(() => this.nativeSchedule(), 1500);
  }

  applyData(s) {
    const next = {};
    ['log', 'peso', 'plan', 'noDemo', 'sess', 'since', 'hlog', 'flog', 'frev', 'hp', 'meas', 'mood', 'xlog', 'hpHist', 'daily', 'bodyPhotos', 'adapt', 'chat', 'dayScores'].forEach((k) => {
      if (s[k] !== undefined && s[k] !== null) next[k] = s[k];
    });
    if (s.prefs) {
      next.prefs = Object.assign({}, this.state.prefs, s.prefs);
      // Inicio desde la versión 27: más corto (hoy, rutina, recuperación, semana y progreso)
      // desde la versión 28 se suman el check-in diario (arriba) y la foto semanal (después de la rutina)
      const known = ['diario', 'salud', 'hoy', 'rutina', 'fotos', 'recup', 'semanal', 'progreso'];
      let ord = (next.prefs.homeOrder || []).filter((k) => known.indexOf(k) >= 0);
      if (!s.prefs.v4) { ord = known.slice(); next.prefs.homeHidden = {}; }
      if (!s.prefs.v5) {
        if (ord.indexOf('diario') < 0) ord.unshift('diario');
        if (ord.indexOf('fotos') < 0) { const r = ord.indexOf('rutina'); ord.splice(r >= 0 ? r + 1 : ord.length, 0, 'fotos'); }
      }
      known.forEach((k) => { if (ord.indexOf(k) < 0) ord.push(k); });
      next.prefs.homeOrder = ord;
      next.prefs.v3 = true;
      next.prefs.v4 = true;
      next.prefs.v5 = true;
      ['clase', 'acento', 'fuente', 'marca'].forEach((k) => { delete next.prefs[k]; });
    }
    return next;
  }

  snapshot() {
    const s = this.state;
    return {
      schema: 4, savedAt: Date.now(),
      log: s.log, peso: s.peso, prefs: s.prefs, plan: s.plan, noDemo: s.noDemo, sess: s.sess, since: s.since,
      hlog: s.hlog, flog: s.flog, frev: s.frev, hp: s.hp, meas: s.meas, mood: s.mood, xlog: s.xlog, hpHist: s.hpHist, daily: s.daily, bodyPhotos: s.bodyPhotos, adapt: s.adapt, chat: s.chat, dayScores: s.dayScores, derived: this.derived()
    };
  }

  // Resumen que lee el service worker para personalizar las notificaciones
  derived() {
    try {
      const t = new Date();
      const key = this.keyOf(t);
      const d = (this.state.hlog || {})[key] || {};
      const r = this.routineAt(this.todayIdx());
      const names = {};
      for (let i = 0; i < 7; i++) { const rr = this.routineAt(i); if (rr) names[i + 1] = rr.name; }
      const lect = this.habitCatalog().find((h) => h.id === 'lectura');
      return {
        day: key, agua: d.agua || 0, aguaGoal: this.habitGoal({ id: 'agua' }, t), aguaBase: Math.max(8, Math.round((this.peso() * 30) / 250)),
        lectura: d.lectura || 0, lecturaGoal: this.habitGoal(lect, t),
        entreno: r && r.id !== 'caminata' ? r.name : null,
        entrenoHecho: !!(this.state.log[key] && this.state.log[key].status === 'done'), planNames: names
      };
    } catch (e) { return null; }
  }

  idbOpen() {
    if (this._idb) return this._idb;
    this._idb = new Promise((resolve, reject) => {
      try {
        const req = window.indexedDB.open('rutina', 1);
        req.onupgradeneeded = () => req.result.createObjectStore('kv');
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      } catch (e) { reject(e); }
    });
    return this._idb;
  }

  idbGet() {
    return this.idbOpen().then((db) => new Promise((resolve, reject) => {
      const r = db.transaction('kv', 'readonly').objectStore('kv').get('estado');
      r.onsuccess = () => resolve(r.result || null);
      r.onerror = () => reject(r.error);
    }));
  }

  idbPut(data) {
    return this.idbOpen().then((db) => new Promise((resolve) => {
      const tx = db.transaction('kv', 'readwrite');
      tx.objectStore('kv').put(data, 'estado');
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => resolve(false);
    })).catch(() => false);
  }

  exportBackup() {
    this.sfx('tap');
    const name = 'keystone-respaldo-' + this.keyOf(new Date()) + '.json';
    const json = JSON.stringify({ app: 'rutina', version: 1, exportedAt: new Date().toISOString(), data: this.backupData() });
    const done = () => { this.setPref('lastBackup', Date.now()); this.setState({ backupMsg: 'Respaldo guardado. Guárdalo en Archivos o iCloud Drive.' }); };
    try {
      const file = new File([json], name, { type: 'application/json' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file], title: 'Respaldo de keystone' }).then(done).catch(() => {});
        return;
      }
    } catch (e) {}
    try {
      const url = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
      const a = document.createElement('a');
      a.href = url; a.download = name; a.style.display = 'none';
      document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 2000);
      done();
    } catch (e) { this.setState({ backupMsg: 'No se pudo crear el respaldo en este navegador.' }); }
  }

  importBackup(e) {
    const input = e && e.target;
    const file = input && input.files && input.files[0];
    if (!file) return;
    file.text().then((txt) => {
      const j = JSON.parse(txt);
      if (!j || j.app !== 'rutina' || !j.data || !j.data.log) throw new Error('formato');
      this.setState(Object.assign(this.applyData(j.data), { last: null, screen: 'inicio' }), () => {
        this.persist();
        const n = Object.keys(this.state.log).filter((k) => this.state.log[k].status === 'done').length;
        this.setState({ backupMsg: 'Respaldo restaurado: ' + n + (n === 1 ? ' sesión.' : ' sesiones.') });
        this.sfx('yes');
      });
    }).catch(() => { this.setState({ backupMsg: 'Ese archivo no es un respaldo de keystone.' }); this.sfx('no'); });
    try { input.value = ''; } catch (err) {}
  }

  backupData() {
    const s = this.snapshot();
    s.prefs = Object.assign({}, s.prefs);
    delete s.prefs.ai;
    delete s.prefs.pushKeys;
    return s;
  }

  warmAudio() {

  tone(freq, start, dur, o) {

      osc.connect(g);
      g.connect(this.master);
      osc.start(t0);
      osc.stop(t0 + dur + 0.05);
    } catch (e) {}

  seg(t, a, b) {
    const x = Math.min(1, Math.max(0, (t - a) / (b - a)));

  }

  stepsFor(rid) { return this.adaptedSteps(rid); }

  syncTicker() {
    const on = this.nav().screen === 'sesion';
    if (on && !this.iv) this.iv = setInterval(() => this.onTick(), 100);
    if (!on && this.iv) { clearInterval(this.iv); this.iv = null; }
    this.syncWake(on);
  }

  /* Pantalla encendida mientras dura la sesión. iOS la suelta al salir de la app, así que se vuelve a pedir al volver. */
  syncWake(on) {
    try {
      if (!('wakeLock' in navigator)) return;
      if (!this.wakeVis) {
        this.wakeVis = () => { if (document.visibilityState === 'visible' && this.nav().screen === 'sesion') { this.wake = null; this.syncWake(true); } };
        document.addEventListener('visibilitychange', this.wakeVis);
      }
      if (on && !this.wake) {
        this.wake = 'pidiendo';
        navigator.wakeLock.request('screen').then((w) => { this.wake = w; w.addEventListener('release', () => { if (this.wake === w) this.wake = null; }); if (this.nav().screen !== 'sesion') { w.release(); } }).catch(() => { this.wake = null; });
      } else if (!on && this.wake && this.wake !== 'pidiendo') {
        const w = this.wake; this.wake = null; w.release().catch(() => {});
      }
    } catch (e) {}
  }

  onTick() {
    const s = this.state.sess;
    const patch = { tick: (this.state.tick + 1) % 100000 };
    if (s && s.restEnd) {
      const left = Math.ceil((s.restEnd - Date.now()) / 1000);
      this.beeped = this.beeped || {};
      if (left <= 3 && left > 0 && !this.beeped[left]) { this.beeped[left] = true; this.tone(880, 0, 0.07, { type: 'triangle', vol: 0.08 }); }
      if (left <= 0) {
        patch.sess = Object.assign({}, s, { restEnd: null });
        this.sfx('bell');
        try { if (navigator.vibrate) navigator.vibrate([60, 40, 60]); } catch (e) {}
      }
    }
    this.setState(patch);
  }

  startSession() {
    const si = this.selIdx();
    const r = this.routineAt(si);
    if (!r) return;
    const date = this.keyOf(this.week()[si]);
    const cur = this.state.sess;
    this.sfx('open');
    if (cur && cur.rid === r.id && cur.date === date) { this.go({ screen: 'sesion', menu: false }); return; }
    this.beeped = {};
    this.go({ screen: 'sesion', menu: false, tick: 0, sess: { rid: r.id, date: date, i: 0, sets: {}, start: Date.now(), restEnd: null, restTotal: 0 } }, () => this.enterStep(0));
  }

  enterStep(i) {
    const s = this.state.sess;
    if (!s) return;
    const p = this.stepsFor(s.rid)[i];
    const next = Object.assign({}, s, { i: i, restEnd: null, restTotal: 0 });
    if (p && p.auto) { next.restEnd = Date.now() + p.auto * 1000; next.restTotal = p.auto; }
    this.beeped = {};
    this.setState({ sess: next, tick: 0, pg: 0 }, () => this.persist());
  }

  sesNext() {
    const s = this.state.sess;
    if (!s) return;
    const n = this.stepsFor(s.rid).length;
    if (s.i < n - 1) { this.sfx('tap'); this.enterStep(s.i + 1); } else this.finishSession();
  }

  pgGo(k) {
    const s = this.state.sess;
    if (!s) return;
    const p = this.stepsFor(s.rid)[s.i];
    const n = (p && p.pages ? p.pages.length : 0);
    if (n < 2 || k < 0) return;
    this.sfx('tap');
    this.setState({ pg: k % n });
  }

  sesPrev() {
    const s = this.state.sess;
    if (!s || s.i === 0) return;
    this.sfx('tap');
    this.enterStep(s.i - 1);
  }

  markSet(k) {
    const s = this.state.sess;
    if (!s) return;
    const p = this.stepsFor(s.rid)[s.i];
    const done = s.sets[s.i] || 0;
    const sets = Object.assign({}, s.sets);
    const next = Object.assign({}, s, { sets: sets });
    const info = this.doseInfo(p);
    const reps = Object.assign({}, s.reps || {});
    const arr = (reps[s.i] || []).slice();
    if (k <= done) { sets[s.i] = k - 1; arr.length = Math.min(arr.length, k - 1); reps[s.i] = arr; next.reps = reps; next.restEnd = null; this.sfx('tap'); }
    else {
      sets[s.i] = k;
      if (info) {
        const v = this.repValue(p, s.i, Math.min(done, p.sets - 1), s);
        for (let j = done; j < k; j++) arr[j] = v;
        reps[s.i] = arr;
        next.reps = reps;
        const rv = Object.assign({}, s.rv || {});
        delete rv[s.i];
        next.rv = rv;
      }
      this.sfx('pick');
      if (k < p.sets && p.rest) { next.restEnd = Date.now() + p.rest * 1000; next.restTotal = p.rest; this.beeped = {}; }
      else next.restEnd = null;
      if (k >= p.sets) setTimeout(() => this.sfx('done'), 150);
    }
    this.setState({ sess: next }, () => this.persist());
  }

  restAdd() {
    const s = this.state.sess;
    if (!s || !s.restEnd) return;
    this.sfx('tap');
    this.setState({ sess: Object.assign({}, s, { restEnd: s.restEnd + 15000, restTotal: s.restTotal + 15 }) });
  }

  restSkip() {
    const s = this.state.sess;
    if (!s) return;
    this.sfx('tap');
    this.setState({ sess: Object.assign({}, s, { restEnd: null }) }, () => this.persist());
  }

  setTotals(s) {
    const steps = this.stepsFor(s.rid);
    let total = 0, done = 0;
    steps.forEach((p, i) => { if (p.sets) { total += p.sets; done += Math.min(p.sets, s.sets[i] || 0); } });
    return { total: total, done: done };
  }

  finishSession() {
    const s = this.state.sess;
    if (!s) return;
    this.sfx('yes');
    const minutes = Math.max(5, Math.round((Date.now() - s.start) / 60000));
    const tt = this.setTotals(s);
    let series = null;
    if (tt.total && tt.done) {
      const ratio = tt.done / tt.total;
      series = this.seriesOpts().reduce((best, o) => (Math.abs(o.v - ratio) < Math.abs(best - ratio) ? o.v : best), 1);
    }
    this.go({ screen: 'test', quiz: { step: 1, minutes: minutes, intensity: null, series: series, fromSession: true, setsDone: tt.done, setsTotal: tt.total } });
  }

  discardSession() {
    this.sfx('no');
    this.go({ sess: null }, () => this.persist());
  }

  fmtClock(sec) {
    sec = Math.max(0, Math.floor(sec));
    const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), x = sec % 60;
    const mm = h ? String(m).padStart(2, '0') : String(m);
    return (h ? h + ':' : '') + mm + ':' + String(x).padStart(2, '0');
  }

  sessionVals(s, th, c, dark, primary, onPrimary, fx) {
    const steps = this.stepsFor(s.rid);
    const R = this.routinesById()[s.rid] || { name: '' };
    const i = Math.max(0, Math.min(s.i, steps.length - 1));
    const p = steps[i] || { k: 'rest', how: [], pages: [], sets: 0, phase: '', name: '', dose: '' };
    const now = Date.now();
    // Dibujo paso a paso: cada página es una posición fija con su indicación
    const pages = p.pages || [];
    const pg = Math.max(0, Math.min(this.state.pg || 0, pages.length - 1));
    const cur = pages[pg] || { lines: [] };
    const big = pages.every((x) => x.lines.join(' ').length <= 110);
    const done = s.sets[i] || 0;
    const left = s.restEnd ? Math.max(0, Math.ceil((s.restEnd - now) / 1000)) : 0;
    const phaseColor = { 'Calentamiento': c.heatText, 'Ejercicios': c.fuerzaText, 'Cierre de postura': c.tecnicaText, 'Postura': c.tecnicaText, 'Cardio': c.resistenciaText, 'Core': c.constanciaText }[p.phase] || th.sub;
    const notes = [['Ojo', p.watch, c.fuerzaText], ['Más fácil', p.easier, c.constanciaText], ['Más difícil', p.harder, c.tecnicaText], ['Consejo', p.tip, c.resistenciaText]]
      .filter((x) => x[1]).map((x, j) => ({ label: x[0], text: x[1], color: x[2], line: j ? ('inset 0 0.5px 0 ' + th.sep) : 'none' }));
    const isRest = p.k === 'rest';
    const info = this.doseInfo(p);
    const last = info ? this.xLast(p.k, s.date) : null;
    const ready = info ? this.repReady(p, s.date) : false;
    const repsDone = (s.reps || {})[i] || [];
    return {
      title: R.name, num: i + 1, total: steps.length, pct: Math.round(((i + 1) / Math.max(1, steps.length)) * 1000) / 10,
      elapsed: this.fmtClock((now - s.start) / 1000),
      even: i % 2 === 0, odd: i % 2 === 1,
      phase: p.phase, phaseColor: phaseColor, round: p.round || '',
      hasPages: pages.length > 0, multiPg: pages.length > 1, pgN: pg + 1, pgCount: pages.length,
      pages: pages.map((x, k) => ({ op: k === pg ? 1 : 0, on: k === pg ? '1' : '0', figs: x.figs.map((src) => ({ src: src })) })),
      pgAlt: (pages.length > 1 ? 'Dibujo del paso ' + (pg + 1) + ': ' : 'Dibujo: ') + cur.lines.join(' '),
      pgLines: cur.lines.map((t) => ({ text: t })), pgSize: big ? 20 : 16, pgLh: big ? 28 : 24,
      pgDots: pages.map((x, k) => ({ w: k === pg ? 18 : 6, bg: k === pg ? '#FAFAFA' : 'rgba(250, 250, 250, 0.28)' })),
      pgFade: fx ? 'opacity 0.3s ease' : 'none', pgDotFx: fx ? 'width 0.25s ease, background 0.25s ease' : 'none',
      pgPrev: () => this.pgGo(pg - 1), pgNext: () => this.pgGo(pg + 1), pgTap: () => this.pgGo(pg + 1),
      pgFirst: pg === 0, prevOp: pg === 0 ? 0.38 : 1, pgCursor: pages.length > 1 ? 'pointer' : 'default',
      pgNextLabel: pg === pages.length - 1 ? 'Volver al primer dibujo' : 'Dibujo siguiente',
      hasView: !!p.view, view: p.view || '',
      isRestStep: isRest,
      name: p.name, dose: p.dose, hasRest: !!p.rest && !isRest, restLabel: p.rest ? (p.rest >= 60 && p.rest % 60 === 0 ? (p.rest / 60) + ' min' : p.rest + ' s') : '',
      hasWorks: !!p.works, works: p.works || '',
      hasSets: p.sets > 0, sets: p.sets, setsDone: Math.min(done, p.sets),
      hasReps: !!info && done < p.sets, repLabel: info && info.unit === 's' ? 'Segundos' : 'Repeticiones', repEach: info ? info.each : '', hasEach: !!(info && info.each),
      repVal: info ? this.repValue(p, i, Math.min(done, (p.sets || 1) - 1), s) : '', repMinus: () => this.repAdj(-1), repPlus: () => this.repAdj(1),
      hasLast: !!last, lastLine: last ? 'La última vez: ' + last.r.join(' · ') + (info && info.unit === 's' ? ' s' : '') : '',
      hasReady: ready, readyText: ready ? (p.harder ? 'Llegaste al tope del rango la última vez. Si te sentiste firme, sube de nivel: ' + p.harder : 'Llegaste al tope del rango la última vez. Si te sentiste firme, hazlo más lento o suma una serie.') : '',
      setBtns: Array.from({ length: p.sets || 0 }, (_, k) => ({
        n: k + 1, val: repsDone[k] != null ? String(repsDone[k]) : '', hasVal: k < done && repsDone[k] != null, noVal: k < done && repsDone[k] == null,
        aria: 'Serie ' + (k + 1) + (k < done ? ', hecha' + (repsDone[k] != null ? ' con ' + repsDone[k] : '') : ''), pressed: k < done, open: k >= done,
        bg: k < done ? primary : th.segBg, fg: k < done ? onPrimary : th.text,
        ring: k === done ? ('inset 0 0 0 2px ' + primary) : 'none',
        pick: () => this.markSet(k + 1)
      })),
      resting: !!s.restEnd && !isRest, restLeft: this.fmtClock(isRest && !s.restEnd ? 0 : left),
      restPct: s.restEnd && s.restTotal ? Math.round((left / s.restTotal) * 1000) / 10 : 0,
      hasSetHint: p.sets > 0 && (done === 0 || done >= p.sets),
      setHint: done >= p.sets ? 'Series completas. Toca Siguiente para continuar.' : (info ? 'Ajusta las repeticiones y toca la serie al terminarla: empieza el descanso.' : 'Toca cada serie al terminarla y empieza el descanso.'),
      hasHow: p.how && p.how.length > 0 && !pages.length,
      how: (p.how || []).map((h, j) => ({ n: j + 1, text: h, line: j ? ('inset 0 0.5px 0 ' + th.sep) : 'none' })),
      hasNotes: notes.length > 0, notes: notes,

    };
  }

  /* Horas para recuperarse tras una sesión dura (cerca del fallo), por grupo muscular.
     Grandes y multiarticulares ~72 h, medianos ~48 h, pequeños ~36 h. */
  recoveryHours() {
    return {
      'Espalda': 72, 'Cuádriceps': 72, 'Isquiotibiales': 72, 'Glúteos': 60,
      'Pecho': 48, 'Hombros': 48, 'Deltoides posterior': 48, 'Tríceps': 42,
      'Bíceps': 36, 'Antebrazos': 36, 'Gemelos': 36, 'Core': 36
    };
  }

  sessionTime(key, s) {
    return s && s.at ? s.at : this.dateOf(key).getTime() + 19 * 3600000;
  }

  // Fatiga de cada músculo en un instante: cada sesión suma fatiga según cuánto trabajó el músculo
  // y la intensidad, y se disipa con una curva suave en el tiempo de recuperación de ese músculo.
  fatigue(st) {
    const RH = this.recoveryHours();
    const TI = { suave: 0.75, moderada: 0.9, dura: 1, limite: 1.2 };
    const now = Date.now();
    const parts = {};
    Object.keys(st.log).forEach((key) => {
      const e = st.log[key];
      if (!e || e.status !== 'done' || !e.summary || !e.summary.muscles) return;
      const t0 = this.sessionTime(key, e.summary);
      const age = (now - t0) / 3600000;
      if (age < 0 || age > 200) return;
      const ti = TI[e.summary.intensityKey] || 0.9;
      e.summary.muscles.forEach((mu) => {
        const w = Math.min(1, mu.w);
        const T = (RH[mu.name] || 48) * ti * (0.6 + 0.4 * w);
        const F = Math.min(1, w * (0.55 + 0.45 * ti));
        (parts[mu.name] = parts[mu.name] || []).push({ age: age, T: T, F: F });
      });
    });
    const at = (list, plus) => Math.min(1, list.reduce((sum, p) => {
      const x = (p.age + plus) / p.T;
      return sum + (x >= 1 ? 0 : p.F * 0.5 * (1 + Math.cos(Math.PI * x)));
    }, 0));
    const out = {};
    Object.keys(parts).forEach((m) => {
      const load = at(parts[m], 0);
      let h = 0;
      while (h < 200 && at(parts[m], h) >= 0.12) h += 1;
      out[m] = { load: load, hours: h };
    });
    return out;
  }

     (verde neón, amarillo ácido, bermellón y rosa, en la línea de Superpower). Sobre negro van
     a plena intensidad; sobre claro, un paso más profundo para que se vean. */
  colors(dark) {
    return dark ? {
      fuerza: '#FC5F2B', resistencia: '#4DA3FF', constancia: '#00FCA1', tecnica: '#B39DFF', heat: '#FC5F2B',

      prot: '#4DA3FF', carb: '#E8FC00', fat: '#FF68DE', fib: '#00FCA1'
    } : {
      fuerza: '#F2541F', resistencia: '#2A7FE0', constancia: '#11C182', tecnica: '#6F5FEA', heat: '#F2541F',
      fuerzaText: '#C2410C', resistenciaText: '#1D63B0', constanciaText: '#0B7A53', tecnicaText: '#5544D6', heatText: '#C2410C',
      accent: '#18181B', accentText: '#71717A',

    };
  }

  /* Color de salud: rosa (0) → bermellón (45) → amarillo ácido (70) → verde neón (85 y más) */
  healthColor(s, dark) {
    if (s == null || !isFinite(s)) return dark ? '#A1A1AA' : '#71717A';
    const x = Math.max(0, Math.min(100, s));
    const A = dark
      ? [[0, '#FF68DE'], [45, '#FC5F2B'], [70, '#E8FC00'], [85, '#00FCA1'], [100, '#00E59A']]
      : [[0, '#E0368C'], [45, '#F2541F'], [70, '#C8C400'], [85, '#11C182'], [100, '#0E9F6E']];
    for (let i = 1; i < A.length; i++) {
      if (x <= A[i][0]) return this.mix(A[i - 1][1], A[i][1], (x - A[i - 1][0]) / (A[i][0] - A[i - 1][0]));
    }
    return A[A.length - 1][1];
  }

  /* El mismo tono, más oscuro, para escribir sobre fondos claros (≥ 4,5:1); en oscuro es el mismo color */
  healthText(s, dark) {
    if (dark || s == null || !isFinite(s)) return this.healthColor(s, dark);
    return this.mix(this.healthColor(s, false), '#000000', 0.45);
  }

  hsl(h, s, l) {
    s /= 100; l /= 100;
    const k = (n) => (n + h / 30) % 12;
    const a = s * Math.min(l, 1 - l);
    const f = (n) => Math.round(255 * (l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1)))).toString(16).padStart(2, '0');
    return '#' + f(0) + f(8) + f(4);
  }

  haloCss(color, at) {
    const c = color || '#A1A1AA';
    return 'radial-gradient(120% 82% at 50% ' + (at || 122) + '%, ' + this.mix(c, '#FFFFFF', 0.35) + ' 0%, ' + c + ' 16%, ' + this.mix(c, '#000000', 0.62) + ' 36%, rgba(11, 11, 12, 0) 66%)';
  }

  /* ---------- fechas ---------- */

  week() {
    const now = new Date();
    const t = (now.getDay() + 6) % 7;
    const out = [];
    for (let i = 0; i < 7; i++) out.push(new Date(now.getFullYear(), now.getMonth(), now.getDate() - t + i));
    return out;
  }

  mondayOf(d) {
    const t = (d.getDay() + 6) % 7;
    return new Date(d.getFullYear(), d.getMonth(), d.getDate() - t);
  }

  keyOf(d) {
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return d.getFullYear() + '-' + m + '-' + day;
  }

  dateOf(key) {
    const p = key.split('-').map(Number);
    return new Date(p[0], p[1] - 1, p[2]);
  }

  todayIdx() { return (new Date().getDay() + 6) % 7; }

  selIdx() { return this.state.sel == null ? this.todayIdx() : this.state.sel; }

  dayNames() { return ['lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado', 'domingo']; }

  monthNames() { return ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre']; }

  longDate(d) {
    const n = this.dayNames()[(d.getDay() + 6) % 7];
    return n.charAt(0).toUpperCase() + n.slice(1) + ' ' + d.getDate() + ' de ' + this.monthNames()[d.getMonth()];
  }


  peso() {
    const p = Number(this.state.peso ?? this.props.peso ?? 70);
    return p > 0 ? p : 70;
  }

  buildSummary(r, q, date) {
    const I = this.intensities()[q.intensity] || this.intensities().moderada;
    const sf = q.series == null ? 1 : q.series;
    const minutes = q.minutes || r.minutes;
    const peso = this.peso();
    // MET (Compendium, entrenamiento con peso corporal) × kg × horas
    const kcal = Math.round((I.met * peso * (minutes / 60)) / 5) * 5;
    return {
      id: r.id, name: r.name, title: r.title, minutes: minutes,
      date: this.keyOf(date || new Date()),
      intensityKey: q.intensity || 'moderada', intensity: I.label, series: sf,
      setsDone: q.setsDone || null, setsTotal: q.setsTotal || null,
      kcal: kcal, peso: peso,
      muscles: r.muscles.map((m) => ({
        name: m.name, role: m.w >= 1 ? 'principal' : 'secundario',
        w: Math.round(m.w * (0.5 + 0.5 * sf) * 100) / 100
      }))
    };
  }

  seedDemo() {
    const R = this.routinesById();
    const plan = this.state.plan;
    const log = {};
    const now = new Date();
    const today0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const ti = this.todayIdx();
    const quizzes = [[60, 'dura', 1], [45, 'moderada', 0.8], [60, 'limite', 1], [75, 'dura', 1], [45, 'moderada', 1], [60, 'dura', 0.8], [60, 'moderada', 1]];
    let k = 0;
    for (let off = ti + 42; off >= 1; off--) {
      const d = new Date(today0.getFullYear(), today0.getMonth(), today0.getDate() - off);
      const rid = plan[(d.getDay() + 6) % 7];
      if (!rid || (rid === 'caminata' && off % 14 > 6)) continue;
      const key = this.keyOf(d);
      if (k === 4 || k === 13) { log[key] = { status: 'missed' }; k++; continue; }
      const q = quizzes[k % quizzes.length];
      log[key] = { status: 'done', summary: this.buildSummary(R[rid], { minutes: q[0], intensity: q[1], series: q[2] }, d) };
      k++;
    }
    return { log: log };
  }

  metrics(st) {
    const m = { sessions: 0, minutes: 0, kcal: 0 };
    Object.keys(st.log).forEach((key) => {
      const e = st.log[key];
      if (!e || e.status !== 'done' || !e.summary) return;
      m.sessions += 1;
      m.minutes += e.summary.minutes || 0;
      m.kcal += e.summary.kcal || 0;
    });
    return m;
  }

  fmt(n) {
    return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  }

  /* ---------- acciones ---------- */

  nav() {
    const pv = this.props.pantalla || 'inicio';
    const tabMap = { habitos: 'habitos', comida: 'comida', salud: 'salud', area: 'salud', ajustes: 'ajustes' };
    return {
      screen: this.state.screen ?? (['confirmar', 'test', 'victoria', 'sesion', 'eval', 'area'].indexOf(pv) >= 0 ? pv : pv === 'evaluacion' ? 'eval' : 'inicio'),
      tab: this.state.tab ?? (tabMap[pv] || 'inicio'),
      menu: this.state.menu ?? (pv === 'perfil')
    };
  }

  go(patch, cb) {
    const n = this.nav();
    this.setState(Object.assign({ screen: n.screen, tab: n.tab, menu: n.menu }, patch), cb);
  }

  setPref(k, v) {
    const prefs = Object.assign({}, this.state.prefs);
    prefs[k] = v;
    this.setState({ prefs: prefs }, () => this.persist());
  }

  answerYes() {
    this.sfx('tap');
    this.go({ screen: 'test', menu: false, quiz: { step: 0, minutes: null, intensity: null, series: null } });
  }

  answerNo() {
    this.sfx('tap');
    const key = this.keyOf(this.week()[this.selIdx()]);
    const log = Object.assign({}, this.state.log);
    if (!log[key]) log[key] = { status: 'missed', optional: (this.routineAt(this.selIdx()) || {}).id === 'caminata' };
    this.go({ log: log, screen: 'inicio' }, () => this.persist());
  }

  quizPick(field, value) {
    this.sfx('pick');
    const q = Object.assign({}, this.state.quiz);
    q[field] = value;
    this.setState({ quiz: q });
    if (this.timer) clearTimeout(this.timer);
    this.timer = setTimeout(() => {
      if (q.step >= 2) this.finish(q);
      else this.setState({ quiz: Object.assign({}, q, { step: q.step + 1 }) });
    }, 220);
  }

  finish(q) {
    const R = this.routinesById();
    const si = this.selIdx();
    const r0 = this.routineAt(si);
    const r = r0 || R.superiorA;
    const st = this.state;
    const days = this.week();
    const s = this.buildSummary(r, q, days[si]);
    s.meta = st.prefs.meta;
    s.at = si === this.todayIdx() ? Date.now() : days[si].getTime() + 19 * 3600000;
    if (!r0) { s.weekDone = 0; this.go({ last: s, screen: 'victoria' }, () => this.startAnim()); return; }
    const log = Object.assign({}, st.log);
    const dkey = this.keyOf(days[si]);
    // repeticiones de la sesión → historial de cada ejercicio, récords e hitos
    let xlog = st.xlog || {};
    if (st.sess && st.sess.rid === r.id && st.sess.reps) {
      const rr = this.recordReps(st.sess, dkey);
      xlog = rr.xlog;
      if (rr.prs.length) s.prs = rr.prs;
    }
    log[dkey] = { status: 'done', summary: s };
    s.weekDone = days.filter((d) => log[this.keyOf(d)] && log[this.keyOf(d)].status === 'done').length;
    const total = Object.keys(log).filter((k) => log[k] && log[k].status === 'done').length;
    const ms = this.milestoneOf(total);
    if (ms) s.milestone = ms;
    this.go({ log: log, xlog: xlog, sess: null, last: s, screen: 'victoria' }, () => { this.persist(); this.startAnim(); });
  }

  moveHome(k, dir) {
    const ord = this.state.prefs.homeOrder.slice();
    const i = ord.indexOf(k), j = i + dir;
    if (i < 0 || j < 0 || j >= ord.length) return;
    this.sfx('tap');
    ord[i] = ord[j]; ord[j] = k;
    this.setPref('homeOrder', ord);
  }

  toggleHome(k) {
    this.sfx('tap');
    const h = Object.assign({}, this.state.prefs.homeHidden || {});
    h[k] = !h[k];
    this.setPref('homeHidden', h);
  }

  setPeso(d) {
    this.sfx('tap');
    const p = Math.max(35, Math.min(180, this.peso() + d));
    this.setState({ peso: p }, () => this.persist());
  }

  setMeta(d) {
    this.sfx('tap');
    this.setPref('meta', Math.max(1, Math.min(7, this.state.prefs.meta + d)));
  }

  cyclePlan(i) {
    this.sfx('tap');
    const order = this.planOrder();
    const cur = this.state.plan[i] || null;
    const nx = order[(order.indexOf(cur) + 1) % order.length];
    const plan = Object.assign({}, this.state.plan);
    if (nx) plan[i] = nx; else delete plan[i];
    this.setState({ plan: plan }, () => this.persist());
  }

  resetAll() {
    if (!this.state.resetArmed) {
      this.sfx('no');
      this.setState({ resetArmed: true });
      if (this.rt) clearTimeout(this.rt);
      this.rt = setTimeout(() => this.setState({ resetArmed: false }), 4000);
      return;
    }
    this.go({
      log: {}, hlog: {}, flog: {}, xlog: {}, hpHist: [], daily: {}, dayScores: {}, frev: null, last: null, resetArmed: false, noDemo: true, tab: 'inicio', sel: null, sess: null, since: this.keyOf(new Date())
    }, () => this.persist());
  }

  habitCfg() {
    const p = this.state.prefs;
    const hp = p.habits || {};
    const on = hp.on || this.habitCatalog().filter((h) => h.def).map((h) => h.id);
    return { on: on, goals: hp.goals || {}, cues: hp.cues || {}, minis: hp.minis || {} };
  }

  setHabitCfg(patch) {
    const cfg = this.habitCfg();
    this.setPref('habits', Object.assign({ on: cfg.on, goals: cfg.goals, cues: cfg.cues, minis: cfg.minis }, patch));
  }

  waterGoal(date) {
    // ~30 ml por kg al día en bebidas (los 3,7 L de referencia para hombres incluyen comida) + 500 ml si entrenas.
    const base = Math.max(8, Math.round((this.peso() * 30) / 250));
    const r = this.routineAt((date.getDay() + 6) % 7);
    return base + (r && r.id !== 'caminata' ? 2 : 0);
  }

  habitGoal(h, date) {
    if (h.id === 'agua') return this.habitCfg().goals.agua || this.waterGoal(date);
    return this.habitCfg().goals[h.id] || h.goal || 1;
  }

  // fracción cumplida de un hábito en un día: null = no aplica (descanso), 0..1
  habitFrac(h, key, date) {
    const st = this.state;
    if (h.kind === 'auto') {
      const r = this.routineAt((date.getDay() + 6) % 7);
      const e = st.log[key];
      if (e && e.status === 'done') return 1;
      if (!r || r.id === 'caminata') return null;
      return 0;
    }
    if (h.kind === 'food') { const t = this.targets().prot; return Math.min(1, this.dayTotals(key).p / t); }
    const d = (st.hlog || {})[key] || {};
    const mini = !!d[h.id + '~'];
    let f = h.kind === 'bin' ? (d[h.id] ? 1 : 0) : Math.min(1, (d[h.id] || 0) / this.habitGoal(h, date));
    if (mini && f < 0.5) f = 0.5;
    return f;
  }

  // para la racha: cumplido, versión mínima o «casi» (75 % o más: dormir 7 de 8 h no corta la racha)
  habitMet(h, key, date) {
    const f = this.habitFrac(h, key, date);
    if (f === null) return null;
    const d = ((this.state.hlog || {})[key] || {});
    return f >= 0.75 || !!d[h.id + '~'];
  }

  // 0..1: el puntaje del día (guardado si el día ya cerró; ver progreso.js)
  dayScore(key, date) {
    const sc = this.scoreFor(key, date);
    return sc ? sc.s / 100 : null;
  }

  habitStreak(h, today0) {
    let streak = 0;
    for (let i = 0; i < 400; i++) {
      const d = new Date(today0.getFullYear(), today0.getMonth(), today0.getDate() - i);
      const m = this.habitMet(h, this.keyOf(d), d);
      if (m === null) continue;
      if (m) streak++;
      else if (i === 0) continue;
      else break;
    }
    return streak;
  }

  setHabit(key, id, v) {
    const hl = Object.assign({}, this.state.hlog || {});
    hl[key] = Object.assign({}, hl[key] || {});
    if (v === null || v === 0 || v === false) delete hl[key][id]; else hl[key][id] = v;
    this.setState({ hlog: hl }, () => { if (key < this.keyOf(new Date())) this.saveScore(key); this.persist(); });
  }

  habitDate() {
    const now = new Date();
    return new Date(now.getFullYear(), now.getMonth(), now.getDate() + (this.state.hday || 0));
  }

  fmtNum(v) { return String(Math.round(v * 10) / 10).replace('.', ','); }

  habitValueLabel(h, v, goal) {
    if (h.kind === 'bin') return v ? 'Hecho' : 'Pendiente';
    if (h.id === 'pasos') return this.fmtNum(v) + ' de ' + goal + ' mil pasos';
    return this.fmtNum(v) + ' de ' + this.fmtNum(goal) + ' ' + h.unit;
  }

      if (h.kind === 'num' && f > 0 && f < 1) status += ' · ' + Math.round(f * 100) + ' %' + (f >= 0.75 ? ', casi' : '');

      items.push({

        minus: () => { this.sfx('tap'); this.setHabit(key, h.id, Math.max(0, Math.round((v - step) * 10) / 10)); },
        plus: () => { const nv = v < (h.min || 0) ? h.min : Math.round((v + step) * 10) / 10; this.sfx(nv >= goal && v < goal ? 'pick' : 'tap'); this.setHabit(key, h.id, nv); },
        doMini: () => { this.sfx('pick'); this.setHabit(key, h.id + '~', true); },
        valueShort: h.kind === 'num' ? this.fmtNum(v) : ''
      });
    });
    // agua
    const wOn = cfg.on.indexOf('agua') >= 0;
    const wGoal = this.habitGoal({ id: 'agua' }, date);
    const w = d.agua || 0;
    const glasses = [];
    for (let i = 1; i <= Math.max(wGoal, w); i++) {
      const full = i <= w;
      glasses.push({
        aria: 'Vaso ' + i + (full ? ', tomado' : ''),
        fill: full ? c.resistencia : 'none', stroke: full ? c.resistencia : th.tertiary,
        bg: full ? tint('resistencia') : th.segBg,
        pick: () => { this.sfx(full ? 'tap' : 'pick'); this.setHabit(key, 'agua', i === w ? i - 1 : i); }

  hhmm(m) { m = ((m % 1440) + 1440) % 1440; return Math.floor(m / 60) + ':' + String(m % 60).padStart(2, '0'); }

  pushSupported() {
    if (this.isNative()) return true;
    try { return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window; } catch (e) { return false; }
  }

  isStandalone() {
    if (this.isNative()) return true;
    try { return window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches; } catch (e) { return false; }
  }

  b64u(bytes) {
    let s = '';
    bytes.forEach((b) => { s += String.fromCharCode(b); });
    return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }

  fromB64u(str) {
    const s = atob(str.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((str.length + 3) % 4));
    return Uint8Array.from(s, (ch) => ch.charCodeAt(0));
  }

  async enablePush() {
    if (this.isNative()) return this.nativeEnable();
    // requestPermission tiene que ser lo primero tras el toque (iOS exige el gesto del usuario)
    let perm = 'default';
    try { perm = await Notification.requestPermission(); } catch (e) {}
    this.sfx('tap');
    if (perm !== 'granted') {
      this.setState({ pushMsg: 'Sin permiso. Actívalo en Ajustes del iPhone, Notificaciones, keystone.' });
      return;
    }
    try {
      let keys = this.state.prefs.pushKeys;
      if (!keys) {
        const kp = await crypto.subtle.generateKey({ name: 'ECDSA', namedCurve: 'P-256' }, true, ['sign', 'verify']);
        const raw = new Uint8Array(await crypto.subtle.exportKey('raw', kp.publicKey));
        const jwk = await crypto.subtle.exportKey('jwk', kp.privateKey);
        keys = { pub: this.b64u(raw), priv: jwk.d };
      }
      const reg = await navigator.serviceWorker.ready;
      let sub = await reg.pushManager.getSubscription();
      if (sub) {
        const cur = sub.options && sub.options.applicationServerKey ? this.b64u(new Uint8Array(sub.options.applicationServerKey)) : null;
        if (cur && cur !== keys.pub) { await sub.unsubscribe(); sub = null; }
      }
      if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: this.fromB64u(keys.pub) });
      const p = Object.assign({}, this.state.prefs, { pushKeys: keys, pushSub: sub.toJSON(), remDirty: true });
      this.setState({ prefs: p, pushMsg: 'Activados en este teléfono. Falta el último paso: copia el código y pégalo en GitHub.' }, () => this.persist());
      this.sfx('yes');
    } catch (e) {
      this.setState({ pushMsg: 'No se pudo activar: ' + (e && e.message ? e.message : 'error desconocido') });
    }
  }

  pushCode() {
    const p = this.state.prefs;
    if (!p.pushSub || !p.pushKeys) return '';
    const r = this.remCfg();
    const days = [];
    for (let i = 0; i < 7; i++) { const rr = this.routineAt(i); if (rr && rr.id !== 'caminata') days.push(i + 1); }
    let tz = 'America/Santiago';
    try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || tz; } catch (e) {}
    const cfg = { v: 1, tz: tz, sub: p.pushSub, pub: p.pushKeys.pub, priv: p.pushKeys.priv, rem: r, days: days };
    const json = JSON.stringify(cfg);
    return this.b64u(new TextEncoder().encode(json));
  }

  hp() {
    return Object.assign({ sexo: null, edad: 28, altura: 172, objetivo: 'mantener', ejDias: '3-4', pasos: '4-7' }, this.state.hp || {}, { peso: this.peso() });
  }

  activityFactor(p) {
    const ej = { '0': 0, '1-2': 1, '3-4': 2, '5+': 3 }[p.ejDias];
    const pa = { '<4': 0, '4-7': 1, '7-10': 2, '>10': 3 }[p.pasos];
    const s = (ej == null ? 2 : ej) + (pa == null ? 1 : pa);
    return [1.2, 1.3, 1.375, 1.45, 1.55, 1.65, 1.725][s];
  }

  /* Gasto con Mifflin-St Jeor × actividad; proteína 1,6 g/kg (2 g/kg si bajas grasa);
     grasa 28 % de la energía; fibra 14 g por cada 1.000 kcal; azúcares libres < 10 %; sodio < 2.000 mg (OMS). */
  targets() {
    const p = this.hp();
    const w = p.peso, h = p.altura, a = p.edad;
    const male = p.sexo !== 'mujer';
    const bmr = 10 * w + 6.25 * h - 5 * a + (male ? 5 : -161);
    const tdee = bmr * this.activityFactor(p);
    const adj = p.objetivo === 'perder' ? 0.85 : p.objetivo === 'ganar' ? 1.08 : 1;
    const kcal = Math.round((tdee * adj) / 10) * 10;
    const prot = Math.round(w * (p.objetivo === 'perder' ? 2 : 1.6));
    const fat = Math.round((kcal * 0.28) / 9);
    const carb = Math.max(0, Math.round((kcal - prot * 4 - fat * 9) / 4));
    return {
      kcal: kcal, prot: prot, carb: carb, fat: fat,
      fib: Math.round((kcal / 1000) * 14), sug: Math.round((kcal * 0.1) / 4), na: 2000,
      bmr: Math.round(bmr), tdee: Math.round(tdee), hasProfile: !!(this.state.hp && this.state.hp.sexo)
    };
  }

  foodEntries(key) { return ((this.state.flog || {})[key] || []); }

  sumItems(items) {
    const t = { kcal: 0, p: 0, c: 0, f: 0, fib: 0, sug: 0, na: 0 };
    (items || []).forEach((it) => { Object.keys(t).forEach((k) => { t[k] += Number(it[k]) || 0; }); });
    return t;
  }

  dayTotals(key) {
    let items = [];
    this.foodEntries(key).forEach((e) => { items = items.concat(e.items || []); });
    return this.sumItems(items);
  }

    let w = 0, s = 0;
    this.foodEntries(key).forEach((e) => { if (e.q) { const k = Math.max(50, this.sumItems(e.items).kcal); w += k; s += e.q * k; } });
    return w ? s / w : null;
  }

    const g = s.match(/AIza[0-9A-Za-z_\-]{20,}|AQ\.[0-9A-Za-z_\-.]{20,}/);
    if (g) return g[0].replace(/\.+$/, '');
    const a = s.match(/sk-ant-[0-9A-Za-z_\-]{10,}/);
    if (a) return a[0];
    return s.replace(/\s+/g, '').replace(/^["'`«»]+|["'`«»]+$/g, '');
  }

    return { provider: a.provider || 'gemini', key: this.cleanKey(a.key), model: model, ok: a.ok || '' };

  /* Cada tarea con su modelo:
