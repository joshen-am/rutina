name: Recordatorios

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      prueba:
        description: 'Enviar una notificación de prueba ahora'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: recordatorios
  cancel-in-progress: false

jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar web-push
        run: npm install --prefix push --no-audit --no-fund
      - name: Recuperar la última ejecución
        uses: actions/cache/restore@v4
        with:
          path: .push-state
          key: push-state-${{ github.run_id }}
          restore-keys: push-state-
      - name: Enviar avisos pendientes
        env:
          RUTINA_PUSH: ${{ secrets.RUTINA_PUSH }}
          PRUEBA: ${{ github.event.inputs.prueba }}
        run: node push/send.mjs
      - name: Guardar la última ejecución
        uses: actions/cache/save@v4
        with:
          path: .push-state
          key: push-state-${{ github.run_id }}
      # GitHub pausa los workflows programados de repos públicos tras 60 días sin actividad.
      - name: Mantener activo el repositorio
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Mantener activos los recordatorios"
            git push
          fi
